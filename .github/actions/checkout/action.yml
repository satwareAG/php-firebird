name: 'Checkout + Version'
description: 'Checkout repository and materialize VERSION.txt'
inputs:
  fetch-depth:
    description: 'Fetch depth for checkout'
    required: false
    default: '1'
outputs:
  version:
    description: 'Resolved extension version'
    value: ${{ steps.version.outputs.version }}
runs:
  using: composite
  steps:
    - name: Checkout repository
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      with:
        fetch-depth: ${{ inputs.fetch-depth }}

    - name: Ensure VERSION.txt file
      id: version
      shell: bash
      run: |
        if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
          echo "${GITHUB_REF#refs/tags/v}" > VERSION.txt
          echo "version source: tag"
        elif [ -f VERSION.txt ]; then
          echo "version source: VERSION.txt"
        elif [ -f php_firebird.h ]; then
          VERSION=$(grep -E '#define PHP_FIREBIRD_VERSION_STRING' php_firebird.h 2>/dev/null | sed 's/.*"\([^"]*\)".*/\1/' | head -1)
          if [ -z "$VERSION" ] || [[ "$VERSION" == *"unknown"* ]]; then
            echo "ERROR: Cannot determine version (empty or 'unknown' in header)" >&2
            exit 1
          fi
          echo "${VERSION}" > VERSION.txt
          echo "version source: header"
        else
          echo "ERROR: Cannot determine version (no tag, no VERSION.txt, no php_firebird.h)" >&2
          exit 1
        fi
        VERSION=$(cat VERSION.txt | tr -d '[:space:]')
        echo "version=${VERSION}" >> $GITHUB_OUTPUT
        echo "Extension version: ${VERSION}"
