name: 'Checkout + Version'
description: 'Checkout repository and materialize VERSION.txt'
inputs:
  fetch-depth:
    description: 'Fetch depth for checkout'
    required: false
    default: '1'
outputs:
  version:
    description: 'Resolved extension version'
    value: ${{ steps.version.outputs.version }}
runs:
  using: composite
  steps:
    - name: Checkout repository
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      with:
        fetch-depth: ${{ inputs.fetch-depth }}

    - name: Ensure VERSION.txt file
      id: version
      shell: bash
      run: |
        if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
          echo "${GITHUB_REF#refs/tags/v}" > VERSION.txt
        elif [ ! -f VERSION.txt ]; then
          VERSION=$(grep -E '#define PHP_FIREBIRD_VERSION_STRING' php_firebird.h 2>/dev/null | sed 's/.*"\([^"]*\)".*/\1/' | head -1)
          if [ -z "$VERSION" ]; then
            echo "ERROR: Cannot determine version" >&2
            exit 1
          fi
          echo "${VERSION}" > VERSION.txt
        fi
        echo "version=$(cat VERSION.txt)" >> $GITHUB_OUTPUT
