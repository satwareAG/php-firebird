name: 'Determine PHP Full Version'
description: 'Resolve the latest PHP patch version for a minor version via php.net API with fallback table'
inputs:
  php-minor:
    description: 'PHP minor version (e.g. 8.2, 8.3, 8.4, 8.5)'
    required: true
outputs:
  full-version:
    description: 'Full PHP version (e.g. 8.3.16)'
    value: ${{ steps.php-version.outputs.full_version }}
runs:
  using: composite
  steps:
    - name: Determine PHP Full Version
      id: php-version
      shell: bash
      env:
        MINOR: ${{ inputs.php-minor }}
      run: |
        # Query php.net JSON API for the latest patch release of this minor.
        # Falls back to known-good versions if the API is unavailable.
        LATEST=$(curl -fsSL --retry 3 --retry-delay 5 \
          "https://www.php.net/releases/index.php?json&version=${MINOR}" \
          2>/dev/null | jq -r ".\"${MINOR}\".version // empty" 2>/dev/null || true)

        if [ -n "${LATEST}" ] && [[ "${LATEST}" =~ ^${MINOR}\. ]]; then
          echo "Resolved PHP ${MINOR} latest from php.net: ${LATEST}"
          FULL_VERSION="${LATEST}"
        else
          echo "php.net API unavailable; using known-good fallback"
          case "${MINOR}" in
            8.2) FULL_VERSION="8.2.28" ;;
            8.3) FULL_VERSION="8.3.16" ;;
            8.4) FULL_VERSION="8.4.4" ;;
            8.5) FULL_VERSION="8.5.0" ;;
            *) FULL_VERSION="${MINOR}.0" ;;
          esac
          echo "Fallback version: ${FULL_VERSION}"
        fi

        echo "full_version=${FULL_VERSION}" >> $GITHUB_OUTPUT
        echo "PHP full version: ${FULL_VERSION}"
