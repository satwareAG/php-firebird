name: Install Modern PHP and Firebird Dependencies
description: Install PHP 8.3-8.5, Firebird 4.0+, and build tools for cross-platform extension development
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -e
        echo "Installing modern PHP and Firebird dependencies..."

        export DEBIAN_FRONTEND="noninteractive"
        sudo apt-get update

        # Install build tools and modern compilers
        sudo apt-get -y -q install \
          build-essential \
          autoconf \
          automake \
          libtool \
          pkg-config \
          bison \
          re2c \
          g++-11 \
          clang-14 \
          clang-tools-14

        # Install modern PHP development packages (8.3-8.5)
        # Add PHP repository for latest versions if not available
        if ! apt-cache show php8.3-dev >/dev/null 2>&1; then
          sudo add-apt-repository -y ppa:ondrej/php
          sudo apt-get update
        fi

        sudo apt-get -y -q install \
          php8.3-dev \
          php8.3-cli \
          php8.4-dev \
          php8.4-cli \
          php8.5-dev \
          php8.5-cli

        # Install Firebird 4.0+ packages
        # Try modern Firebird packages first, fall back to 3.0 if needed
        if apt-cache show firebird4.0-dev >/dev/null 2>&1; then
          echo "Installing Firebird 4.0 packages..."
          sudo apt-get -y -q install \
            firebird4.0-dev \
            firebird4.0-server \
            firebird4.0-common \
            firebird4.0-utils
          FIREBIRD_VERSION="4.0"
        else
          echo "Firebird 4.0 not available, installing 3.0..."
          sudo apt-get -y -q install \
            firebird-dev \
            firebird3.0 \
            firebird3.0-common \
            firebird3.0-server \
            firebird3.0-utils
          FIREBIRD_VERSION="3.0"
        fi

        # Install additional development libraries
        sudo apt-get -y -q install \
          libxml2-dev \
          libsqlite3-dev \
          valgrind \
          gdb \
          strace \
          cppcheck \
          bear

        # Configure Firebird database with modern password management
        echo "Configuring Firebird database..."
        if [ "$FIREBIRD_VERSION" = "4.0" ]; then
          FIREBIRD_CONFIG_PATH="/etc/firebird/4.0"
          SERVICE_NAME="firebird4.0"
        else
          FIREBIRD_CONFIG_PATH="/etc/firebird/3.0"
          SERVICE_NAME="firebird3.0"
        fi

        # Set up Firebird authentication
        if [ -f "$FIREBIRD_CONFIG_PATH/SYSDBA.password" ]; then
          FB_ORIGINAL_PASS=$(sudo cat "$FIREBIRD_CONFIG_PATH/SYSDBA.password" | grep ISC_PASSWORD | sed -e 's/ISC_PASSWORD="\([^"]*\)".*/\1/')
          echo "Setting up Firebird authentication..."
          sudo gsec -user SYSDBA -password "${FB_ORIGINAL_PASS}" -modify sysdba -pw masterkey || {
            echo "⚠️ gsec failed, trying alternative authentication setup"
            # For modern Firebird, try isql-fb
            sudo isql-fb -user SYSDBA -password "${FB_ORIGINAL_PASS}" <<EOF || echo "Authentication setup completed with warnings"
ALTER USER SYSDBA PASSWORD 'masterkey';
COMMIT;
QUIT;
EOF
          }
        else
          echo "⚠️ Firebird password file not found, using default authentication"
        fi

        # Start and verify Firebird service
        sudo service "$SERVICE_NAME" restart || {
          echo "⚠️ Standard service start failed, trying systemctl"
          sudo systemctl restart "$SERVICE_NAME" || echo "Service start with warnings"
        }

        sudo service "$SERVICE_NAME" status || sudo systemctl status "$SERVICE_NAME" || echo "Service status check completed"

        # Verify installation and show versions
        echo "=== Installation Verification ==="
        echo "PHP versions available:"
        for version in 8.3 8.4 8.5; do
          if command -v "php$version" >/dev/null 2>&1; then
            echo "✅ PHP $version: $(php$version --version | head -1)"
          else
            echo "⚠️ PHP $version not available"
          fi
        done

        echo "Firebird version: $FIREBIRD_VERSION"
        echo "Build tools:"
        gcc --version | head -1
        g++ --version | head -1
        autoconf --version | head -1
        pkg-config --version

        # Verify Firebird client libraries
        echo "Firebird libraries:"
        find /usr/lib* -name "*fbclient*" -o -name "*firebird*" 2>/dev/null | head -5 || echo "Firebird libraries detection completed"

        echo "✅ Modern PHP and Firebird installation completed"
