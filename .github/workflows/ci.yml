name: CI

on:
  push:
    paths:
      - '**.c'
      - '**.cpp'
      - '**.h'
      - '**.hpp'
      - 'tests/**'
      - 'config.m4'
      - 'config.w32'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - '**.c'
      - '**.cpp'
      - '**.h'
      - '**.hpp'
      - 'tests/**'
      - 'config.m4'
      - 'config.w32'
      - '.github/workflows/ci.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

# Cancel in-progress runs for the same ref when a new push arrives.
# This avoids wasting runner minutes on stale builds while keeping
# manual dispatches and scheduled nightly runs independent.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' }}

jobs:
  linux-matrix-build:
    name: PHP ${{ matrix.php-version }} / Firebird ${{ matrix.firebird-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          # Matrix: PHP 8.2/8.3/8.4/8.5 × FB 3.0/4.0/5.0 = 12 combinations
          # PHP 8.2: Minimum supported (PHP 8.1 dropped in v7.2.0)
          # PHP 8.3: Intermediate — full row (FB 3.0, 4.0, 5.0) as of issue #97
          # PHP 8.4: Current recommended
          # PHP 8.5: Current latest stable (released 2025-11-20, active support until 2027-12-31) — issue #98
          # FB 3.0: Stable with modern auth (Srp) — actively supported
          # FB 4.0: Batch ops, time zones, DECFLOAT, INT128 (FB_API_VER=40) — actively supported
          # FB 5.0: Latest features, scrollable cursors — actively supported

          # PHP 8.2 combinations
          - php-version: '8.2'
            firebird-version: '3.0'
            firebird-image: 'firebirdsql/firebird:3'
            fb-client-version: '3.0'
            db-path: '/var/lib/firebird/data/test.fdb'
          - php-version: '8.2'
            firebird-version: '4.0'
            firebird-image: 'firebirdsql/firebird:4'
            fb-client-version: '4.0'
            db-path: '/var/lib/firebird/data/test.fdb'
          - php-version: '8.2'
            firebird-version: '5.0'
            firebird-image: 'firebirdsql/firebird:5'
            fb-client-version: '5.0'
            db-path: '/var/lib/firebird/data/test.fdb'

          # PHP 8.3 combinations (full row — FB 3.0, 4.0, 5.0)
          - php-version: '8.3'
            firebird-version: '3.0'
            firebird-image: 'firebirdsql/firebird:3'
            fb-client-version: '3.0'
            db-path: '/var/lib/firebird/data/test.fdb'
          - php-version: '8.3'
            firebird-version: '4.0'
            firebird-image: 'firebirdsql/firebird:4'
            fb-client-version: '4.0'
            db-path: '/var/lib/firebird/data/test.fdb'
          - php-version: '8.3'
            firebird-version: '5.0'
            firebird-image: 'firebirdsql/firebird:5'
            fb-client-version: '5.0'
            db-path: '/var/lib/firebird/data/test.fdb'

          # PHP 8.4 combinations
          - php-version: '8.4'
            firebird-version: '3.0'
            firebird-image: 'firebirdsql/firebird:3'
            fb-client-version: '3.0'
            db-path: '/var/lib/firebird/data/test.fdb'
          - php-version: '8.4'
            firebird-version: '4.0'
            firebird-image: 'firebirdsql/firebird:4'
            fb-client-version: '4.0'
            db-path: '/var/lib/firebird/data/test.fdb'
          - php-version: '8.4'
            firebird-version: '5.0'
            firebird-image: 'firebirdsql/firebird:5'
            fb-client-version: '5.0'
            db-path: '/var/lib/firebird/data/test.fdb'

          # PHP 8.5 combinations (stable since 2025-11-20 — issue #98)
          - php-version: '8.5'
            firebird-version: '3.0'
            firebird-image: 'firebirdsql/firebird:3'
            fb-client-version: '3.0'
            db-path: '/var/lib/firebird/data/test.fdb'
          - php-version: '8.5'
            firebird-version: '4.0'
            firebird-image: 'firebirdsql/firebird:4'
            fb-client-version: '4.0'
            db-path: '/var/lib/firebird/data/test.fdb'
          - php-version: '8.5'
            firebird-version: '5.0'
            firebird-image: 'firebirdsql/firebird:5'
            fb-client-version: '5.0'
            db-path: '/var/lib/firebird/data/test.fdb'

    # Run Firebird as a service container
    services:
      firebird:
        image: ${{ matrix.firebird-image }}
        env:
          # Common settings
          ISC_PASSWORD: masterkey
          FIREBIRD_DATABASE: test.fdb
          FIREBIRD_PASSWORD: masterkey
          FIREBIRD_USER: SYSDBA
        ports:
          - 3050:3050

    container:
      image: php:${{ matrix.php-version }}-cli-bookworm

    env:
      ISC_USER: SYSDBA
      ISC_PASSWORD: masterkey
      FIREBIRD_HOST: firebird
      # jane: FIREBIRD_DB_DIR gives each test a unique DB (avoids metadata
      # lock conflicts between procedural and PDO paths on the same DB).
      # FIREBIRD_DB_PATH is still set for pdo_fbird.inc (shared test.fdb).
      FIREBIRD_DB_DIR: /tmp
      FIREBIRD_DB_PATH: ${{ matrix.db-path }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Ensure VERSION.txt
        uses: ./.github/actions/version

      - name: Install Firebird client
        uses: ./.github/actions/install-firebird-client
        with:
          firebird-major-version: ${{ matrix.fb-client-version }}
          verbose-download: 'true'

      - name: Build firebird extension
        uses: ./.github/actions/build-extension
        with:
          build-pdo-fbird: 'false'
          ld-library-path-extra: /opt/firebird-client/lib
          cflags-extra: -I/opt/firebird-client/include
          ldflags-extra: -L/opt/firebird-client/lib

      - name: Build pdo_fbird extension
        shell: bash
        run: |
          set -eu
          cd "${BUILD_DIR}/pdo_fbird"
          rm -f modules/pdo_fbird.so 2>/dev/null || true
          phpize --clean
          phpize
          ./configure --with-pdo-fbird --with-firebird=/opt/firebird-client
          make -j"$(nproc)"
          echo "pdo_fbird built successfully"
          ls -la modules/pdo_fbird.so

      - name: Verify extension and connection
        uses: ./.github/actions/verify-extension
        with:
          mode: full
          extension-path: ${{ env.BUILD_DIR }}/modules/firebird.so
          ld-library-path-extra: /opt/firebird-client/lib

      - name: Cache Composer dependencies
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install Composer dependencies
        run: |
          # Download composer binary only if not already present
          if ! command -v composer >/dev/null 2>&1; then
            EXPECTED_SIGNATURE="$(curl -sS https://composer.github.io/installer.sig)"
            curl -sS https://getcomposer.org/installer -o /tmp/composer-setup.php
            ACTUAL_SIGNATURE="$(php -r "echo hash_file('sha384', '/tmp/composer-setup.php');")"
            [ "$EXPECTED_SIGNATURE" = "$ACTUAL_SIGNATURE" ] || { echo "ERROR: Invalid Composer installer signature"; exit 1; }
            php /tmp/composer-setup.php --install-dir=/usr/local/bin --filename=composer
            rm -f /tmp/composer-setup.php
          fi
          composer install --prefer-dist --no-progress --no-interaction

      - name: Run PHPT tests
        env:
          NO_INTERACTION: 1
          REPORT_EXIT_STATUS: 1
        run: |
          set -eu

          # jane: run-tests.php is generated by phpize in BUILD_DIR (out-of-tree
          # build). Copy it to GITHUB_WORKSPACE so tests run from the source
          # tree where vendor/autoload.php and tests/ are located.
          cp "${BUILD_DIR}/run-tests.php" .

          EXTENSION_PATH="${BUILD_DIR}/modules/firebird.so"
          PDO_FBIRD_PATH="${BUILD_DIR}/pdo_fbird/modules/pdo_fbird.so"

          # Build -d flags: load both extensions explicitly.
          # jane: make test only loads the main extension; run-tests.php with
          # explicit -d flags loads both firebird.so AND pdo_fbird.so.
          EXT_FLAGS="-d extension=${EXTENSION_PATH}"
          if [ -f "$PDO_FBIRD_PATH" ]; then
            EXT_FLAGS="${EXT_FLAGS} -d extension=${PDO_FBIRD_PATH}"
          fi

          # Add pcntl extension if not already loaded (needed by fork tests)
          # jane: PHP containers load pcntl via docker-php-ext-install; adding
          # -d extension=pcntl.so when already loaded causes "Module already
          # loaded" warning in every test, failing all tests.
          if ! php -r 'exit(extension_loaded("pcntl") ? 0 : 1);' 2>/dev/null; then
            PCNTL_SO=$(find $(php-config --extension-dir) -name "pcntl.so" 2>/dev/null || true)
            if [ -n "$PCNTL_SO" ]; then
              EXT_FLAGS="${EXT_FLAGS} -d extension=${PCNTL_SO}"
            fi
          fi

          echo "Test configuration:"
          echo "  FIREBIRD_HOST=${FIREBIRD_HOST}"
          echo "  FIREBIRD_DB_PATH=${FIREBIRD_DB_PATH}"
          echo "  Extensions: ${EXT_FLAGS}"

          echo "Running all PHPT tests..."
          TEST_PHP_EXECUTABLE="$(which php)" \
          php run-tests.php \
            ${EXT_FLAGS} \
            -p "$(which php)" \
            --set-timeout 15 \
            tests/ || TEST_RESULT=$?

          # run-tests.php returns non-zero on test failures
          exit ${TEST_RESULT:-0}

      - name: Upload test failure diffs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-diffs-php${{ matrix.php-version }}-fb${{ matrix.firebird-version }}
          path: tests/**/*.diff
          if-no-files-found: ignore

  # ==========================================================================
  # macOS Build Verification (Issue #171)
  # Build-only: no Firebird server available on GitHub macOS runners
  # ==========================================================================
  macos-build:
    name: macOS ${{ matrix.arch }} (build-only)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
            fb-pkg-suffix: macos-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Ensure VERSION.txt
        uses: ./.github/actions/version

      - name: Install PHP via Homebrew
        run: |
          set -eu
          brew install php pkg-config autoconf
          echo "PHP version: $(php -v | head -1)"
          echo "phpize: $(which phpize)"

      - name: Resolve Firebird macOS package version
        id: fb-version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu

          # Query the latest stable Firebird 5.x release
          TAG=$(curl -s -f --retry 3 \
            -H "Authorization: token ${GITHUB_TOKEN}" \
            "https://api.github.com/repos/FirebirdSQL/firebird/releases" | \
            jq -r '.[].tag_name' | \
            grep -E "^v5\." | \
            grep -vE "(Beta|RC|Release)" | \
            sort -V | tail -n 1)

          if [ -z "${TAG}" ]; then
            echo "ERROR: Could not resolve latest Firebird 5.x tag" >&2
            exit 1
          fi

          # Get the .pkg asset URL for macOS
          RELEASE_JSON=$(curl -s -f --retry 3 \
            -H "Authorization: token ${GITHUB_TOKEN}" \
            "https://api.github.com/repos/FirebirdSQL/firebird/releases/tags/${TAG}")

          PKG_NAME=$(echo "${RELEASE_JSON}" | \
            jq -r '.assets[].name | select(test("${{ matrix.fb-pkg-suffix }}\\.pkg$"))' | head -1)
          PKG_URL=$(echo "${RELEASE_JSON}" | \
            jq -r ".assets[] | select(.name == \"${PKG_NAME}\") | .browser_download_url")

          echo "fb_version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "fb_pkg_name=${PKG_NAME}" >> "$GITHUB_OUTPUT"
          echo "fb_pkg_url=${PKG_URL}" >> "$GITHUB_OUTPUT"
          echo "Resolved: Firebird ${TAG} -> ${PKG_NAME}"

      - name: Cache Firebird macOS package
        id: cache-firebird
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          path: /tmp/firebird-cache
          key: firebird-client-${{ steps.fb-version.outputs.fb_version }}-${{ matrix.fb-pkg-suffix }}

      - name: Download Firebird macOS package
        if: steps.cache-firebird.outputs.cache-hit != 'true'
        env:
          FB_PKG_URL: ${{ steps.fb-version.outputs.fb_pkg_url }}
          FB_PKG_NAME: ${{ steps.fb-version.outputs.fb_pkg_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          mkdir -p /tmp/firebird-cache
          DEST="/tmp/firebird-cache/${FB_PKG_NAME}"

          for attempt in 1 2 3; do
            echo "Downloading Firebird .pkg (attempt ${attempt}/3)..."
            if curl -fsSL --retry 3 --retry-delay 5 \
                -H "Authorization: token ${GITHUB_TOKEN}" \
                "${FB_PKG_URL}" -o "${DEST}"; then
              FSIZE=$(stat -f%z "${DEST}" 2>/dev/null || echo "0")
              if [ "${FSIZE}" -gt 1000000 ]; then
                echo "Download OK (${FSIZE} bytes)"
                break
              fi
              rm -f "${DEST}"
            fi
            sleep 10
          done

          [ -f "${DEST}" ] || { echo "ERROR: Download failed" >&2; exit 1; }

      - name: Extract Firebird headers and libraries from .pkg
        env:
          FB_PKG_NAME: ${{ steps.fb-version.outputs.fb_pkg_name }}
        run: |
          set -eu
          chmod +x .github/scripts/extract-firebird-macos.sh
          .github/scripts/extract-firebird-macos.sh \
            --arch ${{ matrix.fb-pkg-suffix == 'macos-arm64' && 'arm64' || 'x64' }} \
            --pkg-path "/tmp/firebird-cache/${FB_PKG_NAME}" \
            --output /tmp/firebird-client

      - name: Build PHP extension
        run: |
          set -eu

          FB_CLIENT_DIR="/tmp/firebird-client"

          export CFLAGS="-I${FB_CLIENT_DIR}/include"
          export LDFLAGS="-L${FB_CLIENT_DIR}/lib"

          echo "=== Building extension ==="
          phpize
          ./configure --with-firebird="${FB_CLIENT_DIR}"

          make -j"$(sysctl -n hw.ncpu)"

          # Build pdo_fbird as separate extension
          (cd pdo_fbird && phpize && ./configure --with-pdo-fbird --with-firebird="${FB_CLIENT_DIR}" && make -j"$(sysctl -n hw.ncpu)")

          echo "Extension built successfully"
          ls -la modules/firebird.so
          ls -la pdo_fbird/modules/pdo_fbird.so
          file modules/firebird.so

      - name: Patch extension RPATH
        run: |
          set -eu

          FB_CLIENT_DIR="/tmp/firebird-client"
          EXTENSION_PATH="$(pwd)/modules/firebird.so"

          # Fix libfbclient reference: the Firebird .pkg installs with a
          # hardcoded install_name pointing to /Library/Frameworks/...
          # Rewrite to use @rpath so the extension finds the bundled dylib.
          FB_DYLIB_REF=$(otool -L "$EXTENSION_PATH" | grep -o '[^ ]*libfbclient[^ ]*' | head -1 || true)
          if [ -n "$FB_DYLIB_REF" ] && [[ "$FB_DYLIB_REF" != @rpath/* ]]; then
            echo "Rewriting libfbclient reference: $FB_DYLIB_REF -> @rpath/libfbclient.dylib"
            install_name_tool -change "$FB_DYLIB_REF" "@rpath/libfbclient.dylib" "$EXTENSION_PATH"
            install_name_tool -add_rpath "${FB_CLIENT_DIR}/lib" "$EXTENSION_PATH" 2>/dev/null || true
          fi

          # Also fix the bundled dylib's install_name
          FB_DYLIB="${FB_CLIENT_DIR}/lib/libfbclient.dylib"
          if [ -f "$FB_DYLIB" ]; then
            install_name_tool -id "@rpath/libfbclient.dylib" "$FB_DYLIB" 2>/dev/null || true
          fi

          echo "=== RPATH verification ==="
          otool -L "$EXTENSION_PATH"

      - name: Verify extension loads
        uses: ./.github/actions/verify-extension
        with:
          mode: load-only
          extension-path: modules/firebird.so
          dyld-library-path-extra: /tmp/firebird-client/lib

