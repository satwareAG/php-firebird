name: Linux Code Coverage

on:
  push:
  pull_request:
  schedule:
    - cron: '0 0 * * *'

jobs:
  coverage:
    name: Code Coverage (PHP 8.3 / Firebird 5.0)
    runs-on: ubuntu-latest

    # Run Firebird as a service container (same as local docker-compose)
    # Note: Don't use FIREBIRD_USER=SYSDBA - it already exists and will cause constraint violation
    services:
      firebird:
        image: firebirdsql/firebird:5
        env:
          ISC_PASSWORD: masterkey
          FIREBIRD_DATABASE: test.fdb
          FIREBIRD_PASSWORD: masterkey
        ports:
          - 3050:3050

    container:
      image: php:8.3-cli-bookworm

    env:
      ISC_USER: SYSDBA
      ISC_PASSWORD: masterkey
      FIREBIRD_HOST: firebird
      # Path to the database file INSIDE the Firebird container (created by docker entrypoint)
      FIREBIRD_DB_PATH: /var/lib/firebird/data/test.fdb

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies (lcov included)
        run: |
          set -eu
          export DEBIAN_FRONTEND=noninteractive

          for attempt in 1 2 3; do
            if apt-get update; then break; fi
            echo "apt-get update failed (attempt ${attempt}/3), retrying..." >&2
            sleep 5
          done

          apt-get install -y --no-install-recommends \
            autoconf \
            build-essential \
            ca-certificates \
            g++ \
            git \
            libicu-dev \
            libtool \
            netbase \
            netcat-openbsd \
            pkg-config \
            wget \
            curl \
            unzip \
            libtommath1 \
            libncurses6 \
            lcov

          # Create compatibility symlinks for Firebird client libraries
          # Firebird 3.0/4.0/5.0 clients may need older library versions:
          # - libncurses.so.5 (Bookworm has .so.6)
          # - libtommath.so.0 (Bookworm has .so.1)
          echo "Creating library compatibility symlinks..."
          if [ -f /lib/x86_64-linux-gnu/libncurses.so.6 ]; then
            ln -sf /lib/x86_64-linux-gnu/libncurses.so.6 /lib/x86_64-linux-gnu/libncurses.so.5
            ln -sf /lib/x86_64-linux-gnu/libtinfo.so.6 /lib/x86_64-linux-gnu/libtinfo.so.5 2>/dev/null || true
            echo "  Created libncurses.so.5 -> libncurses.so.6"
          fi
          if [ -f /lib/x86_64-linux-gnu/libtommath.so.1 ]; then
            ln -sf /lib/x86_64-linux-gnu/libtommath.so.1 /lib/x86_64-linux-gnu/libtommath.so.0
            echo "  Created libtommath.so.0 -> libtommath.so.1"
          fi
          ldconfig

          # Install pcntl extension for event tests
          docker-php-ext-install pcntl

          rm -rf /var/lib/apt/lists/*

      - name: Install Firebird 5.0 client library
        run: |
          set -eu

          FB_CLIENT_DIR="/opt/firebird-client"
          mkdir -p "${FB_CLIENT_DIR}"

          FB_VERSION="5.0.2"
          FB_BUILD="1613-0"
          FB_TARBALL="Firebird-${FB_VERSION}.${FB_BUILD}-linux-x64.tar.gz"
          FB_URL="https://github.com/FirebirdSQL/firebird/releases/download/v${FB_VERSION}/${FB_TARBALL}"
          FB_EXTRACT_DIR="Firebird-${FB_VERSION}.${FB_BUILD}-linux-x64"

          echo "Installing Firebird ${FB_VERSION} client library..."

          # Download with retries
          for attempt in 1 2 3 4 5; do
            echo "Downloading FB client (attempt ${attempt}/5)..."
            if curl -fsSL --retry 3 --retry-delay 5 "${FB_URL}" -o "/tmp/${FB_TARBALL}"; then
              FSIZE=$(stat -c%s "/tmp/${FB_TARBALL}" 2>/dev/null || echo "0")
              if [ "${FSIZE}" -gt 8000000 ]; then
                echo "Download successful (${FSIZE} bytes)"
                break
              fi
              rm -f "/tmp/${FB_TARBALL}"
            fi
            sleep 10
          done

          if [ ! -f "/tmp/${FB_TARBALL}" ]; then
            echo "ERROR: Failed to download FB client" >&2
            exit 1
          fi

          # Extract
          cd /tmp
          tar xzf "${FB_TARBALL}"
          cd "${FB_EXTRACT_DIR}"
          tar xzf buildroot.tar.gz

          # Copy headers and libraries
          if [ -d "opt/firebird/include" ]; then
            mkdir -p "${FB_CLIENT_DIR}/include"
            cp -a opt/firebird/include/* "${FB_CLIENT_DIR}/include/"
          fi
          if [ -d "opt/firebird/lib" ]; then
            mkdir -p "${FB_CLIENT_DIR}/lib"
            cp -a opt/firebird/lib/* "${FB_CLIENT_DIR}/lib/"
          fi

          # Debug: Show what we have
          echo "=== Contents of FB_CLIENT_DIR/lib ==="
          ls -la "${FB_CLIENT_DIR}/lib/" || echo "No lib directory"

          # Install ALL library files from the Firebird client package
          # libfbclient depends on libtomcrypt and libtommath - all must be available
          echo "=== Installing ALL libraries to system paths ==="

          # Copy all actual library files (not symlinks) first
          for libfile in "${FB_CLIENT_DIR}/lib/"*.so*; do
            if [ -f "$libfile" ] && [ ! -L "$libfile" ]; then
              LIBNAME=$(basename "$libfile")
              echo "Copying actual library: $LIBNAME"
              cp "$libfile" /usr/lib/
              cp "$libfile" /usr/local/lib/ 2>/dev/null || true
            fi
          done

          # Now create proper symlinks for libfbclient
          if [ -f /usr/lib/libfbclient.so.*.*.* ] 2>/dev/null; then
            FBCLIENT_REAL=$(ls /usr/lib/libfbclient.so.*.*.* 2>/dev/null | head -1)
            FBCLIENT_NAME=$(basename "$FBCLIENT_REAL")
            echo "Creating symlinks for $FBCLIENT_NAME"
            ln -sf "$FBCLIENT_NAME" /usr/lib/libfbclient.so.2
            ln -sf libfbclient.so.2 /usr/lib/libfbclient.so
            ln -sf "$FBCLIENT_NAME" /usr/local/lib/libfbclient.so.2 2>/dev/null || true
            ln -sf libfbclient.so.2 /usr/local/lib/libfbclient.so 2>/dev/null || true
          fi

          # Create symlinks for libtomcrypt if present
          if [ -f /usr/lib/libtomcrypt.so.*.*.* ] 2>/dev/null; then
            TOMCRYPT_REAL=$(ls /usr/lib/libtomcrypt.so.*.*.* 2>/dev/null | head -1)
            TOMCRYPT_NAME=$(basename "$TOMCRYPT_REAL")
            echo "Creating symlinks for $TOMCRYPT_NAME"
            ln -sf "$TOMCRYPT_NAME" /usr/lib/libtomcrypt.so.1
            ln -sf libtomcrypt.so.1 /usr/lib/libtomcrypt.so
          fi

          # Copy headers directly
          cp -a "${FB_CLIENT_DIR}/include"/* /usr/include/ 2>/dev/null || true

          # Configure dynamic linker - add all library paths
          echo "${FB_CLIENT_DIR}/lib" > /etc/ld.so.conf.d/firebird-client.conf
          echo "/usr/local/lib" >> /etc/ld.so.conf.d/firebird-client.conf
          echo "/usr/lib" >> /etc/ld.so.conf.d/firebird-client.conf
          ldconfig

          # Verify installation
          echo "=== Verifying library installation ==="
          ldconfig -p | grep -E "(fbclient|tomcrypt)" || echo "Warning: libraries not in ldconfig cache"
          echo "=== Libraries in /usr/lib ==="
          ls -la /usr/lib/libfbclient* /usr/lib/libtomcrypt* /usr/lib/libib_util* 2>/dev/null || echo "Some libraries missing"
          ls -la /usr/include/ibase.h || echo "Warning: ibase.h not in /usr/include"

          # Verify libfbclient can be loaded (check dependencies)
          echo "=== Checking libfbclient dependencies ==="
          ldd /usr/lib/libfbclient.so 2>&1 || echo "Warning: could not check libfbclient dependencies"

          # Verify
          if [ ! -f "${FB_CLIENT_DIR}/include/ibase.h" ]; then
            echo "ERROR: ibase.h not found" >&2
            exit 1
          fi

          echo "Firebird ${FB_VERSION} client installed successfully"

      - name: Wait for Firebird service
        run: |
          set -eu
          echo "Waiting for Firebird service to be ready..."

          for i in $(seq 1 60); do
            if nc -z firebird 3050 2>/dev/null; then
              echo "Firebird is listening on firebird:3050"
              sleep 3
              break
            fi
            echo "Waiting for Firebird (attempt ${i}/60)..."
            sleep 2
          done

          if ! nc -z firebird 3050 2>/dev/null; then
            echo "ERROR: Firebird service did not start" >&2
            exit 1
          fi

      - name: Build PHP extension with Coverage
        run: |
          set -eu

          export LD_LIBRARY_PATH="/opt/firebird-client/lib:${LD_LIBRARY_PATH:-}"
          # Add coverage flags
          export CFLAGS="-I/opt/firebird-client/include -O0 -g --coverage ${CFLAGS:-}"
          export CXXFLAGS="-I/opt/firebird-client/include -O0 -g --coverage ${CXXFLAGS:-}"
          export LDFLAGS="-L/opt/firebird-client/lib --coverage ${LDFLAGS:-}"

          echo "PHP Version:"
          php -v

          echo "Building extension with coverage..."
          phpize
          ./configure --with-firebird=/opt/firebird-client
          make -j"$(nproc)"

          echo "Extension built successfully"

      - name: Verify extension and connection
        run: |
          set -eu

          # Ensure Firebird client library is in library path
          export LD_LIBRARY_PATH="/opt/firebird-client/lib:${LD_LIBRARY_PATH:-}"

          EXTENSION_PATH="$(pwd)/modules/firebird.so"

          echo "=== Checking extension file ==="
          ls -la "$EXTENSION_PATH"
          ldd "$EXTENSION_PATH" || echo "Could not check extension dependencies"

          echo "=== Testing extension loading ==="
          # First show any errors, then check if module loaded
          # Note: Module name is "firebird" (not "fbird")
          if ! php -d "extension=${EXTENSION_PATH}" -m 2>&1 | grep -qi firebird; then
            echo "ERROR: Extension failed to load. Showing detailed error:"
            php -d "extension=${EXTENSION_PATH}" -r 'echo "Extension loaded\n";' 2>&1 || true
            exit 1
          fi
          echo "firebird extension loaded successfully"

          echo "=== Testing connection to Firebird service ==="
          # Note: Service manager connection may fail in some container setups
          # The PHPT tests will verify actual database connectivity
          php -d "extension=${EXTENSION_PATH}" -r '
            if ($se = @fbird_service_attach("firebird", "SYSDBA", "masterkey")) {
              echo "SUCCESS: Connected to Firebird service\n";
              $ver = fbird_server_info($se, FBIRD_SVC_SERVER_VERSION);
              echo "Server version: $ver\n";
              fbird_service_detach($se);
            } else {
              echo "WARNING: Service attach failed: " . fbird_errmsg() . "\n";
              echo "This may be normal for some Firebird container configurations.\n";
              echo "PHPT tests will verify actual database connectivity.\n";
            }
          '

      - name: Run PHPT tests
        env:
          NO_INTERACTION: 1
          REPORT_EXIT_STATUS: 1
          TEST_PHP_EXECUTABLE: php
        shell: bash
        run: |
          set -euo pipefail

          EXTENSION_PATH="$(pwd)/modules/firebird.so"
          export TEST_PHP_EXECUTABLE="$(which php)"
          export PHP_TEST_SHARED_EXTENSIONS="-d extension=${EXTENSION_PATH}"

          # Add pcntl if available
          PCNTL_SO=$(find $(php-config --extension-dir) -name "pcntl.so" 2>/dev/null || true)
          if [ -n "$PCNTL_SO" ]; then
            export PHP_TEST_SHARED_EXTENSIONS="${PHP_TEST_SHARED_EXTENSIONS} -d extension=${PCNTL_SO}"
          fi

          echo "Running all PHPT tests..."
          make test TESTS=tests/ | tee test_output.txt || true

          # Parse test results
          FAILED_COUNT=$(grep -oP 'Tests failed\s*:\s*\K\d+' test_output.txt | head -1 || echo "0")
          WARNED_COUNT=$(grep -oP 'Tests warned\s*:\s*\K\d+' test_output.txt | head -1 || echo "0")
          LEAKED_COUNT=$(grep -oP 'Tests leaked\s*:\s*\K\d+' test_output.txt | head -1 || echo "0")

          echo "Test Stats -> Failed: ${FAILED_COUNT}, Warned: ${WARNED_COUNT}, Leaked: ${LEAKED_COUNT}"

          if [ "${FAILED_COUNT}" -gt 0 ] || [ "${WARNED_COUNT}" -gt 0 ] || [ "${LEAKED_COUNT}" -gt 0 ]; then
            echo "❌ Test Failure Detected"
            echo "::group::Test Failure Details"
            if grep -q "FAILED TEST SUMMARY" test_output.txt; then
              grep -A 100 "FAILED TEST SUMMARY" test_output.txt | head -50 || true
            fi
            echo "::endgroup::"
            exit 1
          fi

          echo "✅ All tests passed successfully"

      - name: Capture Coverage & Enforce Gate
        env:
          COVERAGE_THRESHOLD: 55.0
        run: |
          set -eu
          mkdir -p coverage

          echo "=== Debug: Listing gcno/gcda files ==="
          find . -name "*.gcno" -o -name "*.gcda" 2>/dev/null | head -20 || true

          # Run gcov on source files
          echo "Running gcov on source files..."
          for src in *.c; do
            if [ -f "$src" ]; then
              gcov -o . "$src" 2>/dev/null || true
            fi
          done

          if [ -d ".libs" ]; then
            for gcda in .libs/*.gcda; do
              if [ -f "$gcda" ]; then
                base=$(basename "$gcda" .gcda)
                if [ -f "${base}.c" ]; then
                  gcov -o .libs "${base}.c" 2>/dev/null || true
                fi
              fi
            done
          fi

          # Capture coverage using lcov
          echo "Capturing coverage data with lcov..."
          lcov --directory . --capture --output-file coverage/lcov.info \
            --rc lcov_branch_coverage=0 \
            --no-external \
            --ignore-errors gcov \
            2>&1 || true

          if [ ! -s coverage/lcov.info ]; then
            echo "Warning: No coverage data captured"
            echo "TN:" > coverage/lcov.info
          fi

          # Filter out system headers, PHP headers, and tests
          lcov --remove coverage/lcov.info \
            '/usr/*' \
            '*/php-src/*' \
            '*/tests/*' \
            '*/build/*' \
            '*/modules/*' \
            --output-file coverage/lcov_filtered.info \
            --rc lcov_branch_coverage=0 \
            2>&1 || true

          if [ ! -s coverage/lcov_filtered.info ]; then
            echo "Warning: No coverage data after filtering"
            echo "TN:" > coverage/lcov_filtered.info
          fi

          # Generate HTML report
          genhtml coverage/lcov_filtered.info --output-directory coverage/html \
            --rc lcov_branch_coverage=0 \
            2>&1 || true

          echo "Coverage summary:"
          COVERAGE_OUTPUT=$(lcov --summary coverage/lcov_filtered.info)
          echo "$COVERAGE_OUTPUT"

          COVERAGE=$(echo "$COVERAGE_OUTPUT" | grep -oP "lines\.*: \K[0-9.]+")

          if [ -z "$COVERAGE" ]; then
            echo "Error: Could not parse coverage percentage"
            exit 1
          fi

          echo "Current Line Coverage: ${COVERAGE}%"
          echo "Required Threshold:    ${COVERAGE_THRESHOLD}%"

          if python3 -c "import sys; sys.exit(0 if float(sys.argv[1]) >= float(sys.argv[2]) else 1)" "$COVERAGE" "$COVERAGE_THRESHOLD"; then
            echo "✅ Coverage Gate Passed"
          else
            echo "❌ Coverage dropped below baseline (${COVERAGE_THRESHOLD}%)"
            exit 1
          fi

      - name: Cleanup Raw Coverage Files
        run: |
          rm -f coverage/*.info test_output.txt

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/html/
