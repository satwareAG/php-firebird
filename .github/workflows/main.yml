name: Linux PHP + Firebird (IBSurgeon)

on:
  push:
  pull_request:
  schedule:
    - cron: '0 0 * * *'

jobs:
  linux-matrix-build:
    name: PHP ${{ matrix.php-version }} / Firebird ${{ matrix.firebird-version }}
    runs-on: ubuntu-latest

    # Single container per job: one PHP CLI image which will also host
    # the Firebird server installed via IBSurgeon firebirdlinuxinstall.
    #
    # We pin the Debian variant to "bookworm" (Debian 12) because the
    # firebirdlinuxinstall scripts currently support Debian up to 12 and
    # explicitly fail on 13 (trixie), which is the default for generic
    # php:<version>-cli images at the time of writing.
    container:
      image: php:${{ matrix.php-version }}-cli-bookworm

    strategy:
      fail-fast: true
      matrix:
        php-version: ['8.1', '8.2', '8.3', '8.4', '8.5']
        firebird-version: ['2.5', '3.0', '4.0', '5.0']

    env:
      # Default Firebird credentials expected by tests/firebird.inc.
      ISC_USER: SYSDBA
      ISC_PASSWORD: masterkey

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies (PHP build tools, netcat, curl, wget)
        run: |
          set -eu

          # Enable pipefail where supported (bash, some modern shells). When running
          # under POSIX sh (e.g. act's default shell), this will fail but is safely
          # ignored because it's wrapped in an if-condition.
          if (set -o pipefail) 2>/dev/null; then :; fi

          export DEBIAN_FRONTEND=noninteractive
          for attempt in 1 2 3; do
            if apt-get update; then
              break
            fi
            echo "apt-get update failed (attempt ${attempt}/3), retrying in 5s..." >&2
            sleep 5
          done

          apt-get install -y --no-install-recommends \
            autoconf \
            build-essential \
            ca-certificates \
            g++ \
            git \
            libicu-dev \
            libreadline-dev \
            libssl-dev \
            libtool \
            netbase \
            netcat-openbsd \
            pkg-config \
            wget \
            curl \
            unzip \
            bison \
            flex \
            cmake \
            jq \
            python3 \
            zlib1g-dev

          rm -rf /var/lib/apt/lists/*

          # Install pcntl extension (required for EventPoller tests)
          docker-php-ext-install pcntl

      # ========================================================================
      # Install Firebird 3.0+ client libraries for compilation
      # ========================================================================
      # The extension requires Firebird 3.0+ client libraries (OO API) for
      # compilation. We install FB 3.0 client first, then the target server
      # version for testing. The FB 3.0+ client can connect to all server
      # versions (2.5-5.0) via backward-compatible wire protocol.
      - name: Install Firebird 3.0+ client for compilation
        run: |
          set -eu

          FB_CLIENT_VERSION="3.0.12"
          FB_CLIENT_TARBALL="Firebird-${FB_CLIENT_VERSION}.33787-0.amd64.tar.gz"
          FB_CLIENT_URL="https://github.com/FirebirdSQL/firebird/releases/download/v${FB_CLIENT_VERSION}/${FB_CLIENT_TARBALL}"
          FB_CLIENT_DIR="/opt/firebird-client"

          echo "Installing Firebird ${FB_CLIENT_VERSION} client for compilation..."

          # Download FB 3.0 client tarball
          for attempt in 1 2 3 4 5; do
            echo "Downloading FB client (attempt ${attempt}/5)..."
            if curl -fsSL --retry 3 --retry-delay 5 "${FB_CLIENT_URL}" -o "/tmp/${FB_CLIENT_TARBALL}"; then
              echo "Successfully downloaded FB client"
              break
            fi
            echo "Download failed, retrying in 10s..."
            sleep 10
          done

          # Extract and set up client libraries
          mkdir -p "${FB_CLIENT_DIR}"
          cd /tmp
          tar xzf "${FB_CLIENT_TARBALL}"

          # Find the extracted directory (name may vary)
          FB_EXTRACTED=$(find . -maxdepth 1 -type d -name 'Firebird*' | head -1)
          if [ -z "${FB_EXTRACTED}" ]; then
            echo "ERROR: Could not find extracted Firebird directory" >&2
            exit 1
          fi

          # Copy headers and libraries
          cp -r "${FB_EXTRACTED}/include" "${FB_CLIENT_DIR}/"
          mkdir -p "${FB_CLIENT_DIR}/lib"
          cp -r "${FB_EXTRACTED}/lib/"* "${FB_CLIENT_DIR}/lib/" 2>/dev/null || true

          # Also look in alternative locations
          if [ -d "${FB_EXTRACTED}/opt/firebird/include" ]; then
            cp -r "${FB_EXTRACTED}/opt/firebird/include/"* "${FB_CLIENT_DIR}/include/"
          fi
          if [ -d "${FB_EXTRACTED}/opt/firebird/lib" ]; then
            cp -r "${FB_EXTRACTED}/opt/firebird/lib/"* "${FB_CLIENT_DIR}/lib/"
          fi

          # Verify required files exist
          if [ ! -f "${FB_CLIENT_DIR}/include/ibase.h" ]; then
            echo "ERROR: ibase.h not found in ${FB_CLIENT_DIR}/include" >&2
            find "${FB_CLIENT_DIR}" -name "*.h" -o -name "*.so*" 2>/dev/null || true
            exit 1
          fi

          echo "Firebird client installed successfully:"
          ls -la "${FB_CLIENT_DIR}/include/" | head -10
          ls -la "${FB_CLIENT_DIR}/lib/" | head -10

      # ========================================================================
      # Install Firebird server for testing
      # ========================================================================
      - name: Install Firebird server via IBSurgeon script
        env:
          # Map matrix.firebird-version to firebirdlinuxinstall script suffix.
          MATRIX_FIREBIRD_VERSION: ${{ matrix.firebird-version }}
        run: |
          set -eu

          # Enable pipefail where supported without breaking plain /bin/sh.
          if (set -o pipefail) 2>/dev/null; then :; fi

          # Map Firebird version to script suffix and download URLs
          case "${MATRIX_FIREBIRD_VERSION}" in
            '2.5')
              FB_SCRIPT_SUFFIX='25'
              FB_TARBALL_URL="https://github.com/FirebirdSQL/firebird/releases/download/R2_5_9/FirebirdCS-2.5.9.27139-0.amd64.tar.gz"
              ;;
            '3.0')
              FB_SCRIPT_SUFFIX='30'
              FB_TARBALL_URL="https://github.com/FirebirdSQL/firebird/releases/download/v3.0.12/Firebird-3.0.12.33787-0.amd64.tar.gz"
              ;;
            '4.0')
              FB_SCRIPT_SUFFIX='40'
              FB_TARBALL_URL="https://github.com/FirebirdSQL/firebird/releases/download/v4.0.6/Firebird-4.0.6.3221-0.amd64.tar.gz"
              ;;
            '5.0')
              FB_SCRIPT_SUFFIX='50'
              FB_TARBALL_URL="https://github.com/FirebirdSQL/firebird/releases/download/v5.0.2/Firebird-5.0.2.1613-0-linux-x64.tar.gz"
              ;;
            *)
              echo "Unsupported Firebird version in matrix: ${MATRIX_FIREBIRD_VERSION}" >&2
              exit 1
              ;;
          esac

          FB_SCRIPT_URL="https://raw.githubusercontent.com/IBSurgeon/firebirdlinuxinstall/refs/heads/main/fb_vanilla-${FB_SCRIPT_SUFFIX}.sh"
          FB_TARBALL_NAME=$(basename "${FB_TARBALL_URL}")

          # Function to download with retries
          download_with_retry() {
            local url="$1"
            local output="$2"
            local description="$3"
            local max_attempts=5
            local delay=10

            for attempt in $(seq 1 $max_attempts); do
              echo "Downloading ${description} (attempt ${attempt}/${max_attempts})..."
              if curl -fsSL --retry 3 --retry-delay 5 "${url}" -o "${output}"; then
                echo "Successfully downloaded ${description}"
                return 0
              fi
              echo "Download failed, waiting ${delay} seconds before retry..."
              sleep $delay
              delay=$((delay * 2))  # Exponential backoff
            done
            echo "ERROR: Failed to download ${description} after ${max_attempts} attempts" >&2
            return 1
          }

          # Pre-download Firebird tarball with retry logic (more reliable than letting script do it)
          echo "Pre-downloading Firebird ${MATRIX_FIREBIRD_VERSION} tarball..."
          if ! download_with_retry "${FB_TARBALL_URL}" "/tmp/${FB_TARBALL_NAME}" "Firebird ${MATRIX_FIREBIRD_VERSION} tarball"; then
            exit 1
          fi

          # Download the IBSurgeon install script
          echo "Downloading Firebird install script from ${FB_SCRIPT_URL}"
          if ! download_with_retry "${FB_SCRIPT_URL}" "/tmp/fb_install.sh" "IBSurgeon install script"; then
            exit 1
          fi

          chmod +x /tmp/fb_install.sh

          # Create a patched downloadFile function that checks for pre-downloaded files
          cat > /tmp/downloadFile_patch.sh << 'PATCH_EOF'
          downloadFile(){
              url=$1
              tmp=$2
              name=$3
              fname=$(basename -- "$url")
              echo "Downloading $name..."
              if [ -f "/tmp/$fname" ]; then
                  echo "Using pre-downloaded $fname"
                  cp "/tmp/$fname" "$tmp/$fname"
                  return 0
              fi
              for attempt in 1 2 3 4 5; do
                  m=$(curl -w "%{http_code}" --retry 3 --retry-delay 5 --location "$url" --output "$tmp/$fname" --progress-bar)
                  r=$?
                  if [ "$m" = "200" ] && [ $r -eq 0 ]; then
                      echo "OK"
                      return 0
                  fi
                  echo "Download attempt $attempt failed (HTTP $m, curl $r), retrying in 10s..."
                  sleep 10
              done
              echo "ERROR: Failed to download after 5 attempts"
              exit 1
          }
          PATCH_EOF

          # Remove leading whitespace from patch file
          sed -i 's/^          //' /tmp/downloadFile_patch.sh

          # Apply patch by replacing the downloadFile function
          # First, extract lines before and after downloadFile function
          head -n $(grep -n '^downloadFile(){' /tmp/fb_install.sh | cut -d: -f1 | head -1 | xargs -I{} expr {} - 1) /tmp/fb_install.sh > /tmp/fb_patched.sh
          cat /tmp/downloadFile_patch.sh >> /tmp/fb_patched.sh
          tail -n +$(grep -n '^}' /tmp/fb_install.sh | awk -F: 'NR==1{print $1+1}') /tmp/fb_install.sh >> /tmp/fb_patched.sh
          mv /tmp/fb_patched.sh /tmp/fb_install.sh
          chmod +x /tmp/fb_install.sh

          # Run IBSurgeon installer in non-interactive mode by feeding
          # default answers. The script installs Firebird under /opt/firebird
          # and configures it to listen on the default port 3050.
          printf '\n' | /tmp/fb_install.sh

          # In container environments systemd may not be available, so we try
          # several non-systemd startup methods for Firebird. Prefer the
          # init script that the installer usually installs, then fall back
          # to starting the engine binaries directly.

          # First try the init script or service(8) interface, if present.
          if ! nc -z 127.0.0.1 3050; then
            if [ -x /etc/init.d/firebird ]; then
              echo "Attempting to start Firebird via /etc/init.d/firebird ..."
              /etc/init.d/firebird restart || /etc/init.d/firebird start || true
            elif command -v service >/dev/null 2>&1; then
              echo "Attempting to start Firebird via service firebird ..."
              service firebird restart || service firebird start || true
            fi
          fi

          # If it's still not listening, fall back to starting fbguard/fbserver
          # directly in the container.
          if ! nc -z 127.0.0.1 3050; then
            echo "Attempting to start Firebird via fbguard/fbserver binaries ..."
            if [ -x /opt/firebird/bin/fbguard ]; then
              /opt/firebird/bin/fbguard -daemon || true
            elif [ -x /opt/firebird/bin/fbserver ]; then
              /opt/firebird/bin/fbserver -daemon || true
            fi
          fi

          # Wait for Firebird to be ready on localhost:3050.
          for i in $(seq 1 60); do
            if nc -z 127.0.0.1 3050; then
              echo "Firebird is ready on localhost:3050"
              break
            fi
            echo "Waiting for Firebird to start (attempt ${i}/60)..."
            sleep 1
          done

          if ! nc -z 127.0.0.1 3050; then
            echo "ERROR: Firebird did not start on localhost:3050" >&2
            exit 1
          fi

      - name: Build PHP extension (firebird)
        env:
          # Force config.m4 to use the Firebird 3.0+ client at /opt/firebird-client
          # for compilation. This ensures we always compile against FB 3.0+ OO API
          # headers, regardless of which server version we're testing against.
          FB_CONFIG: "no"
        run: |
          set -eu

          # Enable pipefail where supported without breaking plain /bin/sh.
          if (set -o pipefail) 2>/dev/null; then :; fi

          # Use FB 3.0+ client from /opt/firebird-client for compilation
          # The client library can connect to any server version (2.5-5.0)
          export PATH="/opt/firebird/bin:/opt/firebird-client/bin:${PATH}"
          export LD_LIBRARY_PATH="/opt/firebird-client/lib:${LD_LIBRARY_PATH:-}"
          export CFLAGS="-I/opt/firebird-client/include ${CFLAGS:-}"
          export LDFLAGS="-L/opt/firebird-client/lib ${LDFLAGS:-}"

          # Verify FB 3.0+ client headers are available
          echo "Checking Firebird client installation..."
          if [ ! -f /opt/firebird-client/include/ibase.h ]; then
            echo "ERROR: ibase.h not found in /opt/firebird-client/include" >&2
            exit 1
          fi

          # Check FB_API_VER in header
          FB_API_VER=$(grep -o 'FB_API_VER[[:space:]]*[0-9]*' /opt/firebird-client/include/ibase.h | head -1 | grep -o '[0-9]*' || echo "unknown")
          echo "Firebird client FB_API_VER: ${FB_API_VER}"

          php -v
          phpize
          ./configure --with-firebird=/opt/firebird-client
          make -j"$(nproc)"

      - name: Run PHPT tests
        env:
          # tests/config.inc reads FIREBIRD_HOST and uses it as the host
          # portion of connection strings; the database path is appended in
          # tests/firebird.inc. Since the Firebird server runs in the same
          # container, we connect to localhost on the default port.
          FIREBIRD_HOST: "localhost"
          ISC_USER: SYSDBA
          ISC_PASSWORD: masterkey
          NO_INTERACTION: 1
          REPORT_EXIT_STATUS: 1
          TEST_PHP_EXECUTABLE: php
          # Use FB 3.0+ client library at runtime (same as compilation)
          LD_LIBRARY_PATH: "/opt/firebird-client/lib"
        run: |
          set -eu

          # Enable pipefail where supported without breaking plain /bin/sh.
          if (set -o pipefail) 2>/dev/null; then :; fi

          # Verify runtime library is available
          echo "Checking Firebird client library..."
          ls -la /opt/firebird-client/lib/libfbclient.so* 2>/dev/null || echo "libfbclient not found in client dir"

          # Run tests using PHP's run-tests.php mechanism via make test.
          make test
