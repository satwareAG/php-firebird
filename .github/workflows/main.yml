name: Linux PHP + Firebird (IBSurgeon)

on:
  push:
  pull_request:
  schedule:
    - cron: '0 0 * * *'

jobs:
  linux-matrix-build:
    name: PHP ${{ matrix.php-version }} / Firebird ${{ matrix.firebird-version }}
    runs-on: ubuntu-latest

    # Single container per job: one PHP CLI image which will also host
    # the Firebird server installed via IBSurgeon firebirdlinuxinstall.
    #
    # We pin the Debian variant to "bookworm" (Debian 12) because the
    # firebirdlinuxinstall scripts currently support Debian up to 12 and
    # explicitly fail on 13 (trixie), which is the default for generic
    # php:<version>-cli images at the time of writing.
    container:
      image: php:${{ matrix.php-version }}-cli-bookworm

    strategy:
      fail-fast: true
      matrix:
        php-version: ['8.1', '8.2', '8.3', '8.4', '8.5']
        firebird-version: ['2.5', '3.0', '4.0', '5.0']

    env:
      # Default Firebird credentials expected by tests/firebird.inc.
      ISC_USER: SYSDBA
      ISC_PASSWORD: masterkey

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies (PHP build tools, netcat, curl, wget)
        run: |
          set -eu

          # Enable pipefail where supported (bash, some modern shells). When running
          # under POSIX sh (e.g. act's default shell), this will fail but is safely
          # ignored because it's wrapped in an if-condition.
          if (set -o pipefail) 2>/dev/null; then :; fi

          export DEBIAN_FRONTEND=noninteractive
          for attempt in 1 2 3; do
            if apt-get update; then
              break
            fi
            echo "apt-get update failed (attempt ${attempt}/3), retrying in 5s..." >&2
            sleep 5
          done

          apt-get install -y --no-install-recommends \
            autoconf \
            build-essential \
            ca-certificates \
            g++ \
            git \
            libicu-dev \
            libreadline-dev \
            libssl-dev \
            libtool \
            netbase \
            netcat-openbsd \
            pkg-config \
            wget \
            curl \
            unzip \
            bison \
            flex \
            cmake \
            jq \
            python3 \
            zlib1g-dev

          rm -rf /var/lib/apt/lists/*

          # Install pcntl extension (required for EventPoller tests)
          docker-php-ext-install pcntl

      - name: Install Firebird server via IBSurgeon script
        env:
          # Map matrix.firebird-version to firebirdlinuxinstall script suffix.
          MATRIX_FIREBIRD_VERSION: ${{ matrix.firebird-version }}
        run: |
          set -eu

          # Enable pipefail where supported without breaking plain /bin/sh.
          if (set -o pipefail) 2>/dev/null; then :; fi

          case "${MATRIX_FIREBIRD_VERSION}" in
            '2.5')
              FB_SCRIPT_SUFFIX='25'
              ;;
            '3.0')
              FB_SCRIPT_SUFFIX='30'
              ;;
            '4.0')
              FB_SCRIPT_SUFFIX='40'
              ;;
            '5.0')
              FB_SCRIPT_SUFFIX='50'
              ;;
            *)
              echo "Unsupported Firebird version in matrix: ${MATRIX_FIREBIRD_VERSION}" >&2
              exit 1
              ;;
          esac

          FB_SCRIPT_URL="https://raw.githubusercontent.com/IBSurgeon/firebirdlinuxinstall/refs/heads/main/fb_vanilla-${FB_SCRIPT_SUFFIX}.sh"

          echo "Downloading Firebird install script from ${FB_SCRIPT_URL}"
          curl -fsSL "${FB_SCRIPT_URL}" -o /tmp/fb_install.sh
          chmod +x /tmp/fb_install.sh

          # Run IBSurgeon installer in non-interactive mode by feeding
          # default answers. The script installs Firebird under /opt/firebird
          # and configures it to listen on the default port 3050.
          printf '\n' | /tmp/fb_install.sh

          # In container environments systemd may not be available, so we try
          # several non-systemd startup methods for Firebird. Prefer the
          # init script that the installer usually installs, then fall back
          # to starting the engine binaries directly.

          # First try the init script or service(8) interface, if present.
          if ! nc -z 127.0.0.1 3050; then
            if [ -x /etc/init.d/firebird ]; then
              echo "Attempting to start Firebird via /etc/init.d/firebird ..."
              /etc/init.d/firebird restart || /etc/init.d/firebird start || true
            elif command -v service >/dev/null 2>&1; then
              echo "Attempting to start Firebird via service firebird ..."
              service firebird restart || service firebird start || true
            fi
          fi

          # If it's still not listening, fall back to starting fbguard/fbserver
          # directly in the container.
          if ! nc -z 127.0.0.1 3050; then
            echo "Attempting to start Firebird via fbguard/fbserver binaries ..."
            if [ -x /opt/firebird/bin/fbguard ]; then
              /opt/firebird/bin/fbguard -daemon || true
            elif [ -x /opt/firebird/bin/fbserver ]; then
              /opt/firebird/bin/fbserver -daemon || true
            fi
          fi

          # Wait for Firebird to be ready on localhost:3050.
          for i in $(seq 1 60); do
            if nc -z 127.0.0.1 3050; then
              echo "Firebird is ready on localhost:3050"
              break
            fi
            echo "Waiting for Firebird to start (attempt ${i}/60)..."
            sleep 1
          done

          if ! nc -z 127.0.0.1 3050; then
            echo "ERROR: Firebird did not start on localhost:3050" >&2
            exit 1
          fi

      - name: Build PHP extension (firebird)
        env:
          # Force config.m4 to use the Firebird installation at /opt/firebird
          # instead of probing a system fb_config.
          FB_CONFIG: "no"
        run: |
          set -eu

          # Enable pipefail where supported without breaking plain /bin/sh.
          if (set -o pipefail) 2>/dev/null; then :; fi

          export PATH="/opt/firebird/bin:${PATH}"
          export LD_LIBRARY_PATH="/opt/firebird/lib:${LD_LIBRARY_PATH:-}"
          export CFLAGS="-I/opt/firebird/include ${CFLAGS:-}"
          export LDFLAGS="-L/opt/firebird/lib ${LDFLAGS:-}"

          php -v
          phpize
          ./configure --with-firebird=/opt/firebird
          make -j"$(nproc)"

      - name: Run PHPT tests
        env:
          # tests/config.inc reads FIREBIRD_HOST and uses it as the host
          # portion of connection strings; the database path is appended in
          # tests/firebird.inc. Since the Firebird server runs in the same
          # container, we connect to localhost on the default port.
          FIREBIRD_HOST: "localhost"
          ISC_USER: SYSDBA
          ISC_PASSWORD: masterkey
          NO_INTERACTION: 1
          REPORT_EXIT_STATUS: 1
          TEST_PHP_EXECUTABLE: php
        run: |
          set -eu

          # Enable pipefail where supported without breaking plain /bin/sh.
          if (set -o pipefail) 2>/dev/null; then :; fi

          # Run tests using PHP's run-tests.php mechanism via make test.
          make test
