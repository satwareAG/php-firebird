name: Linux Matrix Build

on:
  push:
  pull_request:
  schedule:
    - cron: '0 0 * * *'

jobs:
  linux-matrix-build:
    runs-on: ubuntu-latest
    container: node:20-slim
    env:
      # Pinned Firebird client tags from official GitHub releases.
      # Mapping requirement:
      #   - Firebird server 2.5/3.0 → 3.x client
      #   - Firebird server 4.0     → 4.x client
      #   - Firebird server 5.0     → 5.x client
      # The tags below are the current latest stable for each major.
      # Update these when you want to move to a newer Firebird client.
      FB3_TAG: v3.0.13
      FB4_TAG: v4.0.6
      FB5_TAG: v5.0.3
    services:
      firebird:
        image: ${{ matrix.firebird-image }}
        env:
          ISC_PASSWORD: masterkey
          FIREBIRD_DATABASE: test.fdb
          FIREBIRD_PASSWORD: masterkey
          FIREBIRD_ROOT_PASSWORD: masterkey
    strategy:
      fail-fast: true
      matrix:
        php-version: ['8.1', '8.2', '8.3', '8.4', '8.5']
        firebird-version: ['2.5', '3.0', '4.0', '5.0']
        include:
          - firebird-version: '2.5'
            firebird-image: 'jacobalberty/firebird:v2.5.9-ss'
          - firebird-version: '3.0'
            firebird-image: 'firebirdsql/firebird:3'
          - firebird-version: '4.0'
            firebird-image: 'firebirdsql/firebird:4'
          - firebird-version: '5.0'
            firebird-image: 'firebirdsql/firebird:5'

    steps:
    - uses: actions/checkout@v4

    - name: Install System Dependencies
      run: |
        # Use strict error handling compatible with /bin/sh in containers and act
        set -eu

        # Use non-interactive, fail-fast apt with a simple retry on update
        export DEBIAN_FRONTEND=noninteractive
        for attempt in 1 2 3; do
          if apt-get update; then
            break
          fi
          echo "apt-get update failed (attempt ${attempt}/3), retrying in 5s..." >&2
          sleep 5
        done

        apt-get install -y --no-install-recommends \
          curl \
          ca-certificates \
          gnupg \
          git \
          unzip \
          autoconf \
          build-essential \
          netcat-openbsd \
          cmake \
          pkg-config \
          jq \
          python3 \
          g++ \
          libssl-dev \
          libicu-dev \
          zlib1g-dev \
          libreadline-dev \
          bison \
          flex \
          gperf \
          automake \
          libtool

    - name: Install Firebird client (resilient)
      shell: bash
      run: |
        set -euxo pipefail

        # Map Firebird server version to pinned client tag and Linux x64
        # archive URL from the official SourceForge mirror. This avoids
        # building Firebird from source inside CI while still matching the
        # exact released client version per major.
        case "${{ matrix.firebird-version }}" in
          2.5|3.0)
            TAG="${FB3_TAG:-}"
            CLIENT_URL="https://sourceforge.net/projects/firebird.mirror/files/${TAG}/Firebird-3.0.13.33818-0.amd64.tar.gz/download"
            ;;
          4.0)
            TAG="${FB4_TAG:-}"
            CLIENT_URL="https://sourceforge.net/projects/firebird.mirror/files/${TAG}/Firebird-4.0.6.3221-0.amd64.tar.gz/download"
            ;;
          5.0)
            TAG="${FB5_TAG:-}"
            CLIENT_URL="https://sourceforge.net/projects/firebird.mirror/files/${TAG}/Firebird-5.0.3.1683-0-linux-x64.tar.gz/download"
            ;;
          *)
            echo "Unsupported matrix.firebird-version: ${{ matrix.firebird-version }}" >&2
            exit 1
            ;;
        esac

        if [ -z "${TAG:-}" ]; then
          echo "No Firebird tag configured for matrix.firebird-version ${{ matrix.firebird-version }}" >&2
          exit 1
        fi

        echo "Downloading client archive for tag ${TAG} from ${CLIENT_URL}"
        mkdir -p /tmp/firebird-client
        curl --fail --location --retry 3 --retry-delay 3 "${CLIENT_URL}" -o /tmp/firebird-client/firebird.tar

        # Extract everything (support nested archives)
        mkdir -p /tmp/firebird-client/extracted
        tar -xaf /tmp/firebird-client/firebird.tar -C /tmp/firebird-client/extracted || true

        # If a nested buildroot or inner tar exists, extract it too
        find /tmp/firebird-client/extracted -type f \( -name '*.tar.gz' -o -name '*.tar.xz' -o -name '*.tar' \) | while read -r inner; do
          innerdir="$(dirname "${inner}")/inner"
          mkdir -p "${innerdir}"
          tar -xaf "${inner}" -C "${innerdir}" || true
        done || true

        # Search for library files and headers anywhere under the extracted tree
        LIB_FILES=$(find /tmp/firebird-client/extracted -type f \( -name 'libfbclient.so*' -o -name 'libgds.so*' \) || true)
        HEADER_DIRS=$(find /tmp/firebird-client/extracted -type f -name 'fbclient.h' -printf '%h\n' || true)

        # If libs were not found under extracted, also try /tmp/firebird-client (some archives extract to top-level)
        if [ -z "${LIB_FILES:-}" ]; then
          LIB_FILES=$(find /tmp/firebird-client -type f \( -name 'libfbclient.so*' -o -name 'libgds.so*' \) || true)
        fi
        if [ -z "${HEADER_DIRS:-}" ]; then
          HEADER_DIRS=$(find /tmp/firebird-client -type f -name 'fbclient.h' -printf '%h\n' || true)
        fi

        echo "Found libraries:"
        printf '%s\n' "${LIB_FILES:-}" || true
        echo "Found header directories:"
        printf '%s\n' "${HEADER_DIRS:-}" || true

        # Determine whether sudo is available (GitHub-hosted containers often run as root)
        if command -v sudo >/dev/null 2>&1; then
          SUDO="sudo"
        else
          SUDO=""
        fi

        # Ensure destination dirs exist and are writable (use sudo when available)
        ${SUDO:-} mkdir -p /usr/local/lib
        ${SUDO:-} mkdir -p /usr/local/include/firebird

        # Copy libs
        if [ -n "${LIB_FILES:-}" ]; then
          echo "${LIB_FILES}" | while read -r lf; do
            [ -n "${lf}" ] || continue
            ${SUDO:-} cp -v "${lf}" /usr/local/lib/ || true
          done
        else
          echo "ERROR: libfbclient not found in extracted archive" >&2
          ls -R /tmp/firebird-client || true
          exit 1
        fi

        # Copy headers (copy the directory containing fbclient.h if found)
        if [ -n "${HEADER_DIRS:-}" ]; then
          echo "${HEADER_DIRS}" | sort -u | while read -r hd; do
            [ -n "${hd}" ] || continue
            ${SUDO:-} cp -rv "${hd}"/* /usr/local/include/firebird/ || true
          done
        else
          # Attempt to locate any 'include' directories and copy them
          INC_DIRS=$(find /tmp/firebird-client/extracted -type d -name include || true)
          if [ -n "${INC_DIRS:-}" ]; then
            echo "${INC_DIRS}" | while read -r id; do
              [ -n "${id}" ] || continue
              ${SUDO:-} cp -rv "${id}"/* /usr/local/include/firebird/ || true
            done
          else
            echo "Warning: no Firebird headers found; configure may still fail" >&2
          fi
        fi

        # Make sure linker can find the libs
        echo "/usr/local/lib" | ${SUDO:-} tee /etc/ld.so.conf.d/firebird.conf
        ${SUDO:-} ldconfig

        # Verify
        if ls /usr/local/lib/libfbclient.so* >/dev/null 2>&1 || ls /usr/local/lib/libgds.so* >/dev/null 2>&1; then
          echo "libfbclient (or libgds) present in /usr/local/lib"
        else
          echo "libfbclient not installed; contents of /usr/local/lib:" >&2
          ls -la /usr/local/lib || true
          exit 1
        fi

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-version }}
        tools: phpize, php-config
        extensions: none

    - name: Prepare Database
      run: |
        # Wait for Firebird to be ready
        # Simple check using nc (netcat)
        for i in {1..30}; do
          if nc -z firebird 3050; then
            echo "Firebird is ready!"
            break
          fi
          echo "Waiting for Firebird..."
          sleep 1
        done

    # Build the PHP extension. For Firebird 4.0/5.0 we explicitly disable
    # fb_config usage so the build relies on the headers/libs we installed
    # into /usr/local instead of any system fb_config from older clients.

    - name: Build Extension (Firebird 2.5/3.0)
      if: matrix.firebird-version == '2.5' || matrix.firebird-version == '3.0'
      run: |
        set -eux
        export PKG_CONFIG_PATH=/usr/local/lib/pkgconfig:${PKG_CONFIG_PATH:-}
        export LD_LIBRARY_PATH=/usr/local/lib:${LD_LIBRARY_PATH:-}
        export CFLAGS="-I/usr/local/include ${CFLAGS:-}"
        export LDFLAGS="-L/usr/local/lib ${LDFLAGS:-}"

        phpize
        ./configure --with-interbase=/usr/local
        make -j"$(nproc)"

    - name: Build Extension (Firebird 4.0/5.0)
      if: matrix.firebird-version == '4.0' || matrix.firebird-version == '5.0'
      env:
        # Force config.m4 to skip fb_config detection and instead use
        # the Firebird headers/libs that were installed into /usr/local
        FB_CONFIG: "no"
      run: |
        set -eux
        export PKG_CONFIG_PATH=/usr/local/lib/pkgconfig:${PKG_CONFIG_PATH:-}
        export LD_LIBRARY_PATH=/usr/local/lib:${LD_LIBRARY_PATH:-}
        export CFLAGS="-I/usr/local/include ${CFLAGS:-}"
        export LDFLAGS="-L/usr/local/lib ${LDFLAGS:-}"

        phpize
        ./configure --with-interbase=/usr/local
        make -j"$(nproc)"

    # Optional diagnostic: show which fb_config (if any) is present and what
    # version/lib it reports. This helps verify which client version would be
    # used if fb_config were consulted.
    - name: Diagnose Firebird client tooling
      run: |
        set -eu
        if command -v fb_config >/dev/null 2>&1; then
          echo "fb_config path: $(command -v fb_config)"
          echo "fb_config --version: $(fb_config --version || echo 'N/A')"
          echo "fb_config --libs: $(fb_config --libs || echo 'N/A')"
        else
          echo "fb_config not found in PATH"
        fi

    - name: Run Tests (PHPT)
      env:
        # Connection string for the tests
        # No database path here; tests/interbase.inc appends a unique temp path
        FIREBIRD_HOST: "firebird/3050"
        ISC_USER: SYSDBA
        ISC_PASSWORD: masterkey
        NO_INTERACTION: 1
        REPORT_EXIT_STATUS: 1
        TEST_PHP_EXECUTABLE: /usr/bin/php
      run: |
        # Run tests using PHP's run-tests.php mechanism via make test
        # We skip the interactive query
        make test
