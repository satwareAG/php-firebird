name: Linux Matrix Build

on:
  push:
  pull_request:
  schedule:
    - cron: '0 0 * * *'

jobs:
  linux-matrix-build:
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    services:
      firebird:
        image: ${{ matrix.firebird-image }}
        env:
          ISC_PASSWORD: masterkey
          FIREBIRD_DATABASE: test.fdb
          FIREBIRD_PASSWORD: masterkey
          FIREBIRD_ROOT_PASSWORD: masterkey
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.1', '8.2', '8.3', '8.4', '8.5']
        firebird-version: ['2.5', '3.0', '4.0', '5.0']
        include:
          - firebird-version: '2.5'
            firebird-image: 'jacobalberty/firebird:v2.5.9-ss'
          - firebird-version: '3.0'
            firebird-image: 'firebirdsql/firebird:3'
          - firebird-version: '4.0'
            firebird-image: 'firebirdsql/firebird:4'
          - firebird-version: '5.0'
            firebird-image: 'firebirdsql/firebird:5'

    steps:
    - uses: actions/checkout@v4

    - name: Install Runner Prerequisites
      run: |
        apt-get update
        apt-get install -y curl ca-certificates gnupg
        mkdir -p /etc/apt/keyrings
        curl -fsSL https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key | gpg --dearmor -o /etc/apt/keyrings/nodesource.gpg
        echo "deb [signed-by=/etc/apt/keyrings/nodesource.gpg] https://deb.nodesource.com/node_20.x nodistro main" | tee /etc/apt/sources.list.d/nodesource.list
        apt-get update
        apt-get install -y nodejs

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-version }}
        tools: phpize, php-config
        extensions: none

    - name: Install Dependencies
      run: |
        apt-get update
        apt-get install -y \
          git \
          unzip \
          curl \
          firebird-dev \
          autoconf \
          build-essential \
          netcat-openbsd

    - name: Prepare Database
      run: |
        # Wait for Firebird to be ready
        # Simple check using nc (netcat)
        for i in {1..30}; do
          if nc -z firebird 3050; then
            echo "Firebird is ready!"
            break
          fi
          echo "Waiting for Firebird..."
          sleep 1
        done

    - name: Build Extension
      run: |
        phpize
        ./configure
        make -j$(nproc)

    - name: Run Tests (PHPT)
      env:
        # Connection string for the tests
        # No database path here; tests/interbase.inc appends a unique temp path
        FIREBIRD_HOST: "firebird/3050"
        ISC_USER: SYSDBA
        ISC_PASSWORD: masterkey
        NO_INTERACTION: 1
        REPORT_EXIT_STATUS: 1
        TEST_PHP_EXECUTABLE: /usr/bin/php
      run: |
        # Run tests using PHP's run-tests.php mechanism via make test
        # We skip the interactive query
        make test
