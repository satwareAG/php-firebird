name: Linux PHP + Firebird (Docker Services)

on:
  push:
  pull_request:
  schedule:
    - cron: '0 0 * * *'

jobs:
  linux-matrix-build:
    name: PHP ${{ matrix.php-version }} / Firebird ${{ matrix.firebird-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # PHP 8.1 combinations
          - php-version: '8.1'
            firebird-version: '2.5'
            firebird-image: 'jacobalberty/firebird:2.5-ss'
            fb-client-version: '3.0'
          - php-version: '8.1'
            firebird-version: '3.0'
            firebird-image: 'firebirdsql/firebird:3'
            fb-client-version: '3.0'
          - php-version: '8.1'
            firebird-version: '4.0'
            firebird-image: 'firebirdsql/firebird:4'
            fb-client-version: '4.0'
          - php-version: '8.1'
            firebird-version: '5.0'
            firebird-image: 'firebirdsql/firebird:5'
            fb-client-version: '5.0'
          # PHP 8.2 combinations
          - php-version: '8.2'
            firebird-version: '2.5'
            firebird-image: 'jacobalberty/firebird:2.5-ss'
            fb-client-version: '3.0'
          - php-version: '8.2'
            firebird-version: '3.0'
            firebird-image: 'firebirdsql/firebird:3'
            fb-client-version: '3.0'
          - php-version: '8.2'
            firebird-version: '4.0'
            firebird-image: 'firebirdsql/firebird:4'
            fb-client-version: '4.0'
          - php-version: '8.2'
            firebird-version: '5.0'
            firebird-image: 'firebirdsql/firebird:5'
            fb-client-version: '5.0'
          # PHP 8.3 combinations
          - php-version: '8.3'
            firebird-version: '2.5'
            firebird-image: 'jacobalberty/firebird:2.5-ss'
            fb-client-version: '3.0'
          - php-version: '8.3'
            firebird-version: '3.0'
            firebird-image: 'firebirdsql/firebird:3'
            fb-client-version: '3.0'
          - php-version: '8.3'
            firebird-version: '4.0'
            firebird-image: 'firebirdsql/firebird:4'
            fb-client-version: '4.0'
          - php-version: '8.3'
            firebird-version: '5.0'
            firebird-image: 'firebirdsql/firebird:5'
            fb-client-version: '5.0'
          # PHP 8.4 combinations
          - php-version: '8.4'
            firebird-version: '2.5'
            firebird-image: 'jacobalberty/firebird:2.5-ss'
            fb-client-version: '3.0'
          - php-version: '8.4'
            firebird-version: '3.0'
            firebird-image: 'firebirdsql/firebird:3'
            fb-client-version: '3.0'
          - php-version: '8.4'
            firebird-version: '4.0'
            firebird-image: 'firebirdsql/firebird:4'
            fb-client-version: '4.0'
          - php-version: '8.4'
            firebird-version: '5.0'
            firebird-image: 'firebirdsql/firebird:5'
            fb-client-version: '5.0'
          # PHP 8.5 combinations (RC/development)
          - php-version: '8.5'
            firebird-version: '3.0'
            firebird-image: 'firebirdsql/firebird:3'
            fb-client-version: '3.0'
          - php-version: '8.5'
            firebird-version: '4.0'
            firebird-image: 'firebirdsql/firebird:4'
            fb-client-version: '4.0'
          - php-version: '8.5'
            firebird-version: '5.0'
            firebird-image: 'firebirdsql/firebird:5'
            fb-client-version: '5.0'

    # Run Firebird as a service container (same images as local docker-compose)
    services:
      firebird:
        image: ${{ matrix.firebird-image }}
        env:
          ISC_PASSWORD: masterkey
          FIREBIRD_DATABASE: test.fdb
          FIREBIRD_USER: SYSDBA
          FIREBIRD_PASSWORD: masterkey
        ports:
          - 3050:3050

    container:
      image: php:${{ matrix.php-version }}-cli-bookworm

    env:
      ISC_USER: SYSDBA
      ISC_PASSWORD: masterkey
      # In GitHub Actions services network, service containers are accessible
      # by their service name as hostname
      FIREBIRD_HOST: firebird
      FIREBIRD_DB_DIR: /tmp

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          set -eu
          export DEBIAN_FRONTEND=noninteractive

          # Retry apt-get update
          for attempt in 1 2 3; do
            if apt-get update; then break; fi
            echo "apt-get update failed (attempt ${attempt}/3), retrying..." >&2
            sleep 5
          done

          apt-get install -y --no-install-recommends \
            autoconf \
            build-essential \
            ca-certificates \
            g++ \
            git \
            libicu-dev \
            libtool \
            netbase \
            netcat-openbsd \
            pkg-config \
            wget \
            curl \
            unzip \
            libtommath1 \
            libncurses6

          # Install pcntl extension for event tests
          docker-php-ext-install pcntl

          rm -rf /var/lib/apt/lists/*

      - name: Install Firebird client library
        env:
          FB_CLIENT_VERSION: ${{ matrix.fb-client-version }}
        run: |
          set -eu

          FB_CLIENT_DIR="/opt/firebird-client"
          mkdir -p "${FB_CLIENT_DIR}"

          # Select client tarball based on version
          case "${FB_CLIENT_VERSION}" in
            '3.0')
              FB_VERSION="3.0.12"
              FB_BUILD="33787-0"
              FB_TARBALL="Firebird-${FB_VERSION}.${FB_BUILD}.amd64.tar.gz"
              FB_URL="https://github.com/FirebirdSQL/firebird/releases/download/v${FB_VERSION}/${FB_TARBALL}"
              FB_EXTRACT_DIR="Firebird-${FB_VERSION}.${FB_BUILD}.amd64"
              ;;
            '4.0')
              FB_VERSION="4.0.6"
              FB_BUILD="3221-0"
              FB_TARBALL="Firebird-${FB_VERSION}.${FB_BUILD}.amd64.tar.gz"
              FB_URL="https://github.com/FirebirdSQL/firebird/releases/download/v${FB_VERSION}/${FB_TARBALL}"
              FB_EXTRACT_DIR="Firebird-${FB_VERSION}.${FB_BUILD}.amd64"
              ;;
            '5.0')
              FB_VERSION="5.0.2"
              FB_BUILD="1613-0"
              FB_TARBALL="Firebird-${FB_VERSION}.${FB_BUILD}-linux-x64.tar.gz"
              FB_URL="https://github.com/FirebirdSQL/firebird/releases/download/v${FB_VERSION}/${FB_TARBALL}"
              FB_EXTRACT_DIR="Firebird-${FB_VERSION}.${FB_BUILD}-linux-x64"
              ;;
            *)
              echo "Unsupported client version: ${FB_CLIENT_VERSION}" >&2
              exit 1
              ;;
          esac

          echo "Installing Firebird ${FB_VERSION} client library..."

          # Download with retries
          for attempt in 1 2 3 4 5; do
            echo "Downloading FB client (attempt ${attempt}/5)..."
            if curl -fsSL --retry 3 --retry-delay 5 "${FB_URL}" -o "/tmp/${FB_TARBALL}"; then
              # Verify download size (should be at least 8MB)
              FSIZE=$(stat -c%s "/tmp/${FB_TARBALL}" 2>/dev/null || stat -f%z "/tmp/${FB_TARBALL}" 2>/dev/null || echo "0")
              if [ "${FSIZE}" -gt 8000000 ]; then
                echo "Download successful (${FSIZE} bytes)"
                break
              fi
              echo "Downloaded file too small (${FSIZE} bytes), retrying..."
              rm -f "/tmp/${FB_TARBALL}"
            fi
            sleep 10
          done

          if [ ! -f "/tmp/${FB_TARBALL}" ]; then
            echo "ERROR: Failed to download FB client" >&2
            exit 1
          fi

          # Extract tarball
          cd /tmp
          tar xzf "${FB_TARBALL}"
          cd "${FB_EXTRACT_DIR}"

          # Extract buildroot.tar.gz
          tar xzf buildroot.tar.gz

          # Copy headers and libraries
          if [ -d "opt/firebird/include" ]; then
            mkdir -p "${FB_CLIENT_DIR}/include"
            cp -a opt/firebird/include/* "${FB_CLIENT_DIR}/include/"
          fi
          if [ -d "opt/firebird/lib" ]; then
            mkdir -p "${FB_CLIENT_DIR}/lib"
            cp -a opt/firebird/lib/* "${FB_CLIENT_DIR}/lib/"
          fi

          # Debug: Show what we have
          echo "=== Contents of FB_CLIENT_DIR/lib ==="
          ls -la "${FB_CLIENT_DIR}/lib/" || echo "No lib directory"

          # Find and copy the actual library file (not symlinks)
          echo "=== Installing libraries to system paths ==="

          # Find the actual .so file (the one with version number, e.g., libfbclient.so.4.0.6)
          ACTUAL_LIB=$(find "${FB_CLIENT_DIR}/lib" -name "libfbclient.so.*.*" -type f 2>/dev/null | head -1)
          if [ -z "$ACTUAL_LIB" ]; then
            # Fallback: copy dereferencing symlinks
            ACTUAL_LIB=$(readlink -f "${FB_CLIENT_DIR}/lib/libfbclient.so" 2>/dev/null)
          fi

          if [ -n "$ACTUAL_LIB" ] && [ -f "$ACTUAL_LIB" ]; then
            LIBNAME=$(basename "$ACTUAL_LIB")
            echo "Found actual library: $ACTUAL_LIB ($LIBNAME)"

            # Copy actual library file
            cp "$ACTUAL_LIB" /usr/lib/
            cp "$ACTUAL_LIB" /usr/local/lib/ 2>/dev/null || true

            # Create proper symlinks
            ln -sf "$LIBNAME" /usr/lib/libfbclient.so.2
            ln -sf libfbclient.so.2 /usr/lib/libfbclient.so

            ln -sf "$LIBNAME" /usr/local/lib/libfbclient.so.2 2>/dev/null || true
            ln -sf libfbclient.so.2 /usr/local/lib/libfbclient.so 2>/dev/null || true
          else
            echo "WARNING: Could not find actual libfbclient library file"
            # Fallback: copy with dereference
            cp -aL "${FB_CLIENT_DIR}/lib/"* /usr/lib/ 2>/dev/null || true
          fi

          # Copy libib_util.so if present
          if [ -f "${FB_CLIENT_DIR}/lib/libib_util.so" ]; then
            cp -aL "${FB_CLIENT_DIR}/lib/libib_util.so" /usr/lib/
          fi

          # Copy headers directly
          cp -a "${FB_CLIENT_DIR}/include"/* /usr/include/ 2>/dev/null || true

          # Configure dynamic linker
          echo "${FB_CLIENT_DIR}/lib" > /etc/ld.so.conf.d/firebird-client.conf
          echo "/usr/local/lib" >> /etc/ld.so.conf.d/firebird-client.conf
          ldconfig

          # Verify installation
          echo "=== Verifying libfbclient installation ==="
          ldconfig -p | grep -i fbclient || echo "Warning: libfbclient not in ldconfig cache"
          ls -la /usr/lib/libfbclient* || echo "Warning: libfbclient not in /usr/lib"
          ls -la /usr/include/ibase.h || echo "Warning: ibase.h not in /usr/include"

          # Verify installation
          if [ ! -f "${FB_CLIENT_DIR}/include/ibase.h" ]; then
            echo "ERROR: ibase.h not found in ${FB_CLIENT_DIR}/include" >&2
            ls -la "${FB_CLIENT_DIR}/" || true
            exit 1
          fi

          echo "Firebird ${FB_VERSION} client installed successfully"
          ls -la "${FB_CLIENT_DIR}/include/" | head -5
          ls -la "${FB_CLIENT_DIR}/lib/" | head -5

      - name: Wait for Firebird service
        run: |
          set -eu
          echo "Waiting for Firebird service to be ready..."

          # Wait for TCP port to be available
          for i in $(seq 1 60); do
            if nc -z firebird 3050 2>/dev/null; then
              echo "Firebird is listening on firebird:3050"
              # Additional wait for service to be fully ready
              sleep 3
              break
            fi
            echo "Waiting for Firebird (attempt ${i}/60)..."
            sleep 2
          done

          if ! nc -z firebird 3050 2>/dev/null; then
            echo "ERROR: Firebird service did not start within timeout" >&2
            exit 1
          fi

      - name: Build PHP extension
        run: |
          set -eu

          export LD_LIBRARY_PATH="/opt/firebird-client/lib:${LD_LIBRARY_PATH:-}"
          export CFLAGS="-I/opt/firebird-client/include ${CFLAGS:-}"
          export LDFLAGS="-L/opt/firebird-client/lib ${LDFLAGS:-}"

          echo "PHP Version:"
          php -v

          echo "Building extension..."
          phpize
          ./configure --with-firebird=/opt/firebird-client
          make -j"$(nproc)"

          echo "Extension built successfully"
          ls -la modules/firebird.so

      - name: Verify extension and connection
        run: |
          set -eu

          # Ensure Firebird client library is in library path
          export LD_LIBRARY_PATH="/opt/firebird-client/lib:/usr/local/lib:/usr/lib:${LD_LIBRARY_PATH:-}"

          EXTENSION_PATH="$(pwd)/modules/firebird.so"

          echo "=== Library paths ==="
          echo "LD_LIBRARY_PATH: ${LD_LIBRARY_PATH}"
          ls -la /usr/lib/libfbclient* || echo "No libfbclient in /usr/lib"
          ldd "${EXTENSION_PATH}" | grep -i fbclient || echo "Could not check library deps"

          echo "Testing extension loading..."
          # First check if extension loads without grep to see errors
          php -d "extension=${EXTENSION_PATH}" -m > /tmp/modules.txt 2>&1 || {
            echo "PHP extension load failed:"
            cat /tmp/modules.txt
            exit 1
          }
          grep -i fbird /tmp/modules.txt

          echo "Testing connection to Firebird service..."
          php -d "extension=${EXTENSION_PATH}" -r '
            $host = "firebird";
            echo "Connecting to service manager at $host...\n";

            if ($se = @fbird_service_attach($host, "SYSDBA", "masterkey")) {
              echo "SUCCESS: Connected to Firebird service manager\n";
              $ver = fbird_server_info($se, FBIRD_SVC_SERVER_VERSION);
              echo "Server version: $ver\n";
              fbird_service_detach($se);
            } else {
              $err = fbird_errmsg();
              echo "FAILED: $err\n";
              exit(1);
            }
          '

      - name: Run PHPT tests
        env:
          NO_INTERACTION: 1
          REPORT_EXIT_STATUS: 1
          TEST_PHP_EXECUTABLE: php
        run: |
          set -eu

          EXTENSION_PATH="$(pwd)/modules/firebird.so"
          export TEST_PHP_EXECUTABLE="$(which php)"
          export PHP_TEST_SHARED_EXTENSIONS="-d extension=${EXTENSION_PATH}"

          # Add pcntl extension if available
          PCNTL_SO=$(find $(php-config --extension-dir) -name "pcntl.so" 2>/dev/null || true)
          if [ -n "$PCNTL_SO" ]; then
            export PHP_TEST_SHARED_EXTENSIONS="${PHP_TEST_SHARED_EXTENSIONS} -d extension=${PCNTL_SO}"
            echo "Added pcntl extension to test configuration"
          fi

          echo "Test configuration:"
          echo "  FIREBIRD_HOST=${FIREBIRD_HOST}"
          echo "  FIREBIRD_DB_DIR=${FIREBIRD_DB_DIR}"
          echo "  PHP_TEST_SHARED_EXTENSIONS=${PHP_TEST_SHARED_EXTENSIONS}"

          echo "Running all PHPT tests..."
          make test TESTS=tests/
