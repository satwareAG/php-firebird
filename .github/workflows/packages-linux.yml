# =============================================================================
# PHP Firebird Extension - Native Package Build & Deploy Workflow
# =============================================================================
#
# Builds .deb, .rpm, and .apk packages on tag push (v13.1.0+) and uploads
# them as GitHub Release assets. The satis-deploy Gitea runner (spec-008)
# polls GitHub Releases API and deploys to packages.auc.de (staging).
#
# Production deployment to packages.satware.com is deferred until the VPS
# is provisioned (satis spec-007 Phase D). The upload-apt job is kept
# but disabled (if: false) for future re-enablement.
#
# Triggers:
#   - Tag push (v*.*.*) - immutable releases
#   - Manual dispatch (for testing)
#
# Dependencies:
#   - packaging/debian/build-matrix.sh (#483) - iterates 32 combos
#   - packaging/debian/build.sh (#482) - single build script
#   - packaging/rpm/build.sh (#495) - RPM build inside manylinux
#   - packaging/apk/APKBUILD (#496) - Alpine APK build
#   - packaging/fb-client-bundle/fetch-client.sh (#486) - FB5 client
#   - satis spec-008: Gitea runner downloads from GitHub Release assets
#
# =============================================================================

name: Build & Deploy Native Packages

on:
  push:
    tags:
      - 'v[0-9]*.*'
  workflow_dispatch:
    inputs:
      php_versions:
        description: 'PHP versions (comma-separated)'
        required: false
        default: '8.2,8.3,8.4,8.5'
        type: string
      distros:
        description: 'Distros (comma-separated, deb only)'
        required: false
        default: 'bookworm,trixie,jammy,noble'
        type: string
      upload_to_vps:
        description: 'Upload to packages.satware.com (needs VPS - not ready)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write  # jane: needed for uploading release assets

concurrency:
  group: packages-linux-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ===========================================================================
  # Job 1: Build .deb packages (Debian/Ubuntu)
  # ===========================================================================
  build-deb:
    name: Build .deb packages
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Ensure VERSION.txt
        uses: ./.github/actions/version

      - name: Build .deb packages
        run: |
          set -eu
          PHP_VERS="${{ inputs.php_versions || '8.2,8.3,8.4,8.5' }}"
          DISTROS="${{ inputs.distros || 'bookworm,trixie,jammy,noble' }}"

          bash packaging/debian/build-matrix.sh \
            --php-versions "$PHP_VERS" \
            --distros "$DISTROS" \
            --archs "x86_64" \
            --output-dir dist/deb \
            --verbose

      - name: Upload .deb artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: deb-packages
          path: dist/deb/**/*.deb
          if-no-files-found: error
          retention-days: 30

      - name: Upload APT metadata
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: apt-metadata
          path: dist/deb/dists/
          if-no-files-found: ignore
          retention-days: 30

  # ===========================================================================
  # Job 2: Build .rpm packages (AlmaLinux/Rocky/RHEL/Fedora)
  # ===========================================================================
  build-rpm:
    name: Build .rpm (${{ matrix.distro }}-x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # jane: el8/el9 temporarily excluded. EL8 ships PHP 8.0, EL9 ships
        #       PHP 8.1 — php-firebird requires 8.2+. Need Remi repo setup
        #       before re-enabling. fc41 ships PHP 8.3 (base repo).
        distro: [fc41]

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Ensure VERSION.txt
        uses: ./.github/actions/version

      - name: Setup build container and PHP version
        id: container
        run: |
          case "${{ matrix.distro }}" in
            el8)  IMAGE="almalinux:8";  PHP_VER="8.2" ;;
            el9)  IMAGE="almalinux:9";  PHP_VER="8.2" ;;
            fc41) IMAGE="fedora:41";   PHP_VER="8.3" ;;
          esac
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "php_ver=$PHP_VER" >> "$GITHUB_OUTPUT"

      - name: Build .rpm inside container
        env:
          PHP_VER: ${{ steps.container.outputs.php_ver }}
        run: |
          set -eu
          IMAGE="${{ steps.container.outputs.image }}"

          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            -e FB_ROOT=/opt/firebird \
            -e OUTPUT_DIR=dist/rpm/${{ matrix.distro }} \
            -e VERBOSE=1 \
            -e PHP_VER="$PHP_VER" \
            "$IMAGE" \
            bash -c '
              set -eu

              # Install build dependencies.
              # jane: EL8/9 ship PHP 8.0/8.1 via php-devel. We build against
              #       the distro default PHP ABI, not a hardcoded version.
              #       Fedora 41 ships PHP 8.3.
              if command -v dnf >/dev/null 2>&1; then
                dnf install -y epel-release 2>/dev/null || true
                dnf install -y php-devel autoconf automake re2c gcc gcc-c++ make \
                  patchelf rpm-build cmake ninja-build git tar libtommath-devel jq
              else
                yum install -y epel-release 2>/dev/null || true
                yum install -y php-devel autoconf automake re2c gcc gcc-c++ make \
                  patchelf rpm-build cmake ninja-build git tar libtommath-devel jq
              fi

              # Build the RPM using the distro-default PHP version.
              # jane: --php-version resolves phpize${VER}/php-config${VER},
              #       falling back to unversioned if versioned binary is absent.
              bash packaging/rpm/build.sh \
                --php-version "$PHP_VER" \
                --distro ${{ matrix.distro }} \
                --arch x86_64 \
                --output-dir dist/rpm/${{ matrix.distro }} \
                --verbose
            '

      - name: Find RPM files
        id: find
        run: |
          set -eu
          RPM_DIR="dist/rpm/${{ matrix.distro }}"
          RPM_COUNT=$(find "$RPM_DIR" -name "*.rpm" -type f | wc -l)
          echo "count=$RPM_COUNT" >> "$GITHUB_OUTPUT"
          echo "Found $RPM_COUNT .rpm files in $RPM_DIR:"
          find "$RPM_DIR" -name "*.rpm" -type f -exec ls -lh {} \;

      - name: Upload .rpm artifacts
        if: steps.find.outputs.count != '0'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rpm-packages-${{ matrix.distro }}
          path: dist/rpm/${{ matrix.distro }}/**/*.rpm
          if-no-files-found: error
          retention-days: 30

  # ===========================================================================
  # Job 3: Build .apk packages (Alpine Linux)
  # ===========================================================================
  build-apk:
    name: Build .apk (Alpine 3.21 x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Ensure VERSION.txt
        uses: ./.github/actions/version

      - name: Patch APKBUILD pkgver to match tag
        run: |
          VERSION=$(cat VERSION.txt)
          echo "Patching APKBUILD pkgver to $VERSION"
          sed -i "s/^pkgver=.*/pkgver=$VERSION/" packaging/apk/APKBUILD
          grep '^pkgver=' packaging/apk/APKBUILD

      - name: Build .apk inside Alpine container
        run: |
          set -eu
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            -e VERBOSE=1 \
            alpine:3.21 \
            sh -c '
              set -eu

              # Install build dependencies.
              # jane: APKBUILD makedepends lists "ninja", not "samurai".
              #       sudo is needed by abuild-keygen -i to copy the public
              #       key to /etc/apk/keys/. Without sudo, abuild-keygen
              #       tries doas (not installed) and fails.
              apk add --no-cache \
                alpine-sdk \
                sudo \
                php84-dev \
                php84-pdo \
                autoconf \
                automake \
                re2c \
                build-base \
                cmake \
                ninja \
                git \
                icu-dev \
                patchelf

              # Create abuild user (abuild requires non-root)
              adduser -D -h /home/builder builder
              addgroup builder abuild
              echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

              # Generate abuild keypair and configure.
              # jane: -a sets PACKAGER_PRIVKEY in abuild.conf (needed by abuild
              #       to find the signing key). -i installs the public key to
              #       /etc/apk/keys/ via sudo. -n = non-interactive.
              #       Both -a and -i are required for abuild -r to work.
              su builder -c "abuild-keygen -a -i -n"

              # Make workspace writable by builder (abuild needs to modify
              # APKBUILD checksums and create build dirs).
              # jane: GitHub Actions mounts the checkout as root:root.
              #       abuild runs as builder and needs write access.
              chown -R builder:abuild /workspace

              # Run abuild: first generate checksums, then build.
              # jane: abuild -r enforces sha512sums. SKIP is not accepted
              #       in strict mode. `abuild checksum` downloads sources
              #       and computes real checksums, then `abuild -r` builds.
              #       REPODEST directs output to the mounted workspace so
              #       .apk files survive container exit.
              cd packaging/apk
              su builder -c "abuild checksum"
              su builder -c "REPODEST=/workspace/dist/apk abuild -r"
            '

      - name: Find APK files
        id: find
        run: |
          set -eu
          # jane: abuild writes to REPODEST=/workspace/dist/apk.
          #       Structure: dist/apk/<pkgname>/x86_64/*.apk
          APK_DIR="dist/apk"

          if [ ! -d "$APK_DIR" ]; then
            echo "ERROR: $APK_DIR not found" >&2
            exit 1
          fi

          APK_COUNT=$(find "$APK_DIR" -name "*.apk" -type f | wc -l)
          echo "dir=$APK_DIR" >> "$GITHUB_OUTPUT"
          echo "count=$APK_COUNT" >> "$GITHUB_OUTPUT"
          echo "Found $APK_COUNT .apk files in $APK_DIR:"
          find "$APK_DIR" -name "*.apk" -type f -exec ls -lh {} \;

      - name: Upload .apk artifacts
        if: steps.find.outputs.count != '0'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: apk-packages
          path: ${{ steps.find.outputs.dir }}/**/*.apk
          if-no-files-found: error
          retention-days: 30

  # ===========================================================================
  # Job 4: Upload all packages to GitHub Release (as draft assets)
  # ===========================================================================
  # jane: satis spec-008 Gitea runner downloads from GitHub Release assets.
  #       Actions artifacts expire in 30 days; Release assets are permanent.
  #       All three formats are uploaded as draft (publish-release.yml flips
  #       draft:false after validating SLSA attestations).
  upload-release-assets:
    name: Upload packages to GitHub Release
    # jane: build-apk is blocked on upstream Firebird #9122 (musl CMake).
    #       Use if: always() to upload deb+rpm even when apk fails.
    needs: [build-deb, build-rpm, build-apk]
    if: startsWith(github.ref, 'refs/tags/') && !cancelled()
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Download .deb artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: deb-packages
          path: release-assets/deb

      - name: Download .rpm artifacts (fc41)
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: rpm-packages-fc41
          path: release-assets/rpm/fc41

      - name: Download .apk artifacts (optional - may not exist)
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: apk-packages
          path: release-assets/apk
        continue-on-error: true

      - name: Flatten package files for release upload
        run: |
          set -eu
          mkdir -p upload
          # Flatten all packages into upload/ with descriptive names
          find release-assets -name "*.deb" -exec cp {} upload/ \;
          find release-assets -name "*.rpm" -exec cp {} upload/ \;
          find release-assets -name "*.apk" -exec cp {} upload/ \; || true

          echo "=== Files to upload ==="
          ls -lh upload/
          echo "Total: $(find upload -type f | wc -l) files"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3
        with:
          files: upload/*
          draft: true
          tag_name: ${{ github.ref_name }}

  # ===========================================================================
  # Job 5: Test APT install from staging repo (#490)
  # ===========================================================================
  # jane: staging repo (packages.auc.de/apt/) is deployed by the satis-deploy
  #       Gitea runner (spec-008) which polls GitHub Releases API.
  #       This job tests that the staging APT repo is functional end-to-end:
  #       a fresh container can apt install php-firebird and the extension
  #       loads with all procedural API functions.
  #       No `needs` dependency: the staging repo is populated asynchronously
  #       by satis-deploy, independent of the build jobs in this workflow.
  #       On tag push: tests whatever version satis-deploy has deployed
  #       (may be the previous release — satis-deploy runs asynchronously).
  #       On workflow_dispatch: tests the last released version on staging.
  test-apt-install:
    name: Test APT install (${{ matrix.distro }} PHP ${{ matrix.php }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # jane: test one Debian + one Ubuntu, PHP 8.4. More combos can be
        #       added but these prove the staging repo works end-to-end.
        include:
          - distro: debian:12
            codename: bookworm
            php: 8.4
          - distro: ubuntu:24.04
            codename: noble
            php: 8.4

    steps:
      - name: Install php-firebird from staging APT repo
        run: |
          set -eu
          docker run --rm ${{ matrix.distro }} bash -c '
            set -eu
            export DEBIAN_FRONTEND=noninteractive

            # Install prerequisites
            apt-get update -qq
            apt-get install -y -qq ca-certificates curl gnupg binutils

            # Add Sury PPA (required for PHP 8.4 on Debian 12 / Ubuntu 24.04)
            # jane: debian:12 ships PHP 8.2, ubuntu:24.04 ships PHP 8.3.
            #       Sury provides PHP 8.4 packages for both distros.
            curl -sSLo /tmp/keyring.deb https://packages.sury.org/debsuryorg-archive-keyring.deb
            dpkg -i /tmp/keyring.deb
            echo "deb [signed-by=/usr/share/keyrings/debsuryorg-archive-keyring.gpg] https://packages.sury.org/php/ ${{ matrix.codename }} main" \
              > /etc/apt/sources.list.d/php-sury.list
            apt-get update -qq
            apt-get install -y -qq php${{ matrix.php }}-cli

            # Import staging GPG key
            mkdir -p /etc/apt/keyrings
            curl -fsSL https://packages.auc.de/keys/staging-gpg.pub.asc \
              | gpg --dearmor -o /etc/apt/keyrings/satware-php-firebird.gpg

            # Add staging APT source
            echo "deb [signed-by=/etc/apt/keyrings/satware-php-firebird.gpg] https://packages.auc.de/apt ${{ matrix.codename }} main" \
              > /etc/apt/sources.list.d/satware-php-firebird.list

            # Install php-firebird from staging
            apt-get update -qq
            apt-get install -y -qq php${{ matrix.php }}-firebird

            # Verify extension is loaded
            echo "=== Verifying installation ==="
            php -m | grep -q firebird || { echo "FAIL: firebird not in php -m"; exit 1; }
            php -m | grep -q pdo_fbird || { echo "FAIL: pdo_fbird not in php -m"; exit 1; }

            # Verify procedural API functions exist (must actually fail on missing)
            php -r '"'"'function_exists("fbird_connect") or exit(1);'"'"' || { echo "FAIL: fbird_connect missing"; exit 1; }
            php -r '"'"'function_exists("fbird_query") or exit(1);'"'"' || { echo "FAIL: fbird_query missing"; exit 1; }
            php -r '"'"'function_exists("fbird_commit_ret") or exit(1);'"'"' || { echo "FAIL: fbird_commit_ret missing"; exit 1; }
            echo "Procedural API: OK"

            # Verify bundled FB5 client RPATH
            echo "=== Checking RPATH ==="
            EXT_DIR=$(php -r '"'"'echo ini_get("extension_dir");'"'"')
            if [ -z "$EXT_DIR" ]; then
              EXT_DIR=$(php-config --extension-dir 2>/dev/null || echo "/usr/lib/php/")
            fi
            readelf -d "$EXT_DIR/firebird.so" 2>/dev/null | grep -q "RPATH\|RUNPATH" || { echo "WARN: no RPATH found"; }
            ls /usr/lib/php-firebird/libfbclient* 2>/dev/null || { echo "WARN: bundled libfbclient not found"; }

            echo "=== All checks passed ==="
          '

  # ===========================================================================
  # Job 6: Upload to packages.satware.com (DISABLED - VPS not provisioned)
  # ===========================================================================
  # jane: satis spec-007 Phase D (production VPS) is not yet started.
  #       packages.satware.com resolves to the Securepoint firewall, not a VPS.
  #       Re-enable when the VPS is provisioned and SSH deploy key is set up.
  upload-apt:
    name: Upload to packages.satware.com/apt/ (disabled - no VPS)
    needs: build-deb
    if: false  # jane: disabled until packages.satware.com VPS exists (spec-007 Phase D)
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Download .deb artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: deb-packages
          path: dist/deb

      - name: Download APT metadata
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: apt-metadata
          path: dist/deb/dists

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.APT_DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${DEPLOY_KNOWN_HOSTS}" > ~/.ssh/known_hosts
        env:
          DEPLOY_KNOWN_HOSTS: ${{ secrets.APT_DEPLOY_KNOWN_HOSTS }}

      - name: Upload .deb files via rsync
        run: |
          set -eu
          for distro_dir in dist/deb/*/; do
            distro=$(basename "$distro_dir")
            [ "$distro" = "dists" ] && continue

            echo "Uploading $distro..."
            rsync -az --delete \
              -e "ssh -i ~/.ssh/deploy_key" \
              "$distro_dir" \
              "${DEPLOY_USER}@packages.satware.com:/var/www/apt/${distro}/"
          done

          if [ -d dist/deb/dists ]; then
            rsync -az \
              -e "ssh -i ~/.ssh/deploy_key" \
              dist/deb/dists/ \
              "${DEPLOY_USER}@packages.satware.com:/var/www/apt/dists/"
          fi
        env:
          DEPLOY_USER: deploy

      - name: Regenerate APT metadata on VPS
        run: |
          ssh -i ~/.ssh/deploy_key \
            ${DEPLOY_USER}@packages.satware.com \
            'cd /var/www/apt && \
             find . -name "*.deb" -type f | \
             xargs -I{} dirname {} | sort -u | \
             while read dir; do \
               dpkg-scanpackages --arch amd64 "$dir" /dev/null | gzip -9 > "$dir/Packages.gz" 2>/dev/null; \
             done && \
             echo "APT metadata regenerated"'
        env:
          DEPLOY_USER: deploy

      - name: Sign APT metadata (GPG)
        if: env.APT_GPG_PRIVATE_KEY != ''
        run: |
          echo "${{ secrets.APT_GPG_PRIVATE_KEY }}" | gpg --import
          ssh -i ~/.ssh/deploy_key \
            ${DEPLOY_USER}@packages.satware.com \
            'cd /var/www/apt && \
             for distro in dists/*/; do \
               (cd "$distro" && \
                apt-ftparchive release . > Release && \
                gpg --batch --yes --sign --detach-sign --armor Release && \
                gpg --batch --yes --clearsign --armor --output InRelease Release); \
             done && \
             echo "APT metadata signed"'
        env:
          DEPLOY_USER: deploy
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}

      - name: Cleanup SSH
        if: always()
        run: |
          rm -f ~/.ssh/deploy_key
