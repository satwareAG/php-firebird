# =============================================================================
# Publish Release — finalizes a multi-platform release
# =============================================================================
# Waits for Release (Linux), Release (macOS), and Release (Windows) to all
# complete successfully on the same tag, then:
#   1. Generates SLSA provenance attestations for all artifacts
#   2. Publishes the draft release (draft: false)
#
# Prerequisites: All 3 platform workflows must upload with draft: true.
# This workflow is the ONLY one that flips draft to false.
# =============================================================================

name: Publish Release

on:
  push:
    tags:
      - 'v[0-9]*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (must have draft release with assets)'
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  wait-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 70

    steps:
      - name: Determine release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            echo "Unsupported event: ${{ github.event_name }}"
            exit 1
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Publishing release: ${TAG}"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Wait for all platform assets on release
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          MAX_WAIT=3600   # 60 minutes (Linux builds 32 bundles, can take 40+ min)
          INTERVAL=30
          ELAPSED=0

          while [ $ELAPSED -lt $MAX_WAIT ]; do
            ASSETS_JSON=$(gh release view "$TAG" --repo "${{ github.repository }}" --json assets 2>/dev/null || echo '{"assets":[]}')

            LINUX=$(echo "$ASSETS_JSON" | jq '[.assets[].name | test("linux.*\\.tar\\.gz$")] | length' 2>/dev/null || echo 0)
            MACOS=$(echo "$ASSETS_JSON" | jq '[.assets[].name | test("macos.*\\.tar\\.gz$")] | length' 2>/dev/null || echo 0)
            WIN=$(echo "$ASSETS_JSON" | jq '[.assets[].name | test("x86_64\\.zip$")] | length' 2>/dev/null || echo 0)

            echo "Assets: Linux=$LINUX, macOS=$MACOS, Windows=$WIN (${ELAPSED}s / ${MAX_WAIT}s)"

            if [ "$LINUX" -ge 8 ] && [ "$MACOS" -ge 4 ] && [ "$WIN" -ge 8 ]; then
              echo "All platform assets present"
              exit 0
            fi

            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
          done

          echo "ERROR: Timeout waiting for platform assets"
          echo "Final counts: Linux=$LINUX, macOS=$MACOS, Windows=$WIN"
          exit 1
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Validate expected asset count via API
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          ASSETS_JSON=$(gh release view "$TAG" --repo "${{ github.repository }}" --json assets)

          LINUX_COUNT=$(echo "$ASSETS_JSON" | jq '[.assets[].name | test("linux.*\\.tar\\.gz$")] | length')
          MACOS_COUNT=$(echo "$ASSETS_JSON" | jq '[.assets[].name | test("macos.*\\.tar\\.gz$")] | length')
          WINDOWS_COUNT=$(echo "$ASSETS_JSON" | jq '[.assets[].name | test("x86_64\\.zip$")] | length')
          TOTAL_COUNT=$(echo "$ASSETS_JSON" | jq '[.assets[].name | test("\\.(tar\\.gz|zip)$")] | length')

          echo "Asset counts: Linux=${LINUX_COUNT}, macOS=${MACOS_COUNT}, Windows=${WINDOWS_COUNT}, Total=${TOTAL_COUNT}"

          fail=0
          [ "$LINUX_COUNT" -lt 8 ] && { echo "ERROR: Linux has only $LINUX_COUNT bundles (expected >= 8)"; fail=1; }
          [ "$MACOS_COUNT" -lt 4 ] && { echo "ERROR: macOS has only $MACOS_COUNT bundles (expected >= 4)"; fail=1; }
          [ "$WINDOWS_COUNT" -lt 8 ] && { echo "ERROR: Windows has only $WINDOWS_COUNT DLLs (expected >= 8)"; fail=1; }
          [ "$TOTAL_COUNT" -lt 20 ] && { echo "ERROR: Total $TOTAL_COUNT assets (expected >= 20)"; fail=1; }

          if [ "$fail" -ne 0 ]; then
            echo "FAIL: Asset count validation failed - release incomplete"
            exit 1
          fi
          echo "OK: All expected platform assets present"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Download all release assets
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          mkdir -p release-assets
          cd release-assets

          # Best-effort download for SLSA attestation and checksums.
          # Validation already done via API — this is for generating
          # SLSA attestations on the actual files.
          gh release download "$TAG" --clobber --repo "${{ github.repository }}" || true

          echo "Downloaded assets:"
          ls -la
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Generate SLSA Provenance Attestations
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            release-assets/*.tar.gz
            release-assets/*.zip

      - name: Verify SLSA attestations
        run: |
          set -e
          fail=0
          for f in release-assets/*.tar.gz release-assets/*.zip; do
            [ -f "$f" ] || continue
            echo "Verifying attestation for: $f"
            if gh attestation verify "$f" \
                --repo "${{ github.repository }}" \
                --signer-workflow "${{ github.repository }}/.github/workflows/publish-release.yml"; then
              echo "  OK"
            else
              echo "  FAILED"
              fail=1
            fi
          done
          [ "$fail" -ne 0 ] && exit 1
          echo "All release artifacts have verified SLSA provenance attestations"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Generate checksums index
        run: |
          cd release-assets
          if ls *.tar.gz *.zip 1> /dev/null 2>&1; then
            sha256sum *.tar.gz *.zip > CHECKSUMS-SHA256.txt 2>/dev/null || true
            md5sum *.tar.gz *.zip > CHECKSUMS-MD5.txt 2>/dev/null || true
            echo "Checksums generated:"
            cat CHECKSUMS-SHA256.txt
          fi

      - name: Upload checksums to release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: release-assets/CHECKSUMS-*.txt
          draft: true

      - name: Publish release
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          echo "Publishing release: $TAG"

          # Detect prerelease from tag name (rc, beta, alpha, dev)
          if echo "$TAG" | grep -qiE '(rc|beta|alpha|dev)\.'; then
            echo "Detected prerelease tag — marking as prerelease"
            gh release edit "$TAG" --draft=false --prerelease --repo "${{ github.repository }}"
          else
            echo "Stable release — publishing as latest"
            gh release edit "$TAG" --draft=false --latest --repo "${{ github.repository }}"
          fi

          echo "Release published: https://github.com/${{ github.repository }}/releases/tag/$TAG"
        env:
          GH_TOKEN: ${{ github.token }}
