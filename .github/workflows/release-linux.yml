# =============================================================================
# PHP Firebird Extension - Linux Precompiled Release Workflow
# =============================================================================
#
# Builds and publishes precompiled PHP extensions with bundled Firebird client
# libraries for all supported PHP versions and variants.
#
# Triggers:
#   - Tag push (v7.*) - immutable releases
#   - Release created/published - non-immutable releases
#   - Manual dispatch (for testing)
#
# Build Matrix:
#   - PHP 8.2, 8.3, 8.4, 8.5
#   - NTS and ZTS variants
#   - x86_64 architecture (aarch64 in future)
#
# Best practices: Uses manylinux_2_28 for broad Linux compatibility
# =============================================================================

name: Release (Linux)

on:
  push:
    tags:
      - 'v7.*'
  release:
    types: [created, published]
  workflow_dispatch:
    inputs:
      php_versions:
        description: 'PHP versions (comma-separated)'
        required: false
        default: '8.2,8.3,8.4,8.5'
        type: string
      upload_to_release:
        description: 'Upload artifacts to release'
        required: false
        default: false
        type: boolean
      release_tag:
        description: 'Release tag (if uploading to existing release)'
        required: false
        default: ''
        type: string

env:
  FB_VERSION: '5.0.3'
  FB_BUILD: '1683'

jobs:
  # ===========================================================================
  # Prepare Build Matrix
  # ===========================================================================
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      version: ${{ steps.get-version.outputs.version }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Get Extension Version
        id: get-version
        run: |
          # Look for PHP_FIREBIRD_VERSION_STRING (set by configure) or fallback
          VERSION=$(grep -E '#define PHP_FIREBIRD_VERSION_STRING' php_firebird.h | sed 's/.*"\([^"]*\)".*/\1/' | head -1)
          # If empty or contains "unknown", use fallback from git tag or default
          if [ -z "$VERSION" ] || [[ "$VERSION" == *"unknown"* ]]; then
            if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
              VERSION="${GITHUB_REF#refs/tags/v}"
            else
              VERSION="7.0.0"
            fi
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Extension version: ${VERSION}"
      
      - name: Set Build Matrix
        id: set-matrix
        run: |
          # Determine PHP versions
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.php_versions }}" ]; then
            PHP_VERSIONS="${{ inputs.php_versions }}"
          else
            # Default: all supported versions
            PHP_VERSIONS="8.2,8.3,8.4,8.5"
          fi
          
          # Build matrix JSON
          MATRIX='{"include":['
          FIRST=true
          
          IFS=',' read -ra VERSIONS <<< "${PHP_VERSIONS}"
          for version in "${VERSIONS[@]}"; do
            version=$(echo "$version" | tr -d ' ')
            for variant in nts zts; do
              if [ "$FIRST" = true ]; then
                FIRST=false
              else
                MATRIX+=','
              fi
              MATRIX+="{\"php\":\"${version}\",\"variant\":\"${variant}\",\"arch\":\"x86_64\"}"
            done
          done
          
          MATRIX+=']}'
          
          echo "matrix=${MATRIX}" >> $GITHUB_OUTPUT
          echo "Build matrix: ${MATRIX}"

  # ===========================================================================
  # Build Precompiled Extensions
  # ===========================================================================
  build:
    needs: prepare
    runs-on: ubuntu-latest
    container:
      image: quay.io/pypa/manylinux_2_28_x86_64
    
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Install Build Dependencies
        run: |
          yum install -y \
            re2-devel \
            libtommath-devel \
            libtomcrypt-devel \
            libicu-devel \
            ncurses-devel \
            libxml2-devel \
            sqlite-devel \
            openssl-devel \
            libcurl-devel \
            zlib-devel \
            oniguruma-devel
          
          # Ensure patchelf
          which patchelf || pip3 install patchelf
      
      - name: Install Firebird SDK
        run: |
          echo "Installing Firebird ${FB_VERSION}..."
          mkdir -p /opt/firebird/{lib,include/firebird}
          
          curl -fsSL "https://github.com/FirebirdSQL/firebird/releases/download/v${FB_VERSION}/Firebird-${FB_VERSION}.${FB_BUILD}-0-linux-x64.tar.gz" \
            -o /tmp/firebird.tar.gz
          
          mkdir -p /tmp/fb
          tar -xzf /tmp/firebird.tar.gz -C /tmp/fb --strip-components=1
          
          # Linux Firebird tarballs have nested structure - extract buildroot.tar.gz
          if [ -f /tmp/fb/buildroot.tar.gz ]; then
            echo "Extracting nested buildroot.tar.gz..."
            tar -xzf /tmp/fb/buildroot.tar.gz -C /tmp/fb
          fi
          
          # Copy libraries from the extracted buildroot path
          if [ -d /tmp/fb/opt/firebird/lib ]; then
            echo "Found libraries in buildroot structure"
            cp -a /tmp/fb/opt/firebird/lib/libfbclient.so* /opt/firebird/lib/
          else
            # Fallback: search for libraries
            find /tmp/fb -name "libfbclient.so*" -exec cp -a {} /opt/firebird/lib/ \;
          fi
          
          # Copy headers from buildroot path (preserve directory structure for nested includes)
          if [ -d /tmp/fb/opt/firebird/include ]; then
            echo "Found headers in buildroot structure"
            cp -r /tmp/fb/opt/firebird/include/* /opt/firebird/include/
          else
            # Fallback: search for headers
            find /tmp/fb -name "ibase.h" -exec cp {} /opt/firebird/include/ \;
          fi
          
          # Also add include/firebird to include path via symlink for nested headers
          if [ -d /opt/firebird/include/firebird ]; then
            ln -sf /opt/firebird/include/firebird/impl /opt/firebird/include/impl 2>/dev/null || true
          fi
          
          # Create symlinks
          cd /opt/firebird/lib
          for lib in libfbclient.so*; do
            if [ -f "$lib" ] && [ ! -L "$lib" ]; then
              base="${lib%%.*}"
              [ ! -e "${base}.so" ] && ln -sf "$lib" "${base}.so"
            fi
          done
          
          rm -rf /tmp/fb /tmp/firebird.tar.gz
          
          echo "Firebird SDK installed:"
          ls -la /opt/firebird/lib/
          echo "Headers:"
          ls -la /opt/firebird/include/
      
      - name: Determine PHP Full Version
        id: php-version
        run: |
          # Map minor version to full version
          case "${{ matrix.php }}" in
            8.2) FULL_VERSION="8.2.28" ;;
            8.3) FULL_VERSION="8.3.16" ;;
            8.4) FULL_VERSION="8.4.4" ;;
            8.5) FULL_VERSION="8.5.0" ;;
            *) FULL_VERSION="${{ matrix.php }}.0" ;;
          esac
          echo "full_version=${FULL_VERSION}" >> $GITHUB_OUTPUT
          echo "PHP full version: ${FULL_VERSION}"
      
      - name: Install PHP ${{ matrix.php }} (${{ matrix.variant }})
        run: |
          FULL_VERSION="${{ steps.php-version.outputs.full_version }}"
          VARIANT="${{ matrix.variant }}"
          INSTALL_DIR="/opt/php/${{ matrix.php }}-${VARIANT}"
          
          echo "Building PHP ${FULL_VERSION} (${VARIANT})..."
          
          # Download PHP source
          curl -fsSL "https://www.php.net/distributions/php-${FULL_VERSION}.tar.xz" \
            -o /tmp/php.tar.xz
          
          mkdir -p /tmp/php-src
          tar -xJf /tmp/php.tar.xz -C /tmp/php-src --strip-components=1
          cd /tmp/php-src
          
          # Configure options
          CONFIGURE_OPTS=(
            "--prefix=${INSTALL_DIR}"
            "--enable-cli"
            "--disable-cgi"
            "--disable-phpdbg"
            "--without-pear"
            "--enable-shared"
            "--enable-mbstring"
            "--enable-intl"
            "--enable-opcache"
            "--with-openssl"
            "--with-zlib"
            "--with-curl"
          )
          
          if [ "${VARIANT}" = "zts" ]; then
            CONFIGURE_OPTS+=("--enable-zts")
          fi
          
          ./configure "${CONFIGURE_OPTS[@]}"
          make -j$(nproc)
          make install
          
          # Verify
          "${INSTALL_DIR}/bin/php" -v
          
          # Set up for build script
          export PATH="${INSTALL_DIR}/bin:${PATH}"
          
          # Cleanup
          cd /
          rm -rf /tmp/php-src /tmp/php.tar.xz
      
      - name: Build Extension
        run: |
          export PATH="/opt/php/${{ matrix.php }}-${{ matrix.variant }}/bin:${PATH}"
          export FB_ROOT=/opt/firebird
          
          echo "Building with:"
          php -v | head -1
          echo "Firebird: ${FB_ROOT}"
          
          # Clean any previous builds
          phpize --clean 2>/dev/null || true
          
          # Build
          phpize
          ./configure --with-firebird="${FB_ROOT}"
          make -j$(nproc)
          
          # Verify
          ls -la modules/firebird.so
      
      - name: Create Bundle
        id: bundle
        shell: bash
        run: |
          set -x  # Enable trace mode for debugging
          export PATH="/opt/php/${{ matrix.php }}-${{ matrix.variant }}/bin:${PATH}"
          export FB_ROOT=/opt/firebird
          # Pass the version from prepare step to ensure bundle name matches expected name
          export EXT_VERSION="${{ needs.prepare.outputs.version }}"
          
          # Debug: Check bash version and environment
          echo "=== Debug Info ==="
          bash --version
          echo "PWD: $(pwd)"
          echo "FB_ROOT: ${FB_ROOT}"
          echo "EXT_VERSION: ${EXT_VERSION}"
          ls -la "${FB_ROOT}/lib/" || echo "FB_ROOT/lib not found"
          ls -la modules/ || echo "modules/ not found"
          which patchelf && patchelf --version || echo "patchelf not found"
          echo "=== End Debug ==="
          
          # Run build script (skip compilation since already done)
          chmod +x scripts/build-precompiled.sh
          bash -x scripts/build-precompiled.sh --skip-build --checksums --verbose \
            "${{ matrix.php }}" "${{ matrix.variant }}" "${{ matrix.arch }}" 2>&1
          
          # Get output filename
          VERSION="${{ needs.prepare.outputs.version }}"
          PHP_VER="${{ matrix.php }}"
          PHP_VER_SHORT="${PHP_VER//.}"
          VARIANT="${{ matrix.variant }}"
          ARCH="${{ matrix.arch }}"
          
          BUNDLE_NAME="php-firebird-${VERSION}-php${PHP_VER_SHORT}-${VARIANT}-linux-${ARCH}"
          
          echo "bundle_name=${BUNDLE_NAME}" >> $GITHUB_OUTPUT
          echo "bundle_file=dist/${BUNDLE_NAME}.tar.gz" >> $GITHUB_OUTPUT
          
          # ============================================================
          # Critical verification: Check bundle structure and RPATH
          # ============================================================
          echo ""
          echo "=== CRITICAL: Bundle verification ==="
          DIST_DIR="dist/${BUNDLE_NAME}"
          
          echo "1. Bundle directory structure:"
          ls -la "${DIST_DIR}/" || echo "ERROR: dist dir not found!"
          
          echo ""
          echo "2. lib/ directory contents:"
          if [ -d "${DIST_DIR}/lib" ]; then
            ls -la "${DIST_DIR}/lib/" | head -20
            echo "Total files: $(find "${DIST_DIR}/lib" -type f | wc -l)"
          else
            echo "ERROR: lib/ directory MISSING!"
          fi
          
          echo ""
          echo "3. RPATH of firebird.so (must be \$ORIGIN/lib):"
          if [ -f "${DIST_DIR}/firebird.so" ]; then
            patchelf --print-rpath "${DIST_DIR}/firebird.so" || echo "patchelf failed"
            readelf -d "${DIST_DIR}/firebird.so" | grep -E "RPATH|RUNPATH" || echo "No RPATH found!"
          else
            echo "ERROR: firebird.so not found in bundle!"
          fi
          
          echo ""
          echo "4. libfbclient verification:"
          if ls "${DIST_DIR}"/lib/libfbclient.so* 2>/dev/null; then
            echo "[OK] libfbclient found"
            ls -la "${DIST_DIR}"/lib/libfbclient.so*
          else
            echo "[ERROR] libfbclient.so NOT FOUND in bundle lib/"
            echo "This will cause runtime loading failure!"
          fi
          
          echo ""
          echo "5. Tarball contents preview:"
          tar -tzf "dist/${BUNDLE_NAME}.tar.gz" | head -30
          
          echo "=== End bundle verification ==="
          
          # Run full verify script
          if [ -x scripts/verify-bundle.sh ]; then
            chmod +x scripts/verify-bundle.sh
            ./scripts/verify-bundle.sh "dist/${BUNDLE_NAME}" --verbose || true
          fi
          
          echo ""
          echo "Bundle files created:"
          ls -la dist/
      
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.bundle.outputs.bundle_name }}
          path: |
            ${{ steps.bundle.outputs.bundle_file }}
            ${{ steps.bundle.outputs.bundle_file }}.sha256
            ${{ steps.bundle.outputs.bundle_file }}.md5
          retention-days: 30

  # ===========================================================================
  # Aggregate and Upload to Release
  # ===========================================================================
  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'release' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
      (github.event_name == 'workflow_dispatch' && inputs.upload_to_release)
    
    permissions:
      contents: write
    
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      
      - name: Prepare Release Assets
        run: |
          mkdir -p release-assets
          
          echo "Downloaded artifacts:"
          find artifacts -type f -name "*.tar.gz*" | head -20
          
          # Collect all bundles
          find artifacts -name "*.tar.gz" -exec cp {} release-assets/ \;
          find artifacts -name "*.sha256" -exec cp {} release-assets/ \;
          find artifacts -name "*.md5" -exec cp {} release-assets/ \;
          
          echo ""
          echo "Release assets:"
          ls -la release-assets/
          
          # Create checksums index
          cd release-assets
          sha256sum *.tar.gz > CHECKSUMS-SHA256.txt
          md5sum *.tar.gz > CHECKSUMS-MD5.txt
          
          echo ""
          echo "CHECKSUMS-SHA256.txt:"
          cat CHECKSUMS-SHA256.txt
      
      - name: Determine Release Tag
        id: release-tag
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
          elif [ -n "${{ inputs.release_tag }}" ]; then
            TAG="${{ inputs.release_tag }}"
          else
            TAG="v${{ needs.prepare.outputs.version }}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Release tag: ${TAG}"
      
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release-tag.outputs.tag }}
          files: |
            release-assets/*.tar.gz
            release-assets/*.sha256
            release-assets/CHECKSUMS-SHA256.txt
          fail_on_unmatched_files: false
          # Create draft release for tag push (immutable releases)
          draft: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ===========================================================================
  # Test Bundles on Multiple Distributions
  # ===========================================================================
  # Each distro tests with the correct PHP version bundle matching its system PHP.
  # Extension requires PHP 8.2+ (PHP 7.x/8.1 not supported).
  #
  # Current matrix:
  # - Ubuntu 24.04: PHP 8.3 -> tests php83-nts bundle
  # - Ubuntu 25.04: PHP 8.4 -> tests php84-nts bundle
  # - Debian 12:    PHP 8.2 -> tests php82-nts bundle
  # - Fedora 41:    PHP 8.3 -> tests php83-nts bundle
  #
  # Removed: Ubuntu 24.10 (EOL July 2025, repos no longer available)
  # Removed: AlmaLinux 9 (default PHP 8.0 not supported, requires 8.1+)
  # Removed: Ubuntu 20.04 (PHP 7.4), Debian 11 (PHP 7.4), AlmaLinux 8 (PHP 7.2)
  test-bundles:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: ubuntu:24.04
            php: "83"
          - distro: ubuntu:25.04
            php: "84"
          - distro: debian:12
            php: "82"
          - distro: fedora:41
            php: "83"

    steps:
      - name: Download PHP ${{ matrix.php }} NTS Bundle
        uses: actions/download-artifact@v4
        with:
          pattern: '*php${{ matrix.php }}-nts*'
          path: bundle
      
      - name: Test on ${{ matrix.distro }}
        timeout-minutes: 10
        run: |
          docker run --rm -v "$(pwd)/bundle:/bundle:ro" ${{ matrix.distro }} bash -c '
            set -e
            
            echo "=== Testing on ${{ matrix.distro }} ==="
            
            # Install PHP and dependencies
            if command -v apt-get &>/dev/null; then
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y php-cli patchelf binutils file || apt-get install -y php-cli binutils file
            elif command -v dnf &>/dev/null; then
              # Enable EPEL for patchelf on RHEL/AlmaLinux
              dnf install -y epel-release || true
              dnf install -y php-cli patchelf binutils file || dnf install -y php-cli binutils file
            elif command -v yum &>/dev/null; then
              yum install -y epel-release || true
              yum install -y php-cli patchelf binutils file || yum install -y php-cli binutils file || true
            fi
            
            # Find and extract bundle
            echo ""
            echo "=== Step 1: Find bundle tarball ==="
            TARBALL=$(find /bundle -name "*.tar.gz" | head -1)
            if [ -z "$TARBALL" ]; then
              echo "ERROR: No bundle found in /bundle!"
              ls -laR /bundle || echo "Cannot list /bundle"
              exit 1
            fi
            
            echo "Testing bundle: $TARBALL"
            echo "Tarball size: $(ls -lh "$TARBALL" | awk "{print \$5}")"
            
            # List tarball contents BEFORE extraction
            echo ""
            echo "=== Step 2: Tarball contents ==="
            tar -tzf "$TARBALL" | head -30
            
            # Extract bundle
            echo ""
            echo "=== Step 3: Extract bundle ==="
            mkdir -p /tmp/test-bundle
            tar -xzf "$TARBALL" -C /tmp/test-bundle --strip-components=1
            
            # Verify extraction
            echo ""
            echo "=== Step 4: Bundle structure after extraction ==="
            echo "Contents of /tmp/test-bundle:"
            ls -la /tmp/test-bundle/
            
            if [ -d /tmp/test-bundle/lib ]; then
              echo ""
              echo "Contents of /tmp/test-bundle/lib/:"
              ls -la /tmp/test-bundle/lib/ | head -20
              LIB_COUNT=$(find /tmp/test-bundle/lib -name "*.so*" | wc -l)
              echo "Total .so files in lib/: $LIB_COUNT"
            else
              echo ""
              echo "ERROR: lib/ directory NOT FOUND in bundle!"
              echo "This is the root cause - bundled libraries are missing"
            fi
            
            cd /tmp/test-bundle
            
            # Check firebird.so exists
            echo ""
            echo "=== Step 5: Verify firebird.so ==="
            if [ ! -f firebird.so ]; then
              echo "ERROR: firebird.so not found!"
              exit 1
            fi
            file firebird.so
            
            # Check RPATH
            echo ""
            echo "=== Step 6: RPATH verification ==="
            if command -v patchelf &>/dev/null; then
              RPATH=$(patchelf --print-rpath firebird.so 2>/dev/null || echo "FAILED")
              echo "RPATH from patchelf: $RPATH"
            fi
            echo "RPATH/RUNPATH from readelf:"
            readelf -d firebird.so 2>/dev/null | grep -E "RPATH|RUNPATH" || echo "(none found)"
            
            # Check if RPATH is correctly set to $ORIGIN/lib
            if ! readelf -d firebird.so 2>/dev/null | grep -qE "RPATH|RUNPATH"; then
              echo ""
              echo "WARNING: No RPATH/RUNPATH set on firebird.so!"
              echo "This means bundled libraries in lib/ cannot be found!"
            fi
            
            # Show ldd output (note: ldd does NOT respect RPATH)
            echo ""
            echo "=== Step 7: ldd output (does NOT respect RPATH) ==="
            echo "NOTE: ldd shows system library resolution, NOT RPATH resolution"
            echo "Missing libs here are expected if using RPATH bundling"
            ldd firebird.so || true
            
            # Check specific library presence
            echo ""
            echo "=== Step 8: Check libfbclient ==="
            if ls lib/libfbclient.so* 2>/dev/null; then
              echo "[OK] libfbclient found in lib/"
              ls -la lib/libfbclient.so*
            else
              echo "[ERROR] libfbclient NOT found in lib/ - this is the problem!"
            fi
            
            # Check PHP version compatibility first
            echo ""
            echo "=== Step 9: Check PHP version compatibility ==="
            echo "PHP version:"
            php -v | head -1
            PHP_MAJOR=$(php -r "echo PHP_MAJOR_VERSION;")
            PHP_MINOR=$(php -r "echo PHP_MINOR_VERSION;")
            echo "Detected: PHP ${PHP_MAJOR}.${PHP_MINOR}"
            
            # Extract bundle PHP version from tarball filename (e.g., php83-nts -> 8.3)
            BUNDLE_PHP_SHORT=$(basename "$TARBALL" | grep -oP "php\K[0-9]+" || echo "")
            if [ -n "$BUNDLE_PHP_SHORT" ]; then
              BUNDLE_PHP_MAJOR="${BUNDLE_PHP_SHORT:0:1}"
              BUNDLE_PHP_MINOR="${BUNDLE_PHP_SHORT:1}"
            else
              echo "WARNING: Could not extract PHP version from tarball name"
              BUNDLE_PHP_MAJOR="8"
              BUNDLE_PHP_MINOR="4"
            fi
            echo "Bundle built for: PHP ${BUNDLE_PHP_MAJOR}.${BUNDLE_PHP_MINOR}"
            
            # Check if system PHP matches bundle PHP version
            if [ "$PHP_MAJOR" != "$BUNDLE_PHP_MAJOR" ] || [ "$PHP_MINOR" != "$BUNDLE_PHP_MINOR" ]; then
              echo ""
              echo ">>> SKIP: System PHP ${PHP_MAJOR}.${PHP_MINOR} differs from bundle PHP ${BUNDLE_PHP_MAJOR}.${BUNDLE_PHP_MINOR}"
              echo ">>> This is expected - bundles are version-specific"
              echo ">>> RPATH mechanism itself is verified via structure checks above"
              echo ""
              echo "=== Test complete (PHP version mismatch - skipped load test) ==="
              exit 0
            fi
            
            # Try loading extension with LD_DEBUG
            echo ""
            echo "=== Step 10: Test PHP extension loading ==="
            
            # First try with LD_DEBUG to see library resolution
            echo ""
            echo "Library resolution trace (LD_DEBUG):"
            LD_DEBUG=libs php -d "extension=$(pwd)/firebird.so" -r "echo \"loaded\";" 2>&1 | grep -E "(firebird|fbclient|found|error|cannot)" | head -20 || true
            
            echo ""
            echo "Loading extension (capturing stdout separately from stderr):"
            
            # Critical fix: Capture stdout and stderr separately
            LOAD_STDOUT=$(php -d "extension=$(pwd)/firebird.so" -m 2>/dev/null || true)
            LOAD_STDERR=$(php -d "extension=$(pwd)/firebird.so" -m 2>&1 >/dev/null || true)
            
            if echo "$LOAD_STDOUT" | grep -qi "^firebird$"; then
              # Verify further with function check
              FUNC_CHECK=$(php -d "extension=$(pwd)/firebird.so" -r "echo function_exists(\"fbird_connect\") ? \"YES\" : \"NO\";" 2>/dev/null || echo "NO")
              if [ "$FUNC_CHECK" = "YES" ]; then
                echo "[OK] SUCCESS: Extension loaded correctly!"
                echo "Loaded modules containing firebird:"
                echo "$LOAD_STDOUT" | grep -i firebird
                echo "fbird_connect function: available"
              else
                echo "[FAIL] Extension appeared in module list but functions not available"
                echo "Stderr: $LOAD_STDERR"
                exit 1
              fi
            else
              echo "[FAIL] Extension failed to load"
              echo "Stdout: $LOAD_STDOUT" | tail -5 || true
              echo "Stderr: $LOAD_STDERR" | tail -10 || true
              
              # Diagnose the specific error
              if echo "$LOAD_STDERR" | grep -q "cannot open shared object"; then
                MISSING_LIB=$(echo "$LOAD_STDERR" | grep -oP "[^ ]+\.so[^ :]*" | head -1)
                echo ""
                echo ">>> DIAGNOSIS: Library loading failed - missing: $MISSING_LIB"
                echo ">>> Check if SONAME symlink exists in lib/"
                echo "Searching for pattern in lib/:"
                ls -la lib/ | grep -E "$(echo "$MISSING_LIB" | sed "s/\.so.*//")" || echo "  (not found)"
              elif echo "$LOAD_STDERR" | grep -q "Warning.*API"; then
                echo ""
                echo ">>> DIAGNOSIS: PHP API version mismatch"
              fi
              exit 1
            fi
            
            echo ""
            echo "=== Test complete ==="
          '
