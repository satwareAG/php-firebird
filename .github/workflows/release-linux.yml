# =============================================================================
# PHP Firebird Extension - Linux Precompiled Release Workflow
# =============================================================================
#
# Builds and publishes precompiled PHP extensions with bundled Firebird client
# libraries for all supported PHP versions and variants.
#
# Triggers:
#   - Tag push (v[0-9]*.*) - immutable releases
#   - Release created/published - non-immutable releases
#   - Manual dispatch (for testing)
#
# Build Matrix:
#   - PHP 8.2, 8.3, 8.4, 8.5
#   - NTS and ZTS variants
#   - x86_64 and aarch64 architectures
#   - glibc (manylinux_2_28) and musl (musllinux_1_2) libc variants
#
# Best practices: Uses manylinux_2_28 for broad glibc Linux compatibility
# musllinux_1_2 for Alpine/musl Linux compatibility
# ARM64 builds use native GitHub ARM runners (ubuntu-24.04-arm)
# =============================================================================

name: Release (Linux)

on:
  push:
    tags:
      - 'v[0-9]*.*'
  release:
    types: [created, published]
  workflow_dispatch:
    inputs:
      php_versions:
        description: 'PHP versions (comma-separated)'
        required: false
        default: '8.2,8.3,8.4,8.5'
        type: string
      upload_to_release:
        description: 'Upload artifacts to release'
        required: false
        default: false
        type: boolean
      release_tag:
        description: 'Release tag (if uploading to existing release)'
        required: false
        default: ''
        type: string

env:
  FB_VERSION: '5.0.3'
  FB_BUILD: '1683'

permissions: read-all

jobs:
  # ===========================================================================
  # CI Gate: Wait for CI/Sanitizers/Code Quality to pass before building
  # ===========================================================================
  ci-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check required workflows passed on this commit
        run: |
          set -euo pipefail
          SHA="${{ github.sha }}"
          MAX_WAIT=1080   # 18 minutes
          INTERVAL=30
          ELAPSED=0

          # Workflow filenames that must pass (CI, Sanitizers, Code Quality)
          REQUIRED=("ci.yml" "sanitizers.yml" "code-quality.yml")

          while [ $ELAPSED -lt $MAX_WAIT ]; do
            ALL_DONE=true
            ALL_PASSED=true

            for wf in "${REQUIRED[@]}"; do
              RESULT=$(gh run list --workflow "$wf" --commit "$SHA" --limit 1 \
                --json status,conclusion 2>/dev/null | jq '.[0] // empty')
              STATUS=$(echo "$RESULT" | jq -r '.status // "not_found"')
              CONCLUSION=$(echo "$RESULT" | jq -r '.conclusion // ""')

              if [ "$STATUS" = "not_found" ]; then
                echo "  $wf: not found (waiting)"
                ALL_DONE=false
              elif [ "$STATUS" != "completed" ]; then
                echo "  $wf: $STATUS (waiting)"
                ALL_DONE=false
              elif [ "$CONCLUSION" != "success" ]; then
                echo "  $wf: $CONCLUSION (FAILED)"
                ALL_PASSED=false
              else
                echo "  $wf: success"
              fi
            done

            if [ "$ALL_DONE" = "true" ]; then
              if [ "$ALL_PASSED" = "true" ]; then
                echo "✓ All required CI workflows passed"
                exit 0
              else
                echo "✗ One or more required CI workflows failed"
                exit 1
              fi
            fi

            echo "Waiting for CI workflows... (${ELAPSED}s / ${MAX_WAIT}s)"
            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
          done

          echo "✗ Timeout waiting for CI workflows to complete"
          exit 1
        env:
          GH_TOKEN: ${{ github.token }}

  # ===========================================================================
  # Prepare Build Matrix
  # ===========================================================================
  prepare:
    needs: ci-gate
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      version: ${{ steps.get-version.outputs.version }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      
      - name: Get Extension Version
        id: get-version
        run: |
          # Priority 1: Git tag (for immutable release builds)
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            echo "${VERSION}" > VERSION.txt
            echo "Updated VERSION.txt from tag: ${VERSION}"
          # Priority 2: VERSION.txt (source of truth; .txt avoids C++ <version> header conflict)
          elif [ -f VERSION.txt ]; then
            VERSION=$(cat VERSION.txt | tr -d '[:space:]')
          # Fallback: php_firebird.h or fail
          else
            VERSION=$(grep -E '#define PHP_FIREBIRD_VERSION_STRING' php_firebird.h | sed 's/.*"\([^"]*\)".*/\1/' | head -1)
            if [ -z "$VERSION" ] || [[ "$VERSION" == *"unknown"* ]]; then
              echo "ERROR: Cannot determine version (no tag, no VERSION.txt, no php_firebird.h define)" >&2
              exit 1
            fi
            echo "${VERSION}" > VERSION.txt
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Extension version: ${VERSION}"
      
      - name: Set Build Matrix
        id: set-matrix
        run: |
          # Determine PHP versions
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.php_versions }}" ]; then
            PHP_VERSIONS="${{ inputs.php_versions }}"
          else
            # Default: all supported versions
            PHP_VERSIONS="8.2,8.3,8.4,8.5"
          fi
          
          # Build matrix JSON
          MATRIX='{"include":['
          FIRST=true
          
          IFS=',' read -ra VERSIONS <<< "${PHP_VERSIONS}"
          for version in "${VERSIONS[@]}"; do
            version=$(echo "$version" | tr -d ' ')
            for variant in nts zts; do
              for arch in x86_64 aarch64; do
                for libc in glibc musl; do
                  # Skip musl+aarch64: GitHub Actions JS actions (checkout, upload-artifact)
                  # do not run inside Alpine containers on ARM64 runners.
                  # See: "JavaScript Actions in Alpine containers are only supported on x64 Linux runners"
                  if [ "${libc}" = "musl" ] && [ "${arch}" = "aarch64" ]; then
                    continue
                  fi
                  if [ "$FIRST" = true ]; then
                    FIRST=false
                  else
                    MATRIX+=','
                  fi
                  # Set arch-specific and libc-specific matrix fields
                  if [ "${libc}" = "musl" ]; then
                    if [ "${arch}" = "aarch64" ]; then
                      RUNNER="ubuntu-24.04-arm"
                      CONTAINER="quay.io/pypa/musllinux_1_2_aarch64"
                    else
                      RUNNER="ubuntu-24.04"
                      CONTAINER="quay.io/pypa/musllinux_1_2_x86_64"
                    fi
                    FB_ARCH="source"
                  else
                    if [ "${arch}" = "aarch64" ]; then
                      RUNNER="ubuntu-24.04-arm"
                      CONTAINER="quay.io/pypa/manylinux_2_28_aarch64"
                      FB_ARCH="linux-arm64"
                    else
                      RUNNER="ubuntu-24.04"
                      CONTAINER="quay.io/pypa/manylinux_2_28_x86_64"
                      FB_ARCH="linux-x64"
                    fi
                  fi
                  MATRIX+="{\"php\":\"${version}\",\"variant\":\"${variant}\",\"arch\":\"${arch}\",\"libc\":\"${libc}\",\"runner\":\"${RUNNER}\",\"container\":\"${CONTAINER}\",\"fb_arch\":\"${FB_ARCH}\"}"
                done
              done
            done
          done
          
          MATRIX+=']}'
          
          echo "matrix=${MATRIX}" >> $GITHUB_OUTPUT
          echo "Build matrix: ${MATRIX}"

  # ===========================================================================
  # Build Precompiled Extensions
  # ===========================================================================
  build:
    needs: prepare
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.container }}
    
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      
      - name: Install Build Dependencies
        run: |
          if [ "${{ matrix.libc }}" = "musl" ]; then
            # musllinux containers use apk (Alpine-based)
            apk add --no-cache \
              autoconf automake bison make gcc g++ git curl wget \
              libtool libxml2-dev sqlite-dev openssl-dev zlib-dev \
              curl-dev oniguruma-dev icu-dev icu-libs ncurses-dev \
              linux-headers patchelf binutils file tar xz \
              re2-dev libedit-dev coreutils bash perl \
              libc-dev musl-dev jq
          else
            # manylinux containers use yum (AlmaLinux-based)
            yum install -y \
              re2-devel \
              libtommath-devel \
              libtomcrypt-devel \
              libicu-devel \
              ncurses-devel \
              libxml2-devel \
              sqlite-devel \
              openssl-devel \
              libcurl-devel \
              zlib-devel \
              oniguruma-devel
            
            # Ensure patchelf
            which patchelf || pip3 install patchelf
          fi
      
      - name: Install Firebird SDK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ matrix.fb_arch }}" = "source" ]; then
            # musl: Build Firebird from source
            echo "Building Firebird from source for musl..."
            chmod +x .github/scripts/build-firebird-musl.sh
            bash .github/scripts/build-firebird-musl.sh \
              --arch "${{ matrix.arch }}" \
              --fb-version "${FB_VERSION}" \
              --fb-build "${FB_BUILD}"
          else
          echo "Installing Firebird ${FB_VERSION}..."
          mkdir -p /opt/firebird/{lib,include/firebird}

          FB_URL="https://github.com/FirebirdSQL/firebird/releases/download/v${FB_VERSION}/Firebird-${FB_VERSION}.${FB_BUILD}-0-${{ matrix.fb_arch }}.tar.gz"
          DELAY=10

          for attempt in 1 2 3 4 5; do
            echo "Downloading Firebird SDK (attempt ${attempt}/5)..."
            if curl -fsSL \
                --retry 3 --retry-delay 5 --retry-connrefused \
                -H "Authorization: token ${GITHUB_TOKEN}" \
                "${FB_URL}" -o /tmp/firebird.tar.gz; then
              FSIZE=$(stat -c%s /tmp/firebird.tar.gz 2>/dev/null || echo "0")
              if [ "${FSIZE}" -gt 8000000 ]; then
                echo "Download succeeded (${FSIZE} bytes)"
                break
              fi
              echo "File too small (${FSIZE} bytes), discarding"
              rm -f /tmp/firebird.tar.gz
            fi
            # wget fallback
            if wget -q --tries=3 --timeout=90 \
                --header="Authorization: token ${GITHUB_TOKEN}" \
                "${FB_URL}" -O /tmp/firebird.tar.gz; then
              FSIZE=$(stat -c%s /tmp/firebird.tar.gz 2>/dev/null || echo "0")
              if [ "${FSIZE}" -gt 8000000 ]; then
                echo "wget download succeeded (${FSIZE} bytes)"
                break
              fi
              rm -f /tmp/firebird.tar.gz
            fi
            [ "${attempt}" -lt 5 ] && echo "Sleeping ${DELAY}s..." && sleep "${DELAY}"
            DELAY=$((DELAY * 2))
          done

          if [ ! -f /tmp/firebird.tar.gz ]; then
            echo "ERROR: All download attempts failed for Firebird SDK" >&2
            exit 1
          fi
          
          mkdir -p /tmp/fb
          tar -xzf /tmp/firebird.tar.gz -C /tmp/fb --strip-components=1
          
          # Linux Firebird tarballs have nested structure - extract buildroot.tar.gz
          if [ -f /tmp/fb/buildroot.tar.gz ]; then
            echo "Extracting nested buildroot.tar.gz..."
            tar -xzf /tmp/fb/buildroot.tar.gz -C /tmp/fb
          fi
          
          # Copy libraries from the extracted buildroot path
          if [ -d /tmp/fb/opt/firebird/lib ]; then
            echo "Found libraries in buildroot structure"
            cp -a /tmp/fb/opt/firebird/lib/libfbclient.so* /opt/firebird/lib/
          else
            # Fallback: search for libraries
            find /tmp/fb -name "libfbclient.so*" -exec cp -a {} /opt/firebird/lib/ \;
          fi
          
          # Copy headers from buildroot path (preserve directory structure for nested includes)
          if [ -d /tmp/fb/opt/firebird/include ]; then
            echo "Found headers in buildroot structure"
            cp -r /tmp/fb/opt/firebird/include/* /opt/firebird/include/
          else
            # Fallback: search for headers
            find /tmp/fb -name "ibase.h" -exec cp {} /opt/firebird/include/ \;
          fi
          
          # Also add include/firebird to include path via symlink for nested headers
          if [ -d /opt/firebird/include/firebird ]; then
            ln -sf /opt/firebird/include/firebird/impl /opt/firebird/include/impl 2>/dev/null || true
          fi
          
          # Create symlinks
          cd /opt/firebird/lib
          for lib in libfbclient.so*; do
            if [ -f "$lib" ] && [ ! -L "$lib" ]; then
              base="${lib%%.*}"
              [ ! -e "${base}.so" ] && ln -sf "$lib" "${base}.so"
            fi
          done
          
          rm -rf /tmp/fb /tmp/firebird.tar.gz
          
          echo "Firebird SDK installed:"
          ls -la /opt/firebird/lib/
          echo "Headers:"
          ls -la /opt/firebird/include/
          fi
      
      - name: Determine PHP Full Version
        id: php-version
        run: |
          MINOR="${{ matrix.php }}"

          # Query php.net JSON API for the latest patch release of this minor.
          # Falls back to known-good versions if the API is unavailable.
          LATEST=$(curl -fsSL --retry 3 --retry-delay 5 \
            "https://www.php.net/releases/index.php?json&version=${MINOR}" \
            2>/dev/null | jq -r ".\"${MINOR}\".version // empty" 2>/dev/null || true)

          if [ -n "${LATEST}" ] && [[ "${LATEST}" =~ ^${MINOR}\. ]]; then
            echo "Resolved PHP ${MINOR} latest from php.net: ${LATEST}"
            FULL_VERSION="${LATEST}"
          else
            echo "php.net API unavailable or returned unexpected data; using known-good fallback"
            case "${MINOR}" in
              8.2) FULL_VERSION="8.2.28" ;;
              8.3) FULL_VERSION="8.3.16" ;;
              8.4) FULL_VERSION="8.4.4" ;;
              8.5) FULL_VERSION="8.5.0" ;;
              *) FULL_VERSION="${MINOR}.0" ;;
            esac
            echo "Fallback version: ${FULL_VERSION}"
          fi

          echo "full_version=${FULL_VERSION}" >> $GITHUB_OUTPUT
          echo "PHP full version: ${FULL_VERSION}"
      
      - name: Install PHP ${{ matrix.php }} (${{ matrix.variant }})
        shell: bash
        run: |
          FULL_VERSION="${{ steps.php-version.outputs.full_version }}"
          VARIANT="${{ matrix.variant }}"
          INSTALL_DIR="/opt/php/${{ matrix.php }}-${VARIANT}"
          
          echo "Building PHP ${FULL_VERSION} (${VARIANT})..."
          
          # Download PHP source
          curl -fsSL "https://www.php.net/distributions/php-${FULL_VERSION}.tar.xz" \
            -o /tmp/php.tar.xz
          
          mkdir -p /tmp/php-src
          tar -xJf /tmp/php.tar.xz -C /tmp/php-src --strip-components=1
          cd /tmp/php-src
          
          # Configure options
          CONFIGURE_OPTS=(
            "--prefix=${INSTALL_DIR}"
            "--enable-cli"
            "--disable-cgi"
            "--disable-phpdbg"
            "--without-pear"
            "--enable-shared"
            "--enable-mbstring"
            "--enable-intl"
            "--enable-opcache"
            "--with-openssl"
            "--with-zlib"
            "--with-curl"
          )
          
          if [ "${VARIANT}" = "zts" ]; then
            CONFIGURE_OPTS+=("--enable-zts")
          fi

          # Disable JIT on musl: PHP's JIT uses @TLSGD relocations that are
          # incompatible with musl's TLS implementation on ZTS builds.
          # Error: "@TLSGD operator requires `%rdi' as dest register"
          if [ "${{ matrix.libc }}" = "musl" ]; then
            CONFIGURE_OPTS+=("--disable-opcache-jit")
          fi

          ./configure "${CONFIGURE_OPTS[@]}"
          make -j$(nproc)
          make install
          
          # Verify
          "${INSTALL_DIR}/bin/php" -v
          
          # Set up for build script
          export PATH="${INSTALL_DIR}/bin:${PATH}"
          
          # Cleanup
          cd /
          rm -rf /tmp/php-src /tmp/php.tar.xz
      
      - name: Build Extension
        run: |
          export PATH="/opt/php/${{ matrix.php }}-${{ matrix.variant }}/bin:${PATH}"
          export FB_ROOT=/opt/firebird
          
          # Ensure Firebird libraries are discoverable regardless of PHP_LIBDIR (lib vs lib64)
          # config.m4 line 64 uses $PHP_FIREBIRD/$PHP_LIBDIR which may be lib64 on x86_64
          # Force lib64 -> lib symlink (remove any pre-existing empty dir from source builds)
          rm -rf "${FB_ROOT}/lib64" 2>/dev/null || true
          ln -sf lib "${FB_ROOT}/lib64"
          
          echo "Building with:"
          php -v | head -1
          echo "Firebird: ${FB_ROOT}"
          
          # Clean any previous builds
          phpize --clean 2>/dev/null || true
          
          # Build with LTO for optimized release binaries
          # -rpath-link helps the linker resolve DT_NEEDED transitive dependencies
          # (e.g. libtommath.so needed by libfbclient.so) during configure link tests
          export CFLAGS="${CFLAGS:-} -flto=auto"
          export LDFLAGS="${LDFLAGS:-} -flto=auto -Wl,-rpath-link,${FB_ROOT}/lib"
          
          # musl source-built libfbclient is a C++ library; PHP's configure tests
          # link with cc (C compiler) so we must explicitly add -lstdc++ and the
          # transitive deps that libfbclient.so DT_NEEDS.
          if [ "${{ matrix.libc }}" = "musl" ]; then
            export LIBS="-lstdc++ -lm"
            echo "musl: added LIBS='${LIBS}' for C++ libfbclient linking"
          fi
          
          phpize
          ./configure --with-firebird="${FB_ROOT}"
          make -j$(nproc)
          
          # Verify
          ls -la modules/firebird.so
      
      - name: Create Bundle
        id: bundle
        shell: bash
        run: |
          set -x  # Enable trace mode for debugging
          export PATH="/opt/php/${{ matrix.php }}-${{ matrix.variant }}/bin:${PATH}"
          export FB_ROOT=/opt/firebird
          # Pass the version from prepare step to ensure bundle name matches expected name
          export EXT_VERSION="${{ needs.prepare.outputs.version }}"
          
          # Debug: Check bash version and environment
          echo "=== Debug Info ==="
          bash --version
          echo "PWD: $(pwd)"
          echo "FB_ROOT: ${FB_ROOT}"
          echo "EXT_VERSION: ${EXT_VERSION}"
          ls -la "${FB_ROOT}/lib/" || echo "FB_ROOT/lib not found"
          ls -la modules/ || echo "modules/ not found"
          which patchelf && patchelf --version || echo "patchelf not found"
          echo "=== End Debug ==="
          
          # Run build script (skip compilation since already done)
          chmod +x scripts/build-precompiled.sh
          bash -x scripts/build-precompiled.sh --skip-build --checksums --verbose \
            "${{ matrix.php }}" "${{ matrix.variant }}" "${{ matrix.arch }}" 2>&1
          
          # Get output filename
          VERSION="${{ needs.prepare.outputs.version }}"
          PHP_VER="${{ matrix.php }}"
          PHP_VER_SHORT="${PHP_VER//.}"
          VARIANT="${{ matrix.variant }}"
          ARCH="${{ matrix.arch }}"
          
          # Include musl suffix for musl builds to distinguish from glibc bundles
          if [ "${{ matrix.libc }}" = "musl" ]; then
            BUNDLE_NAME="php-firebird-${VERSION}-php${PHP_VER_SHORT}-${VARIANT}-linux-musl-${ARCH}"
          else
            BUNDLE_NAME="php-firebird-${VERSION}-php${PHP_VER_SHORT}-${VARIANT}-linux-${ARCH}"
          fi
          
          # For musl builds, rename dist artifacts from build-precompiled.sh
          # (which doesn't know about the musl suffix) to the correct name
          if [ "${{ matrix.libc }}" = "musl" ]; then
            OLD_NAME="php-firebird-${VERSION}-php${PHP_VER_SHORT}-${VARIANT}-linux-${ARCH}"
            if [ -d "dist/${OLD_NAME}" ] && [ "${OLD_NAME}" != "${BUNDLE_NAME}" ]; then
              echo "Renaming musl bundle: ${OLD_NAME} -> ${BUNDLE_NAME}"
              mv "dist/${OLD_NAME}" "dist/${BUNDLE_NAME}"
              # Re-create tarball with correct directory name
              (cd dist && tar -czf "${BUNDLE_NAME}.tar.gz" "${BUNDLE_NAME}")
              # Re-generate checksums
              sha256sum "dist/${BUNDLE_NAME}.tar.gz" | awk '{print $1}' > "dist/${BUNDLE_NAME}.tar.gz.sha256"
              md5sum "dist/${BUNDLE_NAME}.tar.gz" | awk '{print $1}' > "dist/${BUNDLE_NAME}.tar.gz.md5"
              # Clean up old tarball/checksums
              rm -f "dist/${OLD_NAME}.tar.gz" "dist/${OLD_NAME}.tar.gz.sha256" "dist/${OLD_NAME}.tar.gz.md5"
            fi
          fi
          
          echo "bundle_name=${BUNDLE_NAME}" >> $GITHUB_OUTPUT
          echo "bundle_file=dist/${BUNDLE_NAME}.tar.gz" >> $GITHUB_OUTPUT
          
          # ============================================================
          # Critical verification: Check bundle structure and RPATH
          # ============================================================
          echo ""
          echo "=== CRITICAL: Bundle verification ==="
          DIST_DIR="dist/${BUNDLE_NAME}"
          
          echo "1. Bundle directory structure:"
          ls -la "${DIST_DIR}/" || echo "ERROR: dist dir not found!"
          
          echo ""
          echo "2. lib/ directory contents:"
          if [ -d "${DIST_DIR}/lib" ]; then
            ls -la "${DIST_DIR}/lib/" | head -20 || true
            echo "Total files: $(find "${DIST_DIR}/lib" -type f | wc -l)"
          else
            echo "ERROR: lib/ directory MISSING!"
          fi
          
          echo ""
          echo "3. RPATH of firebird.so (must be \$ORIGIN/lib):"
          if [ -f "${DIST_DIR}/firebird.so" ]; then
            patchelf --print-rpath "${DIST_DIR}/firebird.so" || echo "patchelf failed"
            readelf -d "${DIST_DIR}/firebird.so" | grep -E "RPATH|RUNPATH" || echo "No RPATH found!"
          else
            echo "ERROR: firebird.so not found in bundle!"
          fi
          
          echo ""
          echo "4. libfbclient verification:"
          if ls "${DIST_DIR}"/lib/libfbclient.so* 2>/dev/null; then
            echo "[OK] libfbclient found"
            ls -la "${DIST_DIR}"/lib/libfbclient.so*
          else
            echo "[ERROR] libfbclient.so NOT FOUND in bundle lib/"
            echo "This will cause runtime loading failure!"
          fi
          
          echo ""
          echo "5. Tarball contents preview:"
          tar -tzf "dist/${BUNDLE_NAME}.tar.gz" | head -30 || true
          
          echo "=== End bundle verification ==="
          
          # Run full verify script
          if [ -x scripts/verify-bundle.sh ]; then
            chmod +x scripts/verify-bundle.sh
            ./scripts/verify-bundle.sh "dist/${BUNDLE_NAME}" --verbose || true
          fi
          
          echo ""
          echo "Bundle files created:"
          ls -la dist/
      
      - name: Generate SBOM (CycloneDX)
        continue-on-error: true  # sbom-action may fail in manylinux/musl containers
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: dist/${{ steps.bundle.outputs.bundle_name }}
          format: cyclonedx-json
          output-file: dist/${{ steps.bundle.outputs.bundle_name }}.sbom.cdx.json
          artifact-name: ''

      - name: Upload Artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ steps.bundle.outputs.bundle_name }}
          path: |
            ${{ steps.bundle.outputs.bundle_file }}
            ${{ steps.bundle.outputs.bundle_file }}.sha256
            ${{ steps.bundle.outputs.bundle_file }}.md5
            dist/${{ steps.bundle.outputs.bundle_name }}.sbom.cdx.json
          retention-days: 30

  # ===========================================================================
  # Aggregate and Upload to Release
  # ===========================================================================
  release:
    needs: [prepare, build, test-bundles]
    runs-on: ubuntu-24.04
    if: |
      github.event_name == 'release' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
      (github.event_name == 'workflow_dispatch' && inputs.upload_to_release)
    
    permissions:
      contents: write
      id-token: write
      attestations: write
    
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          path: artifacts
      
      - name: Prepare Release Assets
        run: |
          mkdir -p release-assets
          
          echo "Downloaded artifacts:"
          find artifacts -type f -name "*.tar.gz*" | head -20
          
          # Collect all bundles and SBOMs
          find artifacts -name "*.tar.gz" -exec cp {} release-assets/ \;
          find artifacts -name "*.sha256" -exec cp {} release-assets/ \;
          find artifacts -name "*.md5" -exec cp {} release-assets/ \;
          find artifacts -name "*.sbom.cdx.json" -exec cp {} release-assets/ \;
          
          echo ""
          echo "Release assets:"
          ls -la release-assets/
          
          # Create checksums index
          cd release-assets
          sha256sum *.tar.gz > CHECKSUMS-SHA256.txt
          md5sum *.tar.gz > CHECKSUMS-MD5.txt
          
          echo ""
          echo "CHECKSUMS-SHA256.txt:"
          cat CHECKSUMS-SHA256.txt
      
      - name: Determine Release Tag
        id: release-tag
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
          elif [ -n "${{ inputs.release_tag }}" ]; then
            TAG="${{ inputs.release_tag }}"
          else
            TAG="v${{ needs.prepare.outputs.version }}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Release tag: ${TAG}"
      
      - name: Upload to Release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2
        with:
          tag_name: ${{ steps.release-tag.outputs.tag }}
          files: |
            release-assets/*.tar.gz
            release-assets/*.sha256
            release-assets/*.sbom.cdx.json
            release-assets/CHECKSUMS-SHA256.txt
          fail_on_unmatched_files: false
          # Create draft release for tag push (immutable releases)
          draft: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SLSA Provenance Attestations
        run: |
          echo "Generating SLSA provenance attestations for release artifacts..."
          for artifact in release-assets/*.tar.gz; do
            echo "Attesting: $(basename "$artifact")"
            gh attestation generate "$artifact" \
              --repo "${{ github.repository }}" \
              --signer github 2>&1 || echo "WARNING: Attestation failed for $(basename "$artifact")"
          done
          echo "Attestation generation complete."
          echo "Verify with: gh attestation verify <artifact> --repo ${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ===========================================================================
  # Test Bundles on Multiple Distributions
  # ===========================================================================
  # Each distro tests with the correct PHP version bundle matching its system PHP.
  # Extension requires PHP 8.2+ (PHP 7.x/8.1 not supported).
  #
  # Current matrix:
  # - Ubuntu 24.04: PHP 8.3 -> tests php83-nts bundle
  # - Ubuntu 25.04: PHP 8.4 -> tests php84-nts bundle
  # - Debian 12:    PHP 8.2 -> tests php82-nts bundle
  # - Fedora 41:    PHP 8.3 -> tests php83-nts bundle
  #
  # Removed: Ubuntu 24.10 (EOL July 2025, repos no longer available)
  # Removed: AlmaLinux 9 (default PHP 8.0 not supported, requires 8.1+)
  # Removed: Ubuntu 20.04 (PHP 7.4), Debian 11 (PHP 7.4), AlmaLinux 8 (PHP 7.2)
  test-bundles:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    if: |
      github.event_name == 'release' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
      github.event_name == 'workflow_dispatch'
    
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: ubuntu:24.04
            php: "83"
            bundle_pattern: "*php83-nts-linux-x86_64*"
          - distro: ubuntu:25.04
            php: "84"
            bundle_pattern: "*php84-nts-linux-x86_64*"
          - distro: debian:12
            php: "82"
            bundle_pattern: "*php82-nts-linux-x86_64*"
          - distro: fedora:41
            php: "83"
            bundle_pattern: "*php83-nts-linux-x86_64*"
          - distro: alpine:3.21
            php: "83"
            bundle_suffix: "musl"
            bundle_pattern: "*php83-nts-linux-musl-x86_64*"

    steps:
      - name: Download PHP ${{ matrix.php }} NTS Bundle
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: "${{ matrix.bundle_pattern }}"
          path: bundle
      
      - name: Test on ${{ matrix.distro }}
        timeout-minutes: 10
        run: |
          docker run --rm -v "$(pwd)/bundle:/bundle:ro" ${{ matrix.distro }} /bin/sh -c '
            set -e
            
            echo "=== Testing on ${{ matrix.distro }} ==="
            
            # Install PHP and dependencies (plus bash for the rest of the script)
            if command -v apk >/dev/null 2>&1; then
              # Alpine Linux (musl)
              # php83-pdo required: firebird.so integrates pdo_fbird when built against PDO-enabled PHP
              apk add --no-cache bash php83 php83-cli php83-pdo patchelf binutils file grep
              ln -sf /usr/bin/php83 /usr/bin/php 2>/dev/null || true
            elif command -v apt-get >/dev/null 2>&1; then
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y php-cli php-pdo patchelf binutils file || apt-get install -y php-cli binutils file
            elif command -v dnf &>/dev/null; then
              # Enable EPEL for patchelf on RHEL/AlmaLinux
              dnf install -y epel-release || true
              # php-pdo required: firebird.so integrates pdo_fbird when built against PDO-enabled PHP
              dnf install -y php-cli php-pdo patchelf binutils file || dnf install -y php-cli php-pdo binutils file
            elif command -v yum &>/dev/null; then
              yum install -y epel-release || true
              yum install -y php-cli patchelf binutils file || yum install -y php-cli binutils file || true
            fi
            
            # Find and extract bundle
            echo ""
            echo "=== Step 1: Find bundle tarball ==="
            TARBALL=$(find /bundle -name "*.tar.gz" | head -1)
            if [ -z "$TARBALL" ]; then
              echo "ERROR: No bundle found in /bundle!"
              ls -laR /bundle || echo "Cannot list /bundle"
              exit 1
            fi
            
            echo "Testing bundle: $TARBALL"
            echo "Tarball size: $(ls -lh "$TARBALL" | awk "{print \$5}")"
            
            # List tarball contents BEFORE extraction
            echo ""
            echo "=== Step 2: Tarball contents ==="
            tar -tzf "$TARBALL" | head -30
            
            # Extract bundle
            echo ""
            echo "=== Step 3: Extract bundle ==="
            mkdir -p /tmp/test-bundle
            tar -xzf "$TARBALL" -C /tmp/test-bundle --strip-components=1
            
            # Verify extraction
            echo ""
            echo "=== Step 4: Bundle structure after extraction ==="
            echo "Contents of /tmp/test-bundle:"
            ls -la /tmp/test-bundle/
            
            if [ -d /tmp/test-bundle/lib ]; then
              echo ""
              echo "Contents of /tmp/test-bundle/lib/:"
              ls -la /tmp/test-bundle/lib/ | head -20
              LIB_COUNT=$(find /tmp/test-bundle/lib -name "*.so*" | wc -l)
              echo "Total .so files in lib/: $LIB_COUNT"
            else
              echo ""
              echo "ERROR: lib/ directory NOT FOUND in bundle!"
              echo "This is the root cause - bundled libraries are missing"
            fi
            
            cd /tmp/test-bundle
            
            # Check firebird.so exists
            echo ""
            echo "=== Step 5: Verify firebird.so ==="
            if [ ! -f firebird.so ]; then
              echo "ERROR: firebird.so not found!"
              exit 1
            fi
            file firebird.so
            
            # Check RPATH
            echo ""
            echo "=== Step 6: RPATH verification ==="
            if command -v patchelf >/dev/null 2>&1; then
              RPATH=$(patchelf --print-rpath firebird.so 2>/dev/null || echo "FAILED")
              echo "RPATH from patchelf: $RPATH"
            fi
            echo "RPATH/RUNPATH from readelf:"
            readelf -d firebird.so 2>/dev/null | grep -E "RPATH|RUNPATH" || echo "(none found)"
            
            # Check if RPATH is correctly set to $ORIGIN/lib
            if ! readelf -d firebird.so 2>/dev/null | grep -qE "RPATH|RUNPATH"; then
              echo ""
              echo "WARNING: No RPATH/RUNPATH set on firebird.so!"
              echo "This means bundled libraries in lib/ cannot be found!"
            fi
            
            # Show ldd output (note: ldd does NOT respect RPATH)
            echo ""
            echo "=== Step 7: ldd output (does NOT respect RPATH) ==="
            echo "NOTE: ldd shows system library resolution, NOT RPATH resolution"
            echo "Missing libs here are expected if using RPATH bundling"
            ldd firebird.so || true
            
            # Check specific library presence
            echo ""
            echo "=== Step 8: Check libfbclient ==="
            if ls lib/libfbclient.so* 2>/dev/null; then
              echo "[OK] libfbclient found in lib/"
              ls -la lib/libfbclient.so*
            else
              echo "[ERROR] libfbclient NOT found in lib/ - this is the problem!"
            fi
            
            # Check PHP version compatibility first
            echo ""
            echo "=== Step 9: Check PHP version compatibility ==="
            echo "PHP version:"
            php -v | head -1
            PHP_MAJOR=$(php -r "echo PHP_MAJOR_VERSION;")
            PHP_MINOR=$(php -r "echo PHP_MINOR_VERSION;")
            echo "Detected: PHP ${PHP_MAJOR}.${PHP_MINOR}"
            
            # Extract bundle PHP version from tarball filename (e.g., php83-nts -> 8.3)
            # Use sed instead of grep -oP for POSIX sh compatibility (Alpine)
            BUNDLE_PHP_SHORT=$(basename "$TARBALL" | sed -n "s/.*php\([0-9][0-9]*\).*/\1/p")
            if [ -n "$BUNDLE_PHP_SHORT" ]; then
              BUNDLE_PHP_MAJOR=$(printf '%s' "$BUNDLE_PHP_SHORT" | cut -c1)
              BUNDLE_PHP_MINOR=$(printf '%s' "$BUNDLE_PHP_SHORT" | cut -c2-)
            else
              echo "WARNING: Could not extract PHP version from tarball name"
              BUNDLE_PHP_MAJOR="8"
              BUNDLE_PHP_MINOR="4"
            fi
            echo "Bundle built for: PHP ${BUNDLE_PHP_MAJOR}.${BUNDLE_PHP_MINOR}"
            
            # Check if system PHP matches bundle PHP version
            if [ "$PHP_MAJOR" != "$BUNDLE_PHP_MAJOR" ] || [ "$PHP_MINOR" != "$BUNDLE_PHP_MINOR" ]; then
              echo ""
              echo ">>> SKIP: System PHP ${PHP_MAJOR}.${PHP_MINOR} differs from bundle PHP ${BUNDLE_PHP_MAJOR}.${BUNDLE_PHP_MINOR}"
              echo ">>> This is expected - bundles are version-specific"
              echo ">>> RPATH mechanism itself is verified via structure checks above"
              echo ""
              echo "=== Test complete (PHP version mismatch - skipped load test) ==="
              exit 0
            fi
            
            # Try loading extension with LD_DEBUG
            echo ""
            echo "=== Step 10: Test PHP extension loading ==="
            
            # First try with LD_DEBUG to see library resolution
            echo ""
            echo "Library resolution trace (LD_DEBUG):"
            LD_DEBUG=libs php -d "extension=$(pwd)/firebird.so" -r "echo \"loaded\";" 2>&1 | grep -E "(firebird|fbclient|found|error|cannot)" | head -20 || true
            
            echo ""
            echo "Loading extension (capturing stdout separately from stderr):"
            
            # Critical fix: Capture stdout and stderr separately
            LOAD_STDOUT=$(php -d "extension=$(pwd)/firebird.so" -m 2>/dev/null || true)
            LOAD_STDERR=$(php -d "extension=$(pwd)/firebird.so" -m 2>&1 >/dev/null || true)
            
            if echo "$LOAD_STDOUT" | grep -qi "^firebird$"; then
              # Verify further with function check
              FUNC_CHECK=$(php -d "extension=$(pwd)/firebird.so" -r "echo function_exists(\"fbird_connect\") ? \"YES\" : \"NO\";" 2>/dev/null || echo "NO")
              if [ "$FUNC_CHECK" = "YES" ]; then
                echo "[OK] SUCCESS: Extension loaded correctly!"
                echo "Loaded modules containing firebird:"
                echo "$LOAD_STDOUT" | grep -i firebird
                echo "fbird_connect function: available"
              else
                echo "[FAIL] Extension appeared in module list but functions not available"
                echo "Stderr: $LOAD_STDERR"
                exit 1
              fi
            else
              echo "[FAIL] Extension failed to load"
              echo "Stdout: $LOAD_STDOUT" | tail -5 || true
              echo "Stderr: $LOAD_STDERR" | tail -10 || true
              
              # Diagnose the specific error
              if echo "$LOAD_STDERR" | grep -q "cannot open shared object"; then
                MISSING_LIB=$(echo "$LOAD_STDERR" | sed -n "s/.*\([^ ]*\.so[^ :]*\).*/\1/p" | head -1)
                echo ""
                echo ">>> DIAGNOSIS: Library loading failed - missing: $MISSING_LIB"
                echo ">>> Check if SONAME symlink exists in lib/"
                echo "Searching for pattern in lib/:"
                ls -la lib/ | grep -E "$(echo "$MISSING_LIB" | sed "s/\.so.*//")" || echo "  (not found)"
              elif echo "$LOAD_STDERR" | grep -q "Warning.*API"; then
                echo ""
                echo ">>> DIAGNOSIS: PHP API version mismatch"
              fi
              exit 1
            fi
            
            echo ""
            echo "=== Test complete ==="
          '
