# =============================================================================
# PHP Firebird Extension - Windows DLL Build
# =============================================================================
# Builds Windows DLLs using official php/php-windows-builder actions.
#
# Triggers:
#   - Tag push (v[0-9]*.*) - immutable releases
#   - Release created/published - non-immutable releases
#   - Pull requests (build only, no release)
#   - Manual dispatch (testing)
#
# Best practices from: https://github.com/php/php-windows-builder
# =============================================================================

name: Release (Windows)

on:
  push:
    tags:
      - 'v[0-9]*.*'
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build for (optional)'
        required: false

permissions:
  contents: write

env:
  FIREBIRD_SDK_CACHE_KEY: firebird-sdk-v2

jobs:
  # ===========================================================================
  # Generate build matrix using php-windows-builder/extension-matrix
  # Reads PHP constraints from composer.json
  # ===========================================================================
  get-extension-matrix:
    # CI gate removed — relies on pre-tag verification (scripts/verify-ci-green.sh)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.extension-matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Ensure VERSION.txt
        uses: ./.github/actions/version

      - name: Get the extension matrix
        id: extension-matrix
        uses: php/php-windows-builder/extension-matrix@c49dae50774b14e0f358d2efa65637b67f1104f6 # v1
        with:
          php-version-list: '8.2, 8.3, 8.4, 8.5'
          arch-list: 'x64'
          ts-list: 'nts, ts'

  # ===========================================================================
  # Build Windows DLLs
  # ===========================================================================
  build:
    needs: get-extension-matrix
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.get-extension-matrix.outputs.matrix) }}
    env:
      FIREBIRD_VERSION: '5.0'

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Ensure VERSION.txt
        uses: ./.github/actions/version

      - name: Cache Firebird SDK
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        id: cache-fb-sdk
        with:
          path: C:\firebird-sdk
          key: ${{ env.FIREBIRD_SDK_CACHE_KEY }}-${{ env.FIREBIRD_VERSION }}-${{ matrix.arch }}

      - name: Download Firebird SDK
        if: steps.cache-fb-sdk.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          .\.github\scripts\download-firebird-sdk.ps1 `
            -Version "${{ env.FIREBIRD_VERSION }}" `
            -Architecture "${{ matrix.arch }}" `
            -DestinationPath "C:\firebird-sdk"

      - name: Set Firebird Environment
        shell: pwsh
        run: |
          $sdkPath = "C:\firebird-sdk"
          echo "FIREBIRD_HOME=$sdkPath" >> $env:GITHUB_ENV
          echo "$sdkPath\bin" >> $env:GITHUB_PATH

      - name: Check PHP SDK availability
        shell: pwsh
        run: |
          # Check if downloads.php.net is reachable before attempting the build.
          # jane: php-windows-builder downloads PHP SDK deps from downloads.php.net
          # which intermittently returns 504 Gateway Timeout. This check gives early
          # visibility and a retry window before the build step fails.
          $vs = if ('${{ matrix.php-version }}' -ge '8.4') { 'vs17' } else { 'vs16' }
          $url = "https://downloads.php.net/~windows/php-sdk/deps/$vs/x64/"
          for ($i = 1; $i -le 5; $i++) {
            try {
              $resp = Invoke-WebRequest -Uri $url -Method Head -TimeoutSec 10
              Write-Host "PHP SDK available (HTTP $($resp.StatusCode))"
              exit 0
            } catch {
              Write-Host "Attempt $i/5: PHP SDK not available ($($_.Exception.Message))"
              if ($i -lt 5) { Start-Sleep -Seconds 30 }
            }
          }
          Write-Host "::warning::PHP SDK deps unavailable, build may fail with 504"

      - name: Resolve release tag
        id: reltag
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="${{ inputs.tag }}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Flatten pdo_fbird sources for Windows build
        shell: pwsh
        run: |
          # The PHP Windows build system (nmake) doesn't create output
          # subdirectories for source files in subdirectories. Copy the
          # pdo_fbird source files to the root so they compile without
          # a subdirectory prefix, avoiding C1083 errors.
          Copy-Item pdo_fbird/pdo_fbird.c -Destination pdo_fbird_root.c -Force
          Copy-Item pdo_fbird/pdo_fbird_driver.c -Destination pdo_fbird_driver.c -Force
          Copy-Item pdo_fbird/pdo_fbird_stmt.c -Destination pdo_fbird_stmt.c -Force
          Copy-Item pdo_fbird/pdo_fbird_error.c -Destination pdo_fbird_error.c -Force
          # jane #636: the pdo TUs include "php_pdo_fbird.h" /
          # "php_pdo_fbird_int.h" - at build root those headers must exist
          # too, now that the HAVE_PDO_FBIRD guard actually opens (guard
          # order fixed); before, the guard compiled every TU empty and the
          # missing includes were silently skipped.
          Copy-Item pdo_fbird/php_pdo_fbird.h -Destination php_pdo_fbird.h -Force
          Copy-Item pdo_fbird/php_pdo_fbird_int.h -Destination php_pdo_fbird_int.h -Force

      - name: Build Extensions
        uses: php/php-windows-builder/extension@c49dae50774b14e0f358d2efa65637b67f1104f6 # v1
        with:
          php-version: ${{ matrix.php-version }}
          arch: ${{ matrix.arch }}
          ts: ${{ matrix.ts }}
          args: --with-firebird=${{ env.FIREBIRD_HOME }} --with-pdo-fbird=${{ env.FIREBIRD_HOME }}
          run-tests: false

      - name: Package firebird DLL
        shell: pwsh
        run: |
          # The php-windows-builder only packages the last extension built
          # (pdo_fbird). We manually package the firebird DLL here.
          $config = '${{ matrix.ts }}' -eq 'ts' ? 'Release_TS' : 'Release'
          $dllDir = Get-ChildItem -Path "build" -Recurse -Directory -Filter $config |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $dllDir) {
            Write-Error "Could not find $config output directory"
            exit 1
          }
          $dllPath = Join-Path $dllDir.FullName "php_firebird.dll"
          if (-not (Test-Path $dllPath)) {
            Write-Error "php_firebird.dll not found at $dllPath"
            exit 1
          }
          $version = Get-Content VERSION.txt -ErrorAction SilentlyContinue
          if (-not $version) { $version = '${{ steps.reltag.outputs.tag }}' -replace '^v', '' }
          $phpVer = '${{ matrix.php-version }}'
          $tsLabel = '${{ matrix.ts }}' -eq 'ts' ? 'ts' : 'nts'
          $vsLabel = if ($phpVer -ge '8.4') { 'vs17' } else { 'vs16' }
          $zipName = "php_firebird-v${version}-${phpVer}-${tsLabel}-${vsLabel}-x86_64.zip"
          New-Item -ItemType Directory -Force -Path "artifacts\firebird" | Out-Null
          Copy-Item $dllPath -Destination "artifacts\firebird\php_firebird.dll"
          Compress-Archive -Path "artifacts\firebird\*" -DestinationPath "artifacts\firebird\$zipName" -Force
          Write-Host "Packaged: $zipName"

      - name: Package pdo_fbird DLL
        shell: pwsh
        run: |
          # jane #636: we package BOTH extension DLLs ourselves. The builder's
          # own zip step creates a dll zip AND a same-named logs zip; both get
          # uploaded as artifacts and collided at release-merge time
          # (last-writer-wins per leg = log-only pdo assets on v13.2.8).
          # publish-bundle-artifacts prunes *.zip-named artifact dirs, so the
          # builder's upload is inert and these two steps are the only source
          # of release zips.
          $config = '${{ matrix.ts }}' -eq 'ts' ? 'Release_TS' : 'Release'
          $dllDir = Get-ChildItem -Path "build" -Recurse -Directory -Filter $config |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $dllDir) {
            Write-Error "Could not find $config output directory"
            exit 1
          }
          $mainDllPath = Join-Path $dllDir.FullName "php_firebird.dll"
          $pdoDllPath = Join-Path $dllDir.FullName "php_pdo_fbird.dll"
          foreach ($p in @($mainDllPath, $pdoDllPath)) {
            if (-not (Test-Path $p)) {
              Write-Error "DLL not found: $p (empty-TU / guard-order regression? #636)"
              exit 1
            }
          }

          # Pre-upload assertion: a PHP extension DLL MUST export get_module.
          # #636: every php_pdo_fbird.dll ever released was an export-less
          # 11776-byte stub; this fails the build BEFORE anything ships.
          node scripts/windows/check-dll-exports.mjs $mainDllPath get_module
          if ($LASTEXITCODE -ne 0) { exit 1 }
          node scripts/windows/check-dll-exports.mjs $pdoDllPath get_module
          if ($LASTEXITCODE -ne 0) { exit 1 }

          $version = Get-Content VERSION.txt -ErrorAction SilentlyContinue
          if (-not $version) { $version = '${{ steps.reltag.outputs.tag }}' -replace '^v', '' }
          $phpVer = '${{ matrix.php-version }}'
          $tsLabel = '${{ matrix.ts }}' -eq 'ts' ? 'ts' : 'nts'
          $vsLabel = if ($phpVer -ge '8.4') { 'vs17' } else { 'vs16' }
          $zipName = "php_pdo_fbird-v${version}-${phpVer}-${tsLabel}-${vsLabel}-x86_64.zip"
          New-Item -ItemType Directory -Force -Path "artifacts\pdo_fbird" | Out-Null
          # Versioned DLL name inside the zip (PIE convention, matches the
          # php-windows-builder naming consumers expect).
          Copy-Item $pdoDllPath -Destination "artifacts\pdo_fbird\php_pdo_fbird-v${version}-${phpVer}-${tsLabel}-${vsLabel}-x86_64.dll"
          Compress-Archive -Path "artifacts\pdo_fbird\*" -DestinationPath "artifacts\pdo_fbird\$zipName" -Force

          # Zip content assertion: exactly one DLL inside.
          $verifyDir = "artifacts\pdo_fbird\_verify"
          Expand-Archive -Path "artifacts\pdo_fbird\$zipName" -DestinationPath $verifyDir -Force
          $dllCount = (Get-ChildItem $verifyDir -Filter "*.dll" | Measure-Object).Count
          Remove-Item $verifyDir -Recurse -Force
          if ($dllCount -ne 1) {
            Write-Error "zip content assertion failed: expected 1 dll, found $dllCount"
            exit 1
          }
          Write-Host "Packaged: $zipName"

      - name: Upload pdo_fbird DLL artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: php_pdo_fbird-v${{ steps.reltag.outputs.version }}-${{ matrix.php-version }}-${{ matrix.ts }}
          path: artifacts/pdo_fbird/*.zip

      - name: Upload firebird DLL artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: php_firebird-v${{ steps.reltag.outputs.version }}-${{ matrix.php-version }}-${{ matrix.ts }}
          path: artifacts/firebird/*.zip

  # ===========================================================================
  # Upload artifacts to GitHub Release
  # Uses official php-windows-builder/release action
  # ===========================================================================
  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
      (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Determine Release Tag
        id: release-tag
        uses: ./.github/actions/determine-release-tag
        with:
          release-tag-input: ${{ inputs.tag }}

      - name: Publish bundle artifacts
        uses: ./.github/actions/publish-bundle-artifacts
        with:
          tag: ${{ steps.release-tag.outputs.tag }}
          expected-count: '8'
          asset-name-filter: 'x86_64\\.zip$'

  # ===========================================================================
  # Pre-publish smoke gate (#652, council verdict 2026-10-25: option A with
  # binding conditions).
  #
  # Runs the shutdown smoke (scripts/windows/shutdown_smoke.php, the #585
  # crash oracle) against the EXACT draft assets of THIS release, BEFORE
  # publish-release.yml flips draft:false. publish-release.yml requires the
  # SMOKE-PASSED.json marker asset this pipeline uploads on success - no
  # marker, no publish (fail closed).
  #
  # Binding conditions implemented here:
  #   2. release resolved by ID + exact asset-name verification (never
  #      tag-name matching alone; list-releases + single-match + isDraft)
  #   3. draft asset download via API octet-stream (browser_download_url
  #      does not serve draft assets)
  #   4. retry = re-run this workflow (rebuilds + re-tests + re-marks);
  #      the only publish override is a manual, audited
  #      `gh release edit --draft=false`, never automated
  #   5. no tag-name exemptions: RCs are gated whenever Windows zips are
  #      attached (RCs DO reach consumers via PIE/zips)
  #   7. strict on BOTH extensions: a broken/unloadable php_pdo_fbird.dll
  #      fails the gate (#636: broken pdo zips shipped before)
  #
  # Deliberately NOT changed: windows-smoke.yml keeps its standalone
  # contents:read dispatch path for published releases (condition 6).
  # ===========================================================================
  pre-publish-smoke:
    name: pre-publish-smoke (php ${{ matrix.php }} nts)
    needs: release
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
      (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    env:
      ISC_USER: SYSDBA
      ISC_PASSWORD: masterkey
      SMOKE_DB: 'localhost:C:\firebird_tests\smoke.fdb'
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      # js: pin the interpreter per matrix leg - the windows-2025 runner
      # images preinstall PHP 8.5, and without this step every non-8.5 leg
      # silently loaded its extensions into PHP 8.5 (module API mismatch,
      # v13.2.12 first pipeline, 2026-10-29). Fail loud on version drift.
      - name: Setup PHP ${{ matrix.php }} (NTS)
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl
          coverage: none
          tools: composer:v2

      - name: Determine tag
        id: reltag
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="${{ inputs.tag }}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Resolve release by ID + verify exact asset names (fail closed)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = '${{ steps.reltag.outputs.tag }}'
          $version = '${{ steps.reltag.outputs.version }}'

          # Condition 2: list releases (drafts visible to contents:write),
          # match tag_name exactly, require EXACTLY ONE match.
          $matched = @()
          foreach ($page in 1..5) {
            $rel = gh api "repos/${{ github.repository }}/releases?per_page=100&page=$page" | ConvertFrom-Json
            if ($rel.Count -eq 0) { break }
            $matched += @($rel | Where-Object { $_.tag_name -eq $tag })
          }
          if ($matched.Count -ne 1) {
            throw "Condition 2 violated: expected exactly 1 release for tag $tag, found $($matched.Count) (name collision / duplicate release?)"
          }
          $release = $matched[0]
          if (-not $release.draft) {
            Write-Host "::warning::release $tag is already published (id $($release.id)) - smoke continues against it (re-run path)"
          }

          # Verify all 8 Windows asset names on THIS release id.
          $phpVer = '${{ matrix.php }}'
          $vs = if ([version]$phpVer -ge [version]'8.4') { 'vs17' } else { 'vs16' }
          $expected = @()
          foreach ($tsLbl in @('nts', 'ts')) {
            $expected += "php_firebird-v$version-$phpVer-$tsLbl-$vs-x86_64.zip"
            $expected += "php_pdo_fbird-v$version-$phpVer-$tsLbl-$vs-x86_64.zip"
          }
          foreach ($name in $expected) {
            $a = $release.assets | Where-Object { $_.name -eq $name }
            if (-not $a) { throw "Asset missing on release $tag (id $($release.id)): $name" }
          }
          "release_id=$($release.id)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Release $tag resolved: id=$($release.id), all $($expected.Count) Windows assets present"

          # Condition 3: download the NTS zips under test via API
          # octet-stream (gh release download uses the API asset URL).
          foreach ($name in @(
            "php_firebird-v$version-$phpVer-nts-$vs-x86_64.zip",
            "php_pdo_fbird-v$version-$phpVer-nts-$vs-x86_64.zip"
          )) {
            gh release download "$tag" --pattern "$name" --clobber --repo "${{ github.repository }}"
            if (-not (Test-Path $name)) { throw "Download failed: $name" }
            Write-Host "Downloaded: $name ($((Get-Item $name).Length) bytes)"
          }

      - name: Install Firebird + create smoke DB
        uses: ./.github/actions/firebird-server

      - name: Install extension DLLs (strict, both must load, #636)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ steps.reltag.outputs.version }}'
          $phpVer = '${{ matrix.php }}'
          $vs = if ($phpVer -ge '8.4') { 'vs17' } else { 'vs16' }

          Expand-Archive -Path "php_firebird-v$version-$phpVer-nts-$vs-x86_64.zip" -DestinationPath "ext_firebird" -Force
          Expand-Archive -Path "php_pdo_fbird-v$version-$phpVer-nts-$vs-x86_64.zip" -DestinationPath "ext_pdo" -Force

          $mainDll = Get-ChildItem -Path "ext_firebird" -Filter "php_firebird*.dll" -Recurse | Select-Object -First 1
          $pdoDll  = Get-ChildItem -Path "ext_pdo" -Filter "php_pdo_fbird*.dll" -Recurse | Select-Object -First 1
          if (-not $mainDll) { throw "php_firebird dll not found in zip" }
          if (-not $pdoDll) { throw "php_pdo_fbird dll not found in zip - the release gate is STRICT on pdo (#636)" }

          $phpDir = Split-Path -Parent (Get-Command php).Source
          # js: fail loud on interpreter drift - never load release assets
          # into a PHP other than the matrix leg's version (#683 class).
          $phpOnPath = (php -r "echo PHP_VERSION;")
          if (-not $phpOnPath.StartsWith("$phpVer.")) {
            throw "interpreter drift: PATH php is $phpOnPath, expected $phpVer.x - provisioning failed, refusing to smoke wrong-version (issue 672 class: no silent fallback)"
          }
          Write-Host "interpreter: $phpOnPath (matches matrix $phpVer)"
          Copy-Item $mainDll.FullName -Destination "$phpDir\ext\php_firebird.dll" -Force
          Copy-Item $pdoDll.FullName -Destination "$phpDir\ext\php_pdo_fbird.dll" -Force

          $phpIni = php -r "echo php_ini_loaded_file();"
          if (-not $phpIni) { $phpIni = "$phpDir\php.ini" }
          if (-not (Test-Path $phpIni)) { Copy-Item "$phpDir\php.ini-development" $phpIni }
          Add-Content -Path $phpIni -Value "`nextension=firebird"

          $fbDir = (Get-ChildItem "C:\Program Files\Firebird\Firebird_*" | Select-Object -First 1).FullName
          Copy-Item "$fbDir\fbclient.dll" -Destination $phpDir -Force
          Copy-Item "$fbDir\fbclient.dll" -Destination "$phpDir\gds32.dll" -Force

          php -r "if (!extension_loaded('firebird')) { exit(1); }"
          if ($LASTEXITCODE -ne 0) { throw "php_firebird failed to load" }

          php -d extension=pdo_fbird -r "exit(extension_loaded('pdo_fbird') ? 0 : 1);"
          if ($LASTEXITCODE -ne 0) { throw "php_pdo_fbird present but UNLOADABLE - release gate blocks (#636 crash class)" }
          Write-Host "extensions loaded: firebird, pdo_fbird"

      - name: Run shutdown smoke (exit code IS the test)
        shell: pwsh
        run: |
          Write-Host "=== gate smoke run: PHP $((php -r 'echo PHP_VERSION;')) ==="
          php scripts/windows/shutdown_smoke.php
          $code = $LASTEXITCODE
          Write-Host "smoke-exit=$code"

          if ($code -ne 0) {
            Write-Host "=== CRASH/FAIL DIAGNOSTICS (Windows Application Error) ==="
            try {
              Get-WinEvent -FilterHashtable @{LogName='Application'; ProviderName='Application Error'} -MaxEvents 10 -ErrorAction Stop |
                Where-Object { $_.message -match 'php' } |
                Select-Object -First 3 |
                ForEach-Object { Write-Host $_.message }
            } catch {
              Write-Host "no Application Error events captured: $_"
            }
            if ($code -eq -1073741819) {
              Write-Host "::error::#585 crash class reproduced on RELEASE ASSETS: 0xC0000005 at shutdown (PHP ${{ matrix.php }} NTS) - publish BLOCKED"
            }
            exit 1
          }
          Write-Host "GATE SMOKE PASS: clean shutdown on release assets (PHP ${{ matrix.php }} NTS)"

  # ===========================================================================
  # Upload the SMOKE-PASSED.json marker ONLY after every leg passed.
  # publish-release.yml requires this marker (and cross-checks its
  # release_id + asset checksums) before flipping draft:false. Fail closed:
  # no marker, no publish.
  # ===========================================================================
  smoke-marker:
    name: upload smoke marker
    needs: [release, pre-publish-smoke]
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
      (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Resolve release + checksum assets + upload marker
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="${{ inputs.tag }}"
          fi

          # Condition 2 again at marker time: exactly one release, capture id.
          RELEASE_ID=$(gh api "repos/${{ github.repository }}/releases?per_page=100" \
            --jq "[.[] | select(.tag_name == \"$TAG\")] | if length != 1 then error(\"expected exactly 1 release for $TAG\") else .[0].id end")

          mkdir -p dl && cd dl
          # js #688 P2: patterns verified against real v13.2.12 asset names
          # (they carry a -vsNN- segment the old pre-vs patterns never
          # matched - latent since #652, first exercised today).
          for ts in nts ts; do
            gh release download "$TAG" --pattern "php_firebird-*-${ts}-*-x86_64.zip" --clobber --repo "${{ github.repository }}"
            gh release download "$TAG" --pattern "php_pdo_fbird-*-${ts}-*-x86_64.zip" --clobber --repo "${{ github.repository }}"
          done
          COUNT_FB=$(ls -- php_firebird-*.zip 2>/dev/null | wc -l)
          COUNT_PDO=$(ls -- php_pdo_fbird-*.zip 2>/dev/null | wc -l)
          # js: per-family counts - 4 php versions x 2 ts each; the old
          # aggregate `== 8` was a pre-#636 expectation from when pdo zips
          # were absent, and fail-closed on the first release that ships
          # pdo (v13.2.12, 2026-10-29).
          [ "$COUNT_FB" -eq 8 ] || { echo "ERROR: expected 8 php_firebird zips, found $COUNT_FB"; exit 1; }
          [ "$COUNT_PDO" -eq 8 ] || { echo "ERROR: expected 8 php_pdo_fbird zips, found $COUNT_PDO"; exit 1; }
          sha256sum -- *.zip > ../SHA256SUMS

          jq -n \
            --arg release_id "$RELEASE_ID" \
            --arg tag "$TAG" \
            --arg run_id "${{ github.run_id }}" \
            --arg commit "${{ github.sha }}" \
            --rawfile sums ../SHA256SUMS \
            '{release_id: $release_id, tag: $tag, run_id: $run_id, commit: $commit, assets_sha256: $sums}' \
            > SMOKE-PASSED.json

          gh release upload "$TAG" SMOKE-PASSED.json --clobber --repo "${{ github.repository }}"
          echo "Marker uploaded: SMOKE-PASSED.json (release_id=$RELEASE_ID, run=${{ github.run_id }})"

