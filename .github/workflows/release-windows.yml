# =============================================================================
# PHP Firebird Extension - Windows DLL Build
# =============================================================================
# Builds Windows DLLs using official php/php-windows-builder actions.
#
# Triggers:
#   - Tag push (v[0-9]*.*) - immutable releases
#   - Release created/published - non-immutable releases
#   - Pull requests (build only, no release)
#   - Manual dispatch (testing)
#
# Best practices from: https://github.com/php/php-windows-builder
# =============================================================================

name: Release (Windows)

on:
  push:
    tags:
      - 'v[0-9]*.*'
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build for (optional)'
        required: false

permissions:
  contents: write

env:
  FIREBIRD_SDK_CACHE_KEY: firebird-sdk-v2

jobs:
  # ===========================================================================
  # Generate build matrix using php-windows-builder/extension-matrix
  # Reads PHP constraints from composer.json
  # ===========================================================================
  get-extension-matrix:
    # CI gate removed — relies on pre-tag verification (scripts/verify-ci-green.sh)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.extension-matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Ensure VERSION.txt
        uses: ./.github/actions/version

      - name: Get the extension matrix
        id: extension-matrix
        uses: php/php-windows-builder/extension-matrix@c49dae50774b14e0f358d2efa65637b67f1104f6 # v1
        with:
          php-version-list: '8.2, 8.3, 8.4, 8.5'
          arch-list: 'x64'
          ts-list: 'nts, ts'

  # ===========================================================================
  # Build Windows DLLs
  # ===========================================================================
  build:
    needs: get-extension-matrix
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.get-extension-matrix.outputs.matrix) }}
    env:
      FIREBIRD_VERSION: '5.0'

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Ensure VERSION.txt
        uses: ./.github/actions/version

      - name: Cache Firebird SDK
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        id: cache-fb-sdk
        with:
          path: C:\firebird-sdk
          key: ${{ env.FIREBIRD_SDK_CACHE_KEY }}-${{ env.FIREBIRD_VERSION }}-${{ matrix.arch }}

      - name: Download Firebird SDK
        if: steps.cache-fb-sdk.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          .\.github\scripts\download-firebird-sdk.ps1 `
            -Version "${{ env.FIREBIRD_VERSION }}" `
            -Architecture "${{ matrix.arch }}" `
            -DestinationPath "C:\firebird-sdk"

      - name: Set Firebird Environment
        shell: pwsh
        run: |
          $sdkPath = "C:\firebird-sdk"
          echo "FIREBIRD_HOME=$sdkPath" >> $env:GITHUB_ENV
          echo "$sdkPath\bin" >> $env:GITHUB_PATH

      - name: Resolve release tag
        id: reltag
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="${{ inputs.tag }}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Flatten pdo_fbird sources for Windows build
        shell: pwsh
        run: |
          # The PHP Windows build system (nmake) doesn't create output
          # subdirectories for source files in subdirectories. Copy the
          # pdo_fbird source files to the root so they compile without
          # a subdirectory prefix, avoiding C1083 errors.
          Copy-Item pdo_fbird/pdo_fbird.c -Destination pdo_fbird_root.c -Force
          Copy-Item pdo_fbird/pdo_fbird_driver.c -Destination pdo_fbird_driver.c -Force
          Copy-Item pdo_fbird/pdo_fbird_stmt.c -Destination pdo_fbird_stmt.c -Force
          Copy-Item pdo_fbird/pdo_fbird_error.c -Destination pdo_fbird_error.c -Force

      - name: Build Extensions
        uses: php/php-windows-builder/extension@c49dae50774b14e0f358d2efa65637b67f1104f6 # v1
        with:
          php-version: ${{ matrix.php-version }}
          arch: ${{ matrix.arch }}
          ts: ${{ matrix.ts }}
          args: --with-firebird=${{ env.FIREBIRD_HOME }} --with-pdo-fbird=${{ env.FIREBIRD_HOME }}
          run-tests: false

      - name: Package firebird DLL
        shell: pwsh
        run: |
          # The php-windows-builder only packages the last extension built
          # (pdo_fbird). We manually package the firebird DLL here.
          $config = '${{ matrix.ts }}' -eq 'ts' ? 'Release_TS' : 'Release'
          $dllDir = Get-ChildItem -Path "build" -Recurse -Directory -Filter $config |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $dllDir) {
            Write-Error "Could not find $config output directory"
            exit 1
          }
          $dllPath = Join-Path $dllDir.FullName "php_firebird.dll"
          if (-not (Test-Path $dllPath)) {
            Write-Error "php_firebird.dll not found at $dllPath"
            exit 1
          }
          $version = Get-Content VERSION.txt -ErrorAction SilentlyContinue
          if (-not $version) { $version = '${{ steps.reltag.outputs.tag }}' -replace '^v', '' }
          $phpVer = '${{ matrix.php-version }}'
          $tsLabel = '${{ matrix.ts }}' -eq 'ts' ? 'ts' : 'nts'
          $vsLabel = if ($phpVer -ge '8.4') { 'vs17' } else { 'vs16' }
          $zipName = "php_firebird-v${version}-${phpVer}-${tsLabel}-${vsLabel}-x86_64.zip"
          New-Item -ItemType Directory -Force -Path "artifacts\firebird" | Out-Null
          Copy-Item $dllPath -Destination "artifacts\firebird\php_firebird.dll"
          Compress-Archive -Path "artifacts\firebird\*" -DestinationPath "artifacts\firebird\$zipName" -Force
          Write-Host "Packaged: $zipName"

      - name: Upload firebird DLL artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: php_firebird-v${{ steps.reltag.outputs.version }}-${{ matrix.php-version }}-${{ matrix.ts }}
          path: artifacts/firebird/*.zip

  # ===========================================================================
  # Upload artifacts to GitHub Release
  # Uses official php-windows-builder/release action
  # ===========================================================================
  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
      (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Determine Release Tag
        id: release-tag
        uses: ./.github/actions/determine-release-tag
        with:
          release-tag-input: ${{ inputs.tag }}

      - name: Publish bundle artifacts
        uses: ./.github/actions/publish-bundle-artifacts
        with:
          tag: ${{ steps.release-tag.outputs.tag }}
          expected-count: '8'
          asset-name-filter: 'x86_64\\.zip$'

