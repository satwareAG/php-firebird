# =============================================================================
# PHP Firebird Extension - Windows DLL Build
# =============================================================================
# Builds Windows DLLs using official php/php-windows-builder actions.
#
# Triggers:
#   - Tag push (v[0-9]*.*) - immutable releases
#   - Release created/published - non-immutable releases
#   - Pull requests (build only, no release)
#   - Manual dispatch (testing)
#
# Best practices from: https://github.com/php/php-windows-builder
# =============================================================================

name: Release (Windows)

on:
  push:
    tags:
      - 'v[0-9]*.*'
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build for (optional)'
        required: false

permissions:
  read-all

env:
  FIREBIRD_SDK_CACHE_KEY: firebird-sdk-v2

jobs:
  # ===========================================================================
  # Generate build matrix using php-windows-builder/extension-matrix
  # Reads PHP constraints from composer.json
  # ===========================================================================
  get-extension-matrix:
    # CI gate removed — relies on pre-tag verification (scripts/verify-ci-green.sh)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.extension-matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Ensure VERSION.txt
        uses: ./.github/actions/version

      - name: Get the extension matrix
        id: extension-matrix
        uses: php/php-windows-builder/extension-matrix@c49dae50774b14e0f358d2efa65637b67f1104f6 # v1
        with:
          php-version-list: '8.2, 8.3, 8.4, 8.5'
          arch-list: 'x64'
          ts-list: 'nts, ts'

  # ===========================================================================
  # Build Windows DLLs
  # ===========================================================================
  build:
    needs: get-extension-matrix
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.get-extension-matrix.outputs.matrix) }}
    env:
      FIREBIRD_VERSION: '5.0'

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Ensure VERSION.txt
        uses: ./.github/actions/version

      - name: Cache Firebird SDK
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        id: cache-fb-sdk
        with:
          path: C:\firebird-sdk
          key: ${{ env.FIREBIRD_SDK_CACHE_KEY }}-${{ env.FIREBIRD_VERSION }}-${{ matrix.arch }}

      - name: Download Firebird SDK
        if: steps.cache-fb-sdk.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          .\.github\scripts\download-firebird-sdk.ps1 `
            -Version "${{ env.FIREBIRD_VERSION }}" `
            -Architecture "${{ matrix.arch }}" `
            -DestinationPath "C:\firebird-sdk"

      - name: Set Firebird Environment
        shell: pwsh
        run: |
          $sdkPath = "C:\firebird-sdk"
          echo "FIREBIRD_HOME=$sdkPath" >> $env:GITHUB_ENV
          echo "$sdkPath\bin" >> $env:GITHUB_PATH

      - name: Check PHP SDK availability
        shell: pwsh
        run: |
          # Check if downloads.php.net is reachable before attempting the build.
          # jane: php-windows-builder downloads PHP SDK deps from downloads.php.net
          # which intermittently returns 504 Gateway Timeout. This check gives early
          # visibility and a retry window before the build step fails.
          $vs = if ('${{ matrix.php-version }}' -ge '8.4') { 'vs17' } else { 'vs16' }
          $url = "https://downloads.php.net/~windows/php-sdk/deps/$vs/x64/"
          for ($i = 1; $i -le 5; $i++) {
            try {
              $resp = Invoke-WebRequest -Uri $url -Method Head -TimeoutSec 10
              Write-Host "PHP SDK available (HTTP $($resp.StatusCode))"
              exit 0
            } catch {
              Write-Host "Attempt $i/5: PHP SDK not available ($($_.Exception.Message))"
              if ($i -lt 5) { Start-Sleep -Seconds 30 }
            }
          }
          Write-Host "::warning::PHP SDK deps unavailable, build may fail with 504"

      - name: Resolve release tag
        id: reltag
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="${{ inputs.tag }}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Flatten pdo_fbird sources for Windows build
        shell: pwsh
        run: |
          # The PHP Windows build system (nmake) doesn't create output
          # subdirectories for source files in subdirectories. Copy the
          # pdo_fbird source files to the root so they compile without
          # a subdirectory prefix, avoiding C1083 errors.
          Copy-Item pdo_fbird/pdo_fbird.c -Destination pdo_fbird_root.c -Force
          Copy-Item pdo_fbird/pdo_fbird_driver.c -Destination pdo_fbird_driver.c -Force
          Copy-Item pdo_fbird/pdo_fbird_stmt.c -Destination pdo_fbird_stmt.c -Force
          Copy-Item pdo_fbird/pdo_fbird_error.c -Destination pdo_fbird_error.c -Force
          # jane #636: the pdo TUs include "php_pdo_fbird.h" /
          # "php_pdo_fbird_int.h" - at build root those headers must exist
          # too, now that the HAVE_PDO_FBIRD guard actually opens (guard
          # order fixed); before, the guard compiled every TU empty and the
          # missing includes were silently skipped.
          Copy-Item pdo_fbird/php_pdo_fbird.h -Destination php_pdo_fbird.h -Force
          Copy-Item pdo_fbird/php_pdo_fbird_int.h -Destination php_pdo_fbird_int.h -Force

      - name: Build Extensions
        uses: php/php-windows-builder/extension@c49dae50774b14e0f358d2efa65637b67f1104f6 # v1
        with:
          php-version: ${{ matrix.php-version }}
          arch: ${{ matrix.arch }}
          ts: ${{ matrix.ts }}
          args: --with-firebird=${{ env.FIREBIRD_HOME }} --with-pdo-fbird=${{ env.FIREBIRD_HOME }}
          run-tests: false

      - name: Package firebird DLL
        shell: pwsh
        run: |
          # The php-windows-builder only packages the last extension built
          # (pdo_fbird). We manually package the firebird DLL here.
          $config = '${{ matrix.ts }}' -eq 'ts' ? 'Release_TS' : 'Release'
          $dllDir = Get-ChildItem -Path "build" -Recurse -Directory -Filter $config |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $dllDir) {
            Write-Error "Could not find $config output directory"
            exit 1
          }
          $dllPath = Join-Path $dllDir.FullName "php_firebird.dll"
          if (-not (Test-Path $dllPath)) {
            Write-Error "php_firebird.dll not found at $dllPath"
            exit 1
          }
          $version = Get-Content VERSION.txt -ErrorAction SilentlyContinue
          if (-not $version) { $version = '${{ steps.reltag.outputs.tag }}' -replace '^v', '' }
          $phpVer = '${{ matrix.php-version }}'
          $tsLabel = '${{ matrix.ts }}' -eq 'ts' ? 'ts' : 'nts'
          $vsLabel = if ($phpVer -ge '8.4') { 'vs17' } else { 'vs16' }
          $zipName = "php_firebird-v${version}-${phpVer}-${tsLabel}-${vsLabel}-x86_64.zip"
          New-Item -ItemType Directory -Force -Path "artifacts\firebird" | Out-Null
          Copy-Item $dllPath -Destination "artifacts\firebird\php_firebird.dll"
          Compress-Archive -Path "artifacts\firebird\*" -DestinationPath "artifacts\firebird\$zipName" -Force
          Write-Host "Packaged: $zipName"

      - name: Package pdo_fbird DLL
        shell: pwsh
        run: |
          # jane #636: we package BOTH extension DLLs ourselves. The builder's
          # own zip step creates a dll zip AND a same-named logs zip; both get
          # uploaded as artifacts and collided at release-merge time
          # (last-writer-wins per leg = log-only pdo assets on v13.2.8).
          # publish-bundle-artifacts prunes *.zip-named artifact dirs, so the
          # builder's upload is inert and these two steps are the only source
          # of release zips.
          $config = '${{ matrix.ts }}' -eq 'ts' ? 'Release_TS' : 'Release'
          $dllDir = Get-ChildItem -Path "build" -Recurse -Directory -Filter $config |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $dllDir) {
            Write-Error "Could not find $config output directory"
            exit 1
          }
          $mainDllPath = Join-Path $dllDir.FullName "php_firebird.dll"
          $pdoDllPath = Join-Path $dllDir.FullName "php_pdo_fbird.dll"
          foreach ($p in @($mainDllPath, $pdoDllPath)) {
            if (-not (Test-Path $p)) {
              Write-Error "DLL not found: $p (empty-TU / guard-order regression? #636)"
              exit 1
            }
          }

          # Pre-upload assertion: a PHP extension DLL MUST export get_module.
          # #636: every php_pdo_fbird.dll ever released was an export-less
          # 11776-byte stub; this fails the build BEFORE anything ships.
          node scripts/windows/check-dll-exports.mjs $mainDllPath get_module
          if ($LASTEXITCODE -ne 0) { exit 1 }
          node scripts/windows/check-dll-exports.mjs $pdoDllPath get_module
          if ($LASTEXITCODE -ne 0) { exit 1 }

          $version = Get-Content VERSION.txt -ErrorAction SilentlyContinue
          if (-not $version) { $version = '${{ steps.reltag.outputs.tag }}' -replace '^v', '' }
          $phpVer = '${{ matrix.php-version }}'
          $tsLabel = '${{ matrix.ts }}' -eq 'ts' ? 'ts' : 'nts'
          $vsLabel = if ($phpVer -ge '8.4') { 'vs17' } else { 'vs16' }
          $zipName = "php_pdo_fbird-v${version}-${phpVer}-${tsLabel}-${vsLabel}-x86_64.zip"
          New-Item -ItemType Directory -Force -Path "artifacts\pdo_fbird" | Out-Null
          # Versioned DLL name inside the zip (PIE convention, matches the
          # php-windows-builder naming consumers expect).
          Copy-Item $pdoDllPath -Destination "artifacts\pdo_fbird\php_pdo_fbird-v${version}-${phpVer}-${tsLabel}-${vsLabel}-x86_64.dll"
          Compress-Archive -Path "artifacts\pdo_fbird\*" -DestinationPath "artifacts\pdo_fbird\$zipName" -Force

          # Zip content assertion: exactly one DLL inside.
          $verifyDir = "artifacts\pdo_fbird\_verify"
          Expand-Archive -Path "artifacts\pdo_fbird\$zipName" -DestinationPath $verifyDir -Force
          $dllCount = (Get-ChildItem $verifyDir -Filter "*.dll" | Measure-Object).Count
          Remove-Item $verifyDir -Recurse -Force
          if ($dllCount -ne 1) {
            Write-Error "zip content assertion failed: expected 1 dll, found $dllCount"
            exit 1
          }
          Write-Host "Packaged: $zipName"

      - name: Upload pdo_fbird DLL artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: php_pdo_fbird-v${{ steps.reltag.outputs.version }}-${{ matrix.php-version }}-${{ matrix.ts }}
          path: artifacts/pdo_fbird/*.zip

      - name: Upload firebird DLL artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: php_firebird-v${{ steps.reltag.outputs.version }}-${{ matrix.php-version }}-${{ matrix.ts }}
          path: artifacts/firebird/*.zip

      - name: Emit sha256 digest manifest (FR-003 #688-P1)
        shell: pwsh
        run: |
          # FR-003: record the digests of every built zip so the smoke and
          # publish jobs can join on exact content, not names.
          $files = Get-ChildItem -Path artifacts -Recurse -Filter *.zip
          $lines = $files | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLower()
            "{0}  {1}" -f $hash, $_.Name
          }
          $lines | Set-Content -Path artifacts/SHA256SUMS -Encoding Ascii
          Write-Host "digest manifest written ($($files.Count) entries)"

      - name: Upload sha256 digest manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: SHA256SUMS-${{ matrix.php-version }}-${{ matrix.ts }}
          path: artifacts/SHA256SUMS

  # ===========================================================================
  # Upload artifacts to GitHub Release
  # Uses official php-windows-builder/release action
  # ===========================================================================
  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
      (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Determine Release Tag
        id: release-tag
        uses: ./.github/actions/determine-release-tag
        with:
          release-tag-input: ${{ inputs.tag }}

      - name: Publish bundle artifacts
        uses: ./.github/actions/publish-bundle-artifacts
        with:
          tag: ${{ steps.release-tag.outputs.tag }}
          expected-count: '8'
          asset-name-filter: 'x86_64\\.zip$'

  # ===========================================================================
  # Identity-guard negative controls (FR-004, #688-P1): every PR touching the
  # Windows smoke proves the guard can fail (wrong interpreter / missing
  # identity / unparseable) using a mock php shim - no release needed.
  # ===========================================================================
  identity-guard-controls:
    name: identity guard controls (FR-004 #688-P1)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Write mock php shim (echoes MOCK_IDENTITY)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path mock | Out-Null
          @'
          @echo off
          if defined MOCK_IDENTITY (echo %MOCK_IDENTITY%) else (echo php=99999 api=0 ext=0.0.0)
          '@ | Set-Content -Path mock\php.cmd -Encoding Ascii
          New-Item -ItemType File -Force -Path mock\fake.dll | Out-Null

      # Expected-FAILURE cases: continue-on-error + step id so the outcome
      # assertion in the final step can prove the guard actually fired
      # (a silent pass would mean the guard cannot fail - the exact defect
      # this job exists to prevent).
      - name: Case B - wrong interpreter fails
        id: caseB
        continue-on-error: true
        shell: pwsh
        run: |
          $env:MOCK_IDENTITY = 'php=80399 api=20240924 ext=13.2.12'
          pwsh -File ./scripts/windows/identity_guard.ps1 -PhpExe mock\php.cmd -ExtensionPath mock\fake.dll -ExpectedPhpVersion '8.4' -ExpectedApiNo 20240924
          exit 0

      - name: Case C - wrong Zend API fails
        id: caseC
        continue-on-error: true
        shell: pwsh
        run: |
          $env:MOCK_IDENTITY = 'php=80426 api=20230901 ext=13.2.12'
          pwsh -File ./scripts/windows/identity_guard.ps1 -PhpExe mock\php.cmd -ExtensionPath mock\fake.dll -ExpectedPhpVersion '8.4' -ExpectedApiNo 20240924
          exit 0

      - name: Case D - unparseable identity fails closed
        id: caseD
        continue-on-error: true
        shell: pwsh
        run: |
          $env:MOCK_IDENTITY = 'lorem-ipsum-not-an-identity'
          pwsh -File ./scripts/windows/identity_guard.ps1 -PhpExe mock\php.cmd -ExtensionPath mock\fake.dll -ExpectedPhpVersion '8.4' -ExpectedApiNo 20240924
          exit 0

      - name: Case E - FR-003 digest verify fails on a mutated asset
        id: caseE
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path mock/digests | Out-Null
          'hello-FR003' | Set-Content mock/digests/php_firebird-test.zip -Encoding Ascii
          $hash = (Get-FileHash -Algorithm SHA256 mock/digests/php_firebird-test.zip).Hash.ToLower()
          "$hash  php_firebird-test.zip" | Set-Content mock/digests/SHA256SUMS -Encoding Ascii
          pwsh -File ./scripts/windows/verify_asset_digests.ps1 -ManifestPath mock/digests/SHA256SUMS -AssetsDir mock/digests -AssetNames @('php_firebird-test.zip')

      - name: Case F - FR-003 digest verify passes on the pristine manifest
        id: caseF
        shell: pwsh
        run: |
          # positive control: the PRISTINE content verifies against the
          # pinned hash (proves the oracle isn't failing on everything).
          'hello-FR003' | Set-Content mock/digests/php_firebird-test.zip -Encoding Ascii
          pwsh -File ./scripts/windows/verify_asset_digests.ps1 -ManifestPath mock/digests/SHA256SUMS -AssetsDir mock/digests -AssetNames @('php_firebird-test.zip')
          if ($LASTEXITCODE -ne 0) { throw "case F: digest verify FAILED on the pristine content (rc $LASTEXITCODE) - oracle broken" }
          Write-Host "case F observed: rc=0, pristine verified"

      - name: Assert all control outcomes (FR-004 #688-P1)
        shell: pwsh
        env:
          OUT_B: ${{ steps.caseB.outcome }}
          OUT_C: ${{ steps.caseC.outcome }}
          OUT_D: ${{ steps.caseD.outcome }}
          OUT_E: ${{ steps.caseE.outcome }}
          OUT_F: ${{ steps.caseF.outcome }}
        run: |
          # All five control cases exit 0 after their assertions, so STEP
          # outcome 'success' = the control FIRED correctly (B-E rejected the
          # seeded defects; F verified the pristine manifest). outcome !=
          # success = the control was skipped, crashed, or failed to detect -
          # the exact defect this job exists to prevent.
          $failures = @()
          foreach ($pair in @(
            @('caseB (wrong interpreter)', $env:OUT_B),
            @('caseC (wrong Zend API)', $env:OUT_C),
            @('caseD (unparseable identity)', $env:OUT_D),
            @('caseE (mutated asset digest)', $env:OUT_E)
          )) {
            $name = $pair[0]; $outcome = $pair[1]
            Write-Host "$name outcome=$outcome"
            if ($outcome -ne 'success') { $failures += "$name outcome=$outcome (expected success - the control did not fire)" }
          }
          $outF = '${{ steps.caseF.outcome }}'
          if ($outF -ne 'success') { $failures += "caseF (pristine manifest) outcome=$outF (expected success)" }
          if ($failures.Count -gt 0) {
            Write-Host "::error::FR-004 controls FAILED: $($failures -join '; ')"
            exit 1
          }
          Write-Host "FR-004 controls: all negative cases fired as expected"
          exit 0

  asset-manifest-controls:
    name: asset manifest controls (P2 #688)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Build fixtures (16-name exact set + variants)
        shell: pwsh
        run: |
          # Derive the exact expected set the same way the smoke does, then
          # write fixture variants.
          $mf = Get-Content ./scripts/windows/release-asset-manifest.json -Raw | ConvertFrom-Json
          $version = '13.3.0'
          $names = @()
          foreach ($family in $mf.families) {
            foreach ($php in $family.php) {
              $vs = $mf.vs_by_php.$php
              foreach ($ts in $family.ts) {
                $names += ($family.pattern -replace '\{version\}', $version -replace '\{php\}', $php -replace '\{ts\}', $ts -replace '\{vs\}', $vs)
              }
            }
          }
          if ($names.Count -ne 16) { throw "fixture expansion: expected 16, got $($names.Count)" }
          New-Item -ItemType Directory -Force -Path fixtures | Out-Null
          $names | Set-Content fixtures/exact.txt -Encoding Ascii
          # missing: drop the last name (php_pdo_fbird 8.5 ts)
          $names[0..($names.Count - 2)] | Set-Content fixtures/missing.txt -Encoding Ascii
          # extra: exact + one unknown windows-family asset
          ($names + 'php_firebird-v13.3.0-9.0-nts-vs17-x86_64.zip') | Set-Content fixtures/extra.txt -Encoding Ascii
          Write-Host "fixtures written: exact=$($names.Count) names"

      - name: Case A - exact 16-name set passes
        shell: pwsh
        run: |
          pwsh -File ./scripts/windows/assert-asset-manifest.ps1 -ManifestPath ./scripts/windows/release-asset-manifest.json -Version 13.3.0 -ActualNamesFile fixtures/exact.txt
          if ($LASTEXITCODE -ne 0) { throw "case A: exact set FAILED (rc $LASTEXITCODE)" }

      - name: Case B - missing family member fails
        shell: pwsh
        run: |
          $out = pwsh -File ./scripts/windows/assert-asset-manifest.ps1 -ManifestPath ./scripts/windows/release-asset-manifest.json -Version 13.3.0 -ActualNamesFile fixtures/missing.txt 2> fixtures/caseB.err
          if ($LASTEXITCODE -ne 1) { throw "case B: missing-name set PASSED (rc $LASTEXITCODE) - oracle cannot fail" }
          Write-Host "case B observed: rc=1 as expected (oracle fired)"

      - name: Case C - extra windows-family asset fails
        shell: pwsh
        run: |
          $names = Get-Content fixtures/exact.txt
          $names += 'php_firebird-v13.3.0-9.0-nts-vs17-x86_64.zip'
          $names | Set-Content fixtures/extra2.txt -Encoding Ascii
          $out = pwsh -File ./scripts/windows/assert-asset-manifest.ps1 -ManifestPath ./scripts/windows/release-asset-manifest.json -Version 13.3.0 -ActualNamesFile fixtures/extra2.txt 2> fixtures/caseC.err
          if ($LASTEXITCODE -ne 1) { throw "case C: extra-asset set PASSED (rc $LASTEXITCODE) - oracle cannot fail" }
          Write-Host "case C observed: rc=1 as expected (oracle fired)"

      - name: Case D - duplicate actual name fails
        shell: pwsh
        run: |
          $names = Get-Content fixtures/exact.txt
          ($names + $names[0]) | Set-Content fixtures/dup.txt -Encoding Ascii
          $out = pwsh -File ./scripts/windows/assert-asset-manifest.ps1 -ManifestPath ./scripts/windows/release-asset-manifest.json -Version 13.3.0 -ActualNamesFile fixtures/dup.txt 2> fixtures/caseD.err
          if ($LASTEXITCODE -ne 1) { throw "case D: duplicate name PASSED (rc $LASTEXITCODE)" }
          Write-Host "case D observed: rc=1 as expected (oracle fired)"

      - name: Case E - version mismatch fails (assets from a different version)
        shell: pwsh
        run: |
          $names = Get-Content fixtures/exact.txt
          ($names -replace '13\.3\.0', '13.2.12') | Set-Content fixtures/wrongver.txt -Encoding Ascii
          $out = pwsh -File ./scripts/windows/assert-asset-manifest.ps1 -ManifestPath ./scripts/windows/release-asset-manifest.json -Version 13.3.0 -ActualNamesFile fixtures/wrongver.txt 2> fixtures/caseE.err
          if ($LASTEXITCODE -ne 1) { throw "case E: wrong-version set PASSED (rc $LASTEXITCODE)" }
          Write-Host "case E observed: rc=1 as expected (oracle fired)"

  # ===========================================================================
  # Pre-publish smoke gate (#652, council verdict 2026-10-25: option A with
  # binding conditions).
  #
  # Runs the shutdown smoke (scripts/windows/shutdown_smoke.php, the #585
  # crash oracle) against the EXACT draft assets of THIS release, BEFORE
  # publish-release.yml flips draft:false. publish-release.yml requires the
  # SMOKE-PASSED.json marker asset this pipeline uploads on success - no
  # marker, no publish (fail closed).
  #
  # Binding conditions implemented here:
  #   2. release resolved by ID + exact asset-name verification (never
  #      tag-name matching alone; list-releases + single-match + isDraft)
  #   3. draft asset download via API octet-stream (browser_download_url
  #      does not serve draft assets)
  #   4. retry = re-run this workflow (rebuilds + re-tests + re-marks);
  #      the only publish override is a manual, audited
  #      `gh release edit --draft=false`, never automated
  #   5. no tag-name exemptions: RCs are gated whenever Windows zips are
  #      attached (RCs DO reach consumers via PIE/zips)
  #   7. strict on BOTH extensions: a broken/unloadable php_pdo_fbird.dll
  #      fails the gate (#636: broken pdo zips shipped before)
  #
  # Deliberately NOT changed: windows-smoke.yml keeps its standalone
  # contents:read dispatch path for published releases (condition 6).
  # ===========================================================================

  # ===========================================================================
  # Pre-publish smoke gate (#652, council verdict 2026-10-25: option A with
  # binding conditions).
  #
  # Runs the shutdown smoke (scripts/windows/shutdown_smoke.php, the #585
  # crash oracle) against the EXACT draft assets of THIS release, BEFORE
  # publish-release.yml flips draft:false. publish-release.yml requires the
  # SMOKE-PASSED.json marker asset this pipeline uploads on success - no
  # marker, no publish (fail closed).
  #
  # Binding conditions implemented here:
  #   2. release resolved by ID + exact asset-name verification (never
  #      tag-name matching alone; list-releases + single-match + isDraft)
  #   3. draft asset download via API octet-stream (browser_download_url
  #      does not serve draft assets)
  #   4. retry = re-run this workflow (rebuilds + re-tests + re-marks);
  #      the only publish override is a manual, audited
  #      `gh release edit --draft=false`, never automated
  #   5. no tag-name exemptions: RCs are gated whenever Windows zips are
  #      attached (RCs DO reach consumers via PIE/zips)
  #   7. strict on BOTH extensions: a broken/unloadable php_pdo_fbird.dll
  #      fails the gate (#636: broken pdo zips shipped before)
  #
  # Deliberately NOT changed: windows-smoke.yml keeps its standalone
  # contents:read dispatch path for published releases (condition 6).
  # ===========================================================================
  pre-publish-smoke:
    name: pre-publish-smoke (php ${{ matrix.php }} nts)
    needs: release
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
      (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      # QH-1c/#697: scoped from the former workflow-level write - this job
      # uploads the SMOKE-PASSED.json marker asset (gh release upload) after
      # every leg passes. Everything else it does (release list/download) is
      # read-only. #697-tranche 2026-10-29.
      contents: write
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    env:
      ISC_USER: SYSDBA
      ISC_PASSWORD: masterkey
      SMOKE_DB: 'localhost:C:\firebird_tests\smoke.fdb'
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      # js: pin the interpreter per matrix leg - the windows-2025 runner
      # images preinstall PHP 8.5, and without this step every non-8.5 leg
      # silently loaded its extensions into PHP 8.5 (module API mismatch,
      # v13.2.12 first pipeline, 2026-10-29). Fail loud on version drift.
      - name: Setup PHP ${{ matrix.php }} (NTS)
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl
          coverage: none
          tools: composer:v2

      - name: Determine tag
        id: reltag
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="${{ inputs.tag }}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Resolve release by ID + verify exact asset names (fail closed)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = '${{ steps.reltag.outputs.tag }}'
          $version = '${{ steps.reltag.outputs.version }}'

          # Condition 2: list releases (drafts visible to contents:write),
          # match tag_name exactly, require EXACTLY ONE match.
          $matched = @()
          foreach ($page in 1..5) {
            $rel = gh api "repos/${{ github.repository }}/releases?per_page=100&page=$page" | ConvertFrom-Json
            if ($rel.Count -eq 0) { break }
            $matched += @($rel | Where-Object { $_.tag_name -eq $tag })
          }
          if ($matched.Count -ne 1) {
            throw "Condition 2 violated: expected exactly 1 release for tag $tag, found $($matched.Count) (name collision / duplicate release?)"
          }
          $release = $matched[0]
          if (-not $release.draft) {
            Write-Host "::warning::release $tag is already published (id $($release.id)) - smoke continues against it (re-run path)"
          }

          # QH-1c note: matrix.php is used by the leg's own build identity.
          $phpVer = '${{ matrix.php }}'

          # FR-003/#688-P2: dump the release's asset names for the manifest join
          $relAssetNames = $release.assets | ForEach-Object { $_.name }
          $relAssetNames | Set-Content -Path release-assets.txt -Encoding Ascii

          # P2 manifest oracle: set-equality join vs the checked-in manifest
          # (all 4 PHP legs x 2 families x 2 ts in ONE join, not per-leg slices).
          pwsh -File ./scripts/windows/assert-asset-manifest.ps1 `
            -ManifestPath ./scripts/windows/release-asset-manifest.json `
            -Version $version `
            -ActualNamesFile release-assets.txt

          "release_id=$($release.id)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Release $tag resolved: id=$($release.id), Windows asset set verified against the manifest (#688-P2)"

          # Condition 3: download the NTS zips under test via API
          # octet-stream (gh release download uses the API asset URL).
          foreach ($name in @(
            "php_firebird-v$version-$phpVer-nts-$vs-x86_64.zip",
            "php_pdo_fbird-v$version-$phpVer-nts-$vs-x86_64.zip"
          )) {
            gh release download "$tag" --pattern "$name" --clobber --repo "${{ github.repository }}"
            if (-not (Test-Path $name)) { throw "Download failed: $name" }
            Write-Host "Downloaded: $name ($((Get-Item $name).Length) bytes)"
          }

      - name: Download build digest manifest (FR-003 #688-P1)
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: SHA256SUMS-${{ matrix.php }}-nts

      - name: Verify asset digests against the build manifest (FR-003 #688-P1)
        shell: pwsh
        run: |
          # FR-003: the smoke legs join on exact content - each downloaded zip
          # must match the digest recorded by the build job (name join).
          $ErrorActionPreference = 'Stop'
          $manifest = @{}
          foreach ($line in Get-Content SHA256SUMS) {
            if ($line -match '^([0-9a-f]{64})\s\s(.+)$') { $manifest[$Matches[2]] = $Matches[1] }
          }
          if ($manifest.Count -eq 0) { throw 'digest manifest empty/unparseable' }
          $version = '${{ steps.reltag.outputs.version }}'
          $phpVer = '${{ matrix.php }}'
          $vs = if ([version]$phpVer -ge [version]'8.4') { 'vs17' } else { 'vs16' }
          foreach ($name in @(
            "php_firebird-v$version-$phpVer-nts-$vs-x86_64.zip",
            "php_pdo_fbird-v$version-$phpVer-nts-$vs-x86_64.zip"
          )) {
            if (-not (Test-Path $name)) { throw "FR-003: asset missing on disk: $name" }
            $hash = (Get-FileHash -Algorithm SHA256 $name).Hash.ToLower()
            if (-not $manifest.ContainsKey($name)) { throw "FR-003: no manifest entry for $name" }
            if ($manifest[$name] -ne $hash) {
              throw ("FR-003: DIGEST MISMATCH for {0}: manifest={1} actual={2}" -f $name, $manifest[$name], $hash)
            }
            Write-Host "digest OK: $name"
          }

      - name: Install Firebird + create smoke DB
        uses: ./.github/actions/firebird-server

      - name: Extract release assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '${{ steps.reltag.outputs.version }}'
          $phpVer = '${{ matrix.php }}'
          $vs = if ([version]$phpVer -ge [version]'8.4') { 'vs17' } else { 'vs16' }
          Expand-Archive -Path "php_firebird-v$version-$phpVer-nts-$vs-x86_64.zip" -DestinationPath "ext_firebird" -Force
          Expand-Archive -Path "php_pdo_fbird-v$version-$phpVer-nts-$vs-x86_64.zip" -DestinationPath "ext_pdo" -Force
          $mainDll = (Get-ChildItem -Path ext_firebird -Filter 'php_firebird*.dll' -Recurse | Select-Object -First 1).FullName
          $pdoDll = (Get-ChildItem -Path ext_pdo -Filter 'php_pdo_fbird*.dll' -Recurse | Select-Object -First 1).FullName
          if (-not $mainDll) { throw 'php_firebird dll not found in zip' }
          if (-not $pdoDll) { throw 'php_pdo_fbird dll not found in zip - the release gate is STRICT on pdo (#636)' }
          "main_dll=$mainDll" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "pdo_dll=$pdoDll" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install extensions + identity guard (P3 composite, #688)
        uses: ./.github/actions/smoke-install-extensions
        with:
          main-dll: ${{ env.main_dll }}
          pdo-dll: ${{ env.pdo_dll }}
          expected-php-version: ${{ matrix.php }}
          pdo-mode: strict

      - name: Run shutdown smoke (exit code IS the test)
        shell: pwsh
        run: |
          Write-Host "=== gate smoke run: PHP $((php -r 'echo PHP_VERSION;')) ==="
          php scripts/windows/shutdown_smoke.php
          $code = $LASTEXITCODE
          Write-Host "smoke-exit=$code"

          if ($code -ne 0) {
            Write-Host "=== CRASH/FAIL DIAGNOSTICS (Windows Application Error) ==="
            try {
              Get-WinEvent -FilterHashtable @{LogName='Application'; ProviderName='Application Error'} -MaxEvents 10 -ErrorAction Stop |
                Where-Object { $_.message -match 'php' } |
                Select-Object -First 3 |
                ForEach-Object { Write-Host $_.message }
            } catch {
              Write-Host "no Application Error events captured: $_"
            }
            if ($code -eq -1073741819) {
              Write-Host "::error::#585 crash class reproduced on RELEASE ASSETS: 0xC0000005 at shutdown (PHP ${{ matrix.php }} NTS) - publish BLOCKED"
            }
            exit 1
          }
          Write-Host "GATE SMOKE PASS: clean shutdown on release assets (PHP ${{ matrix.php }} NTS)"

  # ===========================================================================
  # Upload the SMOKE-PASSED.json marker ONLY after every leg passed.
  # publish-release.yml requires this marker (and cross-checks its
  # release_id + asset checksums) before flipping draft:false. Fail closed:
  # no marker, no publish.
  # ===========================================================================
  smoke-marker:
    name: upload smoke marker
    needs: [release, pre-publish-smoke]
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
      (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # js: the set-equality check (#689, council run 6) needs the repo's
      # scripts/windows-asset-names.sh - this job was checkout-less by
      # design (download-and-upload only) and failed without it.
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Resolve release + checksum assets + upload marker
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="${{ inputs.tag }}"
          fi

          # Condition 2 again at marker time: exactly one release, capture id.
          RELEASE_ID=$(gh api "repos/${{ github.repository }}/releases?per_page=100" \
            --jq "[.[] | select(.tag_name == \"$TAG\")] | if length != 1 then error(\"expected exactly 1 release for $TAG\") else .[0].id end")

          mkdir -p dl && cd dl
          # js #688 P2: patterns verified against real v13.2.12 asset names
          # (they carry a -vsNN- segment the old pre-vs patterns never
          # matched - latent since #652, first exercised today).
          for ts in nts ts; do
            gh release download "$TAG" --pattern "php_firebird-*-${ts}-*-x86_64.zip" --clobber --repo "${{ github.repository }}"
            gh release download "$TAG" --pattern "php_pdo_fbird-*-${ts}-*-x86_64.zip" --clobber --repo "${{ github.repository }}"
          done
          COUNT_FB=$(ls -- php_firebird-*.zip 2>/dev/null | wc -l)
          COUNT_PDO=$(ls -- php_pdo_fbird-*.zip 2>/dev/null | wc -l)
          # js: per-family counts - 4 php versions x 2 ts each; the old
          # aggregate `== 8` was a pre-#636 expectation from when pdo zips
          # were absent, and fail-closed on the first release that ships
          # pdo (v13.2.12, 2026-10-29).
          [ "$COUNT_FB" -eq 8 ] || { echo "ERROR: expected 8 php_firebird zips, found $COUNT_FB"; exit 1; }
          [ "$COUNT_PDO" -eq 8 ] || { echo "ERROR: expected 8 php_pdo_fbird zips, found $COUNT_PDO"; exit 1; }
          # Council run 6 (S1/S2/S4): set equality against the shared expected
          # name list - patterns alone could bind a swapped/extra segment.
          VERSION="${TAG#v}"
          if ! diff -u <(bash "${GITHUB_WORKSPACE}/scripts/windows-asset-names.sh" "$VERSION" | sort) <(ls -1 -- *.zip | sort); then
            echo "ERROR: downloaded asset name set mismatch vs expected matrix"
            exit 1
          fi
          sha256sum -- *.zip > ../SHA256SUMS

          jq -n \
            --arg release_id "$RELEASE_ID" \
            --arg tag "$TAG" \
            --arg run_id "${{ github.run_id }}" \
            --arg commit "${{ github.sha }}" \
            --rawfile sums ../SHA256SUMS \
            '{release_id: $release_id, tag: $tag, run_id: $run_id, commit: $commit, assets_sha256: $sums}' \
            > SMOKE-PASSED.json

          gh release upload "$TAG" SMOKE-PASSED.json --clobber --repo "${{ github.repository }}"
          echo "Marker uploaded: SMOKE-PASSED.json (release_id=$RELEASE_ID, run=${{ github.run_id }})"

