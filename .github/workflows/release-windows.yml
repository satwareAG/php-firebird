# =============================================================================
# PHP Firebird Extension - Windows DLL Build
# =============================================================================
# Builds Windows DLLs using official php/php-windows-builder actions.
#
# Triggers:
#   - Tag push (v[0-9]*.*) - immutable releases
#   - Release created/published - non-immutable releases
#   - Pull requests (build only, no release)
#   - Manual dispatch (testing)
#
# Best practices from: https://github.com/php/php-windows-builder
# =============================================================================

name: Release (Windows)

on:
  push:
    tags:
      - 'v[0-9]*.*'
    branches: [satware-main]
    paths:
      - '*.c'
      - '*.h'
      - 'config.w32'
      - 'VERSION.txt'
      - '.github/workflows/release-windows.yml'
  pull_request:
  release:
    types: [created, published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build for (optional)'
        required: false

permissions: read-all

env:
  FIREBIRD_SDK_CACHE_KEY: firebird-sdk-v2

jobs:
  # ===========================================================================
  # CI Gate: Wait for CI/Sanitizers/Code Quality to pass before building
  # ===========================================================================
  ci-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check required workflows passed on this commit
        run: |
          set -euo pipefail

          # Only enforce gate on tag pushes, releases, and manual dispatch.
          # Branch pushes and PRs build for testing (no upload).
          if [ "${{ github.event_name }}" != "release" ] && \
             ! [[ "${{ github.ref }}" == refs/tags/v* ]] && \
             [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "Not a release event - skipping CI gate"
            exit 0
          fi

          SHA="${{ github.sha }}"
          MAX_WAIT=1080
          INTERVAL=30
          ELAPSED=0
          REQUIRED=("ci.yml" "sanitizers.yml" "code-quality.yml")
          while [ $ELAPSED -lt $MAX_WAIT ]; do
            ALL_DONE=true
            ALL_PASSED=true
            for wf in "${REQUIRED[@]}"; do
              RESULT=$(gh run list --workflow "$wf" --commit "$SHA" --limit 1 \
                --json status,conclusion 2>/dev/null | jq '.[0] // empty')
              STATUS=$(echo "$RESULT" | jq -r '.status // "not_found"')
              CONCLUSION=$(echo "$RESULT" | jq -r '.conclusion // ""')
              if [ "$STATUS" = "not_found" ]; then
                echo "  $wf: not found (waiting)"
                ALL_DONE=false
              elif [ "$STATUS" != "completed" ]; then
                echo "  $wf: $STATUS (waiting)"
                ALL_DONE=false
              elif [ "$CONCLUSION" != "success" ]; then
                echo "  $wf: $CONCLUSION (FAILED)"
                ALL_PASSED=false
              else
                echo "  $wf: success"
              fi
            done
            if [ "$ALL_DONE" = "true" ]; then
              if [ "$ALL_PASSED" = "true" ]; then
                echo "✓ All required CI workflows passed"
                exit 0
              else
                echo "✗ One or more required CI workflows failed"
                exit 1
              fi
            fi
            echo "Waiting for CI workflows... (${ELAPSED}s / ${MAX_WAIT}s)"
            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
          done
          echo "✗ Timeout waiting for CI workflows to complete"
          exit 1
        env:
          GH_TOKEN: ${{ github.token }}

  # ===========================================================================
  # Generate build matrix using php-windows-builder/extension-matrix
  # Reads PHP constraints from composer.json
  # ===========================================================================
  get-extension-matrix:
    needs: ci-gate
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.extension-matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Get the extension matrix
        id: extension-matrix
        uses: php/php-windows-builder/extension-matrix@c49dae50774b14e0f358d2efa65637b67f1104f6 # v1
        with:
          php-version-list: '8.2, 8.3, 8.4, 8.5'
          arch-list: 'x64'
          ts-list: 'nts, ts'

  # ===========================================================================
  # Build Windows DLLs
  # ===========================================================================
  build:
    needs: get-extension-matrix
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.get-extension-matrix.outputs.matrix) }}
    env:
      FIREBIRD_VERSION: '5.0'

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Ensure VERSION.txt file
        shell: pwsh
        run: |
          if ("${{ github.ref }}" -like "refs/tags/v*") {
            $version = "${{ github.ref }}".Substring(11)
            Set-Content -Path "VERSION.txt" -Value $version
            Write-Host "Updated VERSION.txt from tag: $version"
          } elseif (-not (Test-Path "VERSION.txt")) {
            # Extract from php_firebird.h as fallback
            $header = Get-Content "php_firebird.h"
            $match = $header | Select-String -Pattern '#define PHP_FIREBIRD_VERSION_STRING "([^"]+)"'
            if ($match) {
              $version = $match.Matches[0].Groups[1].Value
            } else {
              Write-Error "Cannot determine version (no tag, no VERSION.txt, no php_firebird.h define)"
              exit 1
            }
            Set-Content -Path "VERSION.txt" -Value $version
            Write-Host "Created VERSION.txt from header: $version"
          } else {
            Write-Host "Using existing VERSION.txt: $(Get-Content VERSION.txt)"
          }

      - name: Cache Firebird SDK
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        id: cache-fb-sdk
        with:
          path: C:\firebird-sdk
          key: ${{ env.FIREBIRD_SDK_CACHE_KEY }}-${{ env.FIREBIRD_VERSION }}-${{ matrix.arch }}

      - name: Download Firebird SDK
        if: steps.cache-fb-sdk.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          .\.github\scripts\download-firebird-sdk.ps1 `
            -Version "${{ env.FIREBIRD_VERSION }}" `
            -Architecture "${{ matrix.arch }}" `
            -DestinationPath "C:\firebird-sdk"

      - name: Set Firebird Environment
        shell: pwsh
        run: |
          $sdkPath = "C:\firebird-sdk"
          echo "FIREBIRD_HOME=$sdkPath" >> $env:GITHUB_ENV
          echo "$sdkPath\bin" >> $env:GITHUB_PATH
          echo "CFLAGS=-I$sdkPath\include" >> $env:GITHUB_ENV
          echo "LDFLAGS=-L$sdkPath\lib" >> $env:GITHUB_ENV

      - name: Build Extension
        uses: php/php-windows-builder/extension@c49dae50774b14e0f358d2efa65637b67f1104f6 # v1
        with:
          php-version: ${{ matrix.php-version }}
          arch: ${{ matrix.arch }}
          ts: ${{ matrix.ts }}
          args: --with-firebird=${{ env.FIREBIRD_HOME }}
          run-tests: false

  # ===========================================================================
  # Upload artifacts to GitHub Release
  # Uses official php-windows-builder/release action
  # ===========================================================================
  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    if: |
      github.event_name == 'release' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
      (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    steps:
      - name: Determine release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "tag=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          fi

      - name: Download All Build Artifacts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          path: artifacts

      - name: Upload Windows DLLs to GitHub Release
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          echo "Uploading Windows artifacts to release: $TAG"
          find artifacts -name "*.zip" -type f | while read -r zip_file; do
            echo "Uploading: $(basename "$zip_file")"
            gh release upload "$TAG" "$zip_file" --clobber
          done
          echo "Upload complete."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

      - name: Generate SLSA Provenance Attestations
        run: |
          echo "Generating SLSA provenance attestations for Windows artifacts..."
          find artifacts -name "*.zip" -type f | while read -r artifact; do
            echo "Attesting: $(basename "$artifact")"
            gh attestation generate "$artifact" \
              --repo "${{ github.repository }}" \
              --signer github 2>&1 || echo "WARNING: Attestation failed for $(basename "$artifact")"
          done
          echo "Attestation generation complete."
          echo "Verify with: gh attestation verify <artifact> --repo ${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
