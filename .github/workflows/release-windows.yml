# =============================================================================
# PHP Firebird Extension - Windows DLL Build
# =============================================================================
# Builds Windows DLLs using official php/php-windows-builder actions.
#
# Triggers:
#   - Tag push (v[0-9]*.*) - immutable releases
#   - Release created/published - non-immutable releases
#   - Pull requests (build only, no release)
#   - Manual dispatch (testing)
#
# Best practices from: https://github.com/php/php-windows-builder
# =============================================================================

name: Release (Windows)

on:
  push:
    tags:
      - 'v[0-9]*.*'
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build for (optional)'
        required: false

permissions: read-all

env:
  FIREBIRD_SDK_CACHE_KEY: firebird-sdk-v2

jobs:
  # ===========================================================================
  # Generate build matrix using php-windows-builder/extension-matrix
  # Reads PHP constraints from composer.json
  # ===========================================================================
  get-extension-matrix:
    # CI gate removed — relies on pre-tag verification (scripts/verify-ci-green.sh)
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.extension-matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Get the extension matrix
        id: extension-matrix
        uses: php/php-windows-builder/extension-matrix@c49dae50774b14e0f358d2efa65637b67f1104f6 # v1
        with:
          php-version-list: '8.2, 8.3, 8.4, 8.5'
          arch-list: 'x64'
          ts-list: 'nts, ts'

  # ===========================================================================
  # Build Windows DLLs
  # ===========================================================================
  build:
    needs: get-extension-matrix
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.get-extension-matrix.outputs.matrix) }}
    env:
      FIREBIRD_VERSION: '5.0'

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Ensure VERSION.txt file
        shell: pwsh
        run: |
          if ("${{ github.ref }}" -like "refs/tags/v*") {
            $version = "${{ github.ref }}".Substring(11)
            Set-Content -Path "VERSION.txt" -Value $version
            Write-Host "Updated VERSION.txt from tag: $version"
          } elseif (-not (Test-Path "VERSION.txt")) {
            # Extract from php_firebird.h as fallback
            $header = Get-Content "php_firebird.h"
            $match = $header | Select-String -Pattern '#define PHP_FIREBIRD_VERSION_STRING "([^"]+)"'
            if ($match) {
              $version = $match.Matches[0].Groups[1].Value
            } else {
              Write-Error "Cannot determine version (no tag, no VERSION.txt, no php_firebird.h define)"
              exit 1
            }
            Set-Content -Path "VERSION.txt" -Value $version
            Write-Host "Created VERSION.txt from header: $version"
          } else {
            Write-Host "Using existing VERSION.txt: $(Get-Content VERSION.txt)"
          }

      - name: Cache Firebird SDK
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        id: cache-fb-sdk
        with:
          path: C:\firebird-sdk
          key: ${{ env.FIREBIRD_SDK_CACHE_KEY }}-${{ env.FIREBIRD_VERSION }}-${{ matrix.arch }}

      - name: Download Firebird SDK
        if: steps.cache-fb-sdk.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          .\.github\scripts\download-firebird-sdk.ps1 `
            -Version "${{ env.FIREBIRD_VERSION }}" `
            -Architecture "${{ matrix.arch }}" `
            -DestinationPath "C:\firebird-sdk"

      - name: Set Firebird Environment
        shell: pwsh
        run: |
          $sdkPath = "C:\firebird-sdk"
          echo "FIREBIRD_HOME=$sdkPath" >> $env:GITHUB_ENV
          echo "$sdkPath\bin" >> $env:GITHUB_PATH

      - name: Flatten pdo_fbird sources for Windows build
        shell: pwsh
        run: |
          # The PHP Windows build system (nmake) doesn't create output
          # subdirectories for source files in subdirectories. Copy the
          # pdo_fbird source files to the root so they compile without
          # a subdirectory prefix, avoiding C1083 errors.
          Copy-Item pdo_fbird/pdo_fbird.c -Destination pdo_fbird_root.c -Force
          Copy-Item pdo_fbird/pdo_fbird_driver.c -Destination pdo_fbird_driver.c -Force
          Copy-Item pdo_fbird/pdo_fbird_stmt.c -Destination pdo_fbird_stmt.c -Force
          Copy-Item pdo_fbird/pdo_fbird_error.c -Destination pdo_fbird_error.c -Force

      - name: Build Extensions
        uses: php/php-windows-builder/extension@c49dae50774b14e0f358d2efa65637b67f1104f6 # v1
        with:
          php-version: ${{ matrix.php-version }}
          arch: ${{ matrix.arch }}
          ts: ${{ matrix.ts }}
          args: --with-firebird=${{ env.FIREBIRD_HOME }} --with-pdo-fbird=${{ env.FIREBIRD_HOME }}
          run-tests: false

  # ===========================================================================
  # Upload artifacts to GitHub Release
  # Uses official php-windows-builder/release action
  # ===========================================================================
  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    if: |
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
      (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    steps:
      - name: Determine release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "tag=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          fi

      - name: Download All Build Artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: artifacts
          merge-multiple: true

      - name: Validate artifact sizes
        run: |
          echo "=== Validating artifact sizes ==="
          found=0
          for f in artifacts/*.zip; do
            [ -f "$f" ] || continue
            found=1
            size=$(wc -c < "$f")
            if [ "$size" -lt 100000 ]; then
              echo "ERROR: $f is only ${size} bytes (expected >100KB)"
              exit 1
            fi
            echo "OK: $f (${size} bytes)"
          done
          if [ "$found" -eq 0 ]; then
            echo "ERROR: No zip artifacts found"
            exit 1
          fi

      - name: Upload Windows DLLs to GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: artifacts/**/*.zip
          fail_on_unmatched_files: true
          draft: true
        continue-on-error: true
        # The action sometimes fails on metadata update after successful upload
        # ("HttpError: Not Found" on asset update). The assets are present,
        # so we continue and let publish-release.yml handle the final state.

