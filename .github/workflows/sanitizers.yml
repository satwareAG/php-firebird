name: Memory Sanitizers

on:
  push:
  pull_request:
  workflow_dispatch:

# Cancel in-progress runs for the same branch
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================================================
  # AddressSanitizer + UndefinedBehaviorSanitizer Build
  # Detects: Buffer overflows, use-after-free, undefined behavior
  # ==========================================================================
  asan-ubsan:
    name: ASan + UBSan (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.3']

    # Run Firebird as a service container
    services:
      firebird:
        image: firebirdsql/firebird:5
        env:
          ISC_PASSWORD: masterkey
          FIREBIRD_DATABASE: test.fdb
          FIREBIRD_PASSWORD: masterkey
          FIREBIRD_USER: SYSDBA
        ports:
          - 3050:3050

    container:
      image: php:${{ matrix.php-version }}-cli-bookworm

    env:
      ISC_USER: SYSDBA
      ISC_PASSWORD: masterkey
      FIREBIRD_HOST: firebird
      FIREBIRD_DB_PATH: /var/lib/firebird/data/test.fdb
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # ASan/UBSan runtime options
      ASAN_OPTIONS: "detect_leaks=1:abort_on_error=1:halt_on_error=0:print_stats=1:verbosity=0"
      UBSAN_OPTIONS: "print_stacktrace=1:halt_on_error=0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Ensure VERSION.txt
        uses: ./.github/actions/version

      - name: Install Firebird client
        uses: ./.github/actions/install-firebird-client
        with:
          firebird-major-version: '5'
          extra-apt-packages: clang libasan8 libubsan1 llvm

      - name: Build firebird extension with ASan + UBSan
        uses: ./.github/actions/build-extension
        with:
          build-pdo-fbird: 'false'
          cc: gcc
          cxx: g++
          cflags-extra: -I/opt/firebird-client/include -fsanitize=address,undefined -fno-omit-frame-pointer -g -O1
          cxxflags-extra: -I/opt/firebird-client/include -fsanitize=address,undefined -fno-omit-frame-pointer -g -O1
          ldflags-extra: -L/opt/firebird-client/lib -fsanitize=address,undefined
          ld-library-path-extra: /opt/firebird-client/lib

      - name: Build pdo_fbird extension with ASan
        shell: bash
        run: |
          set -eu
          export LD_LIBRARY_PATH="/opt/firebird-client/lib:${LD_LIBRARY_PATH:-}"
          SANITIZE_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g -O1"
          export CC=gcc CXX=g++
          export CFLAGS="-I/opt/firebird-client/include ${SANITIZE_FLAGS}"
          export CXXFLAGS="-I/opt/firebird-client/include ${SANITIZE_FLAGS}"
          export LDFLAGS="-L/opt/firebird-client/lib -fsanitize=address,undefined"
          cd "${BUILD_DIR}/pdo_fbird"
          phpize
          ./configure --with-pdo-fbird --with-firebird=/opt/firebird-client
          make -j"$(nproc)"
          echo "pdo_fbird built with ASan + UBSan"

      - name: Verify extension build
        uses: ./.github/actions/verify-extension
        with:
          mode: build-only
          extension-path: ${{ env.BUILD_DIR }}/modules/firebird.so
          ld-library-path-extra: /opt/firebird-client/lib
          sanitizer-type: asan

      - name: ASan build verification complete
        run: |
          # ==========================================================================
          # IMPORTANT: ASan Runtime Tests Cannot Run with PHP Extensions
          # ==========================================================================
          #
          # PHP uses RTLD_DEEPBIND when dlopening extensions via -d extension=, which
          # is fundamentally incompatible with AddressSanitizer runtime
          # (see https://github.com/google/sanitizers/issues/611)
          #
          # The extension built with -fsanitize=address requires ASan runtime symbols
          # (like __asan_option_detect_stack_use_after_return), but we cannot:
          # 1. Use LD_PRELOAD - triggers RTLD_DEEPBIND abort
          # 2. Load without LD_PRELOAD - undefined symbol errors
          #
          # This is a known PHP+ASan limitation. Workarounds would require:
          # - Building PHP itself with ASan from source
          # - Using Valgrind instead (works without RTLD_DEEPBIND issues)
          #
          # What this job verifies:
          # ✅ Extension source code compiles with -fsanitize=address,undefined
          # ✅ No compile-time ASan/UBSan errors or warnings
          # ✅ Extension binary has sanitizer instrumentation embedded
          #
          # What this job CANNOT verify (due to PHP limitations):
          # ❌ Runtime memory safety (heap-buffer-overflow, use-after-free)
          # ❌ Runtime undefined behavior detection
          #
          # For runtime memory checking, use:
          # - LeakSanitizer (LSan) job - works with PHP extensions
          # - The main.yml test suite which validates functional correctness
          # - Local Valgrind testing for deep memory analysis
          # ==========================================================================

          echo "✅ ASan + UBSan BUILD VERIFICATION COMPLETE"
          echo ""
          echo "Summary:"
          echo "  - Extension compiled successfully with -fsanitize=address,undefined"
          echo "  - No compilation errors from sanitizer instrumentation"
          echo "  - This verifies the code is ASan-compatible"
          echo ""
          echo "⚠️ Note: Runtime testing skipped due to PHP RTLD_DEEPBIND incompatibility"
          echo "   See: https://github.com/google/sanitizers/issues/611"
          echo ""
          echo "For memory safety verification, see:"
          echo "  - LeakSanitizer job (runs in this workflow)"
          echo "  - Main test suite (functional testing)"

  # ==========================================================================
  # LeakSanitizer-only Build (Standalone memory leak detection)
  # ==========================================================================
  lsan:
    name: LeakSanitizer (PHP 8.3)
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    services:
      firebird:
        image: firebirdsql/firebird:5
        env:
          ISC_PASSWORD: masterkey
          FIREBIRD_DATABASE: test.fdb
          FIREBIRD_PASSWORD: masterkey
          FIREBIRD_USER: SYSDBA
        ports:
          - 3050:3050

    container:
      image: php:8.3-cli-bookworm

    env:
      ISC_USER: SYSDBA
      ISC_PASSWORD: masterkey
      FIREBIRD_HOST: firebird
      FIREBIRD_DB_DIR: /tmp
      FIREBIRD_DB_PATH: /var/lib/firebird/data/test.fdb
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      LSAN_OPTIONS: "suppressions=lsan.supp:print_suppressions=0:verbosity=1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Ensure VERSION.txt
        uses: ./.github/actions/version

      - name: Install Firebird client
        uses: ./.github/actions/install-firebird-client
        with:
          firebird-major-version: '5'
          extra-apt-packages: clang libasan8 liblsan0 llvm
          include-wget-fallback: 'false'

      - name: Build firebird extension with LeakSanitizer
        uses: ./.github/actions/build-extension
        with:
          build-pdo-fbird: 'false'
          cc: gcc
          cxx: g++
          cflags-extra: -I/opt/firebird-client/include -fsanitize=leak -fno-omit-frame-pointer -g -O1
          cxxflags-extra: -I/opt/firebird-client/include -fsanitize=leak -fno-omit-frame-pointer -g -O1
          ldflags-extra: -L/opt/firebird-client/lib -fsanitize=leak
          ld-library-path-extra: /opt/firebird-client/lib

      - name: Verify extension and connection
        uses: ./.github/actions/verify-extension
        with:
          mode: full
          extension-path: ${{ env.BUILD_DIR }}/modules/firebird.so
          ld-library-path-extra: /opt/firebird-client/lib

      - name: Create LSan suppressions file
        run: |
          cat > lsan.supp << 'EOF'
          # PHP internal allocations
          leak:zend_
          leak:php_
          leak:_emalloc
          leak:_erealloc

          # Firebird client library
          leak:fb_client
          leak:isc_
          leak:ib_util

          # ICU library
          leak:libicuuc
          leak:libicui18n
          EOF

      - name: Install Composer dependencies
        run: |
          EXPECTED_SIGNATURE="$(curl -sS https://composer.github.io/installer.sig)"
          curl -sS https://getcomposer.org/installer -o /tmp/composer-setup.php
          ACTUAL_SIGNATURE="$(php -r "echo hash_file('sha384', '/tmp/composer-setup.php');")"
          [ "$EXPECTED_SIGNATURE" = "$ACTUAL_SIGNATURE" ] || { echo "ERROR: Invalid Composer installer signature"; exit 1; }
          php /tmp/composer-setup.php --install-dir=/usr/local/bin --filename=composer
          rm -f /tmp/composer-setup.php
          composer install --prefer-dist --no-progress

      - name: Run tests with LeakSanitizer
        env:
          NO_INTERACTION: 1
          REPORT_EXIT_STATUS: 1
          TEST_PHP_EXECUTABLE: php
          FBIRD_SO: ${{ env.BUILD_DIR }}/modules/firebird.so
        run: |
          set -eu

          export LD_LIBRARY_PATH="/opt/firebird-client/lib:${LD_LIBRARY_PATH:-}"

          # jane: run-tests.php is generated by phpize in BUILD_DIR (out-of-tree
          # build). Copy it to GITHUB_WORKSPACE so tests run from the source tree.
          cp "${BUILD_DIR}/run-tests.php" .

          # Note: Standalone LSan (-fsanitize=leak) links directly into the extension
          # No LD_PRELOAD needed (unlike ASan which needs runtime library preloading)

          echo "=== Running tests with LeakSanitizer ==="

          EXTENSION_PATH="${BUILD_DIR}/modules/firebird.so"
          PDO_FBIRD_PATH="${BUILD_DIR}/pdo_fbird/modules/pdo_fbird.so"

          # Per AGENTS.md: `make test` only loads firebird.so and ignores
          # PHP_TEST_SHARED_EXTENSIONS, causing ALL pdo_fbird tests to SKIP.
          # Fix: use run-tests.php directly with -d extension= flags.
          EXT_FLAGS="-d extension=${EXTENSION_PATH}"
          if [ -f "$PDO_FBIRD_PATH" ]; then
            EXT_FLAGS="${EXT_FLAGS} -d extension=${PDO_FBIRD_PATH}"
          fi

          # Add pcntl if not already loaded (guard against double-load per AGENTS.md)
          if ! php -r 'exit(extension_loaded("pcntl") ? 0 : 1);' 2>/dev/null; then
            PCNTL_SO=$(find $(php-config --extension-dir) -name "pcntl.so" 2>/dev/null || true)
            if [ -n "$PCNTL_SO" ]; then
              EXT_FLAGS="${EXT_FLAGS} -d extension=${PCNTL_SO}"
            fi
          fi

          php run-tests.php ${EXT_FLAGS} \
            -p "$(which php)" \
            --set-timeout 15 \
            tests/ 2>&1 | tee lsan_output.txt || true

          if grep -q "Direct leak" lsan_output.txt; then
            echo "::warning::Memory leaks detected (check if in extension code)"
            echo "::group::Leak Details"
            grep -A 10 "Direct leak" lsan_output.txt | head -50
            echo "::endgroup::"
          fi

          echo "✅ LeakSanitizer check complete"

  # ==========================================================================
  # ThreadSanitizer + ZTS Build (Thread safety / data race detection)
  # Detects: Data races, deadlocks, thread leaks in ZTS (Zend Thread Safety) builds
  #
  # Unlike ASan, TSan works with PHP extensions when PHP itself is built from
  # source with TSan instrumentation. Both PHP and the extension share the same
  # TSan runtime, avoiding the RTLD_DEEPBIND incompatibility that affects ASan.
  # ==========================================================================
  tsan-zts:
    name: ThreadSanitizer + ZTS (PHP 8.3)
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    services:
      firebird:
        image: firebirdsql/firebird:5
        env:
          ISC_PASSWORD: masterkey
          FIREBIRD_DATABASE: test.fdb
          FIREBIRD_PASSWORD: masterkey
          FIREBIRD_USER: SYSDBA
        ports:
          - 3050:3050

    env:
      ISC_USER: SYSDBA
      ISC_PASSWORD: masterkey
      FIREBIRD_HOST: localhost
      FIREBIRD_DB_DIR: /tmp
      FIREBIRD_DB_PATH: /var/lib/firebird/data/test.fdb
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TSAN_OPTIONS: "suppressions=tsan.supp:halt_on_error=0:second_deadlock_stack=1:history_size=4"

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Ensure VERSION.txt
        uses: ./.github/actions/version

      - name: Install Firebird client and build dependencies
        uses: ./.github/actions/install-firebird-client
        with:
          firebird-major-version: '5'
          use-sudo: 'true'
          firebird-host: localhost
          include-wget-fallback: 'false'
          install-pcntl: 'false'
          extra-apt-packages: bison re2c libonig-dev libpcre2-dev libreadline-dev libsqlite3-dev libxml2-dev libzip-dev zlib1g-dev clang llvm

      - name: Resolve PHP 8.3 latest release
        id: php-version
        run: |
          set -eu
          PHP_VERSION=$(curl -fsSL 'https://www.php.net/releases/index.php?json&version=8.3' | jq -r '.version')
          echo "php_version=${PHP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved PHP ${PHP_VERSION}"

      - name: Cache PHP 8.3 ZTS+TSan build
        id: cache-php
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5
        with:
          path: /opt/php-tsan
          key: php-tsan-zts-${{ steps.php-version.outputs.php_version }}-ubuntu2404-clang-v6

      - name: Build PHP 8.3 with ZTS and ThreadSanitizer
        if: steps.cache-php.outputs.cache-hit != 'true'
        env:
          PHP_VERSION: ${{ steps.php-version.outputs.php_version }}
        run: |
          set -eu
          echo "Building PHP ${PHP_VERSION} with ZTS + ThreadSanitizer..."

          cd /tmp
          curl -fsSL "https://www.php.net/distributions/php-${PHP_VERSION}.tar.gz" -o php-src.tar.gz
          tar xzf php-src.tar.gz
          cd "php-${PHP_VERSION}"

          # Build PHP with ZTS (thread safety) and TSan instrumentation using Clang.
          # --disable-all: Minimal build to reduce compile time
          # --enable-zts: Enable Zend Thread Safety (required for TSan to be meaningful)
          # --enable-pcntl: Needed by some PHPT tests
          #
          # IMPORTANT: Must use Clang for TSan - GCC TSan is broken on Ubuntu/Debian
          # (segfaults during sanitizer_posix_libcdep.cpp signal handler setup).
          # TSAN_OPTIONS=exitcode=0 prevents configure test programs from failing
          # when TSan detects races in autoconf-generated test code.
          export TSAN_OPTIONS="exitcode=0:halt_on_error=0"
          ./configure \
            --prefix=/opt/php-tsan \
            --enable-zts \
            --disable-all \
            --enable-pcntl \
            --enable-posix \
            --enable-session \
            --enable-pdo \
            --with-zlib \
            CC=clang \
            CXX=clang++ \
            CFLAGS="-g -O1 -fno-omit-frame-pointer -fsanitize=thread" \
            LDFLAGS="-fsanitize=thread"

          make -j"$(nproc)"
          sudo make install

          echo "PHP ZTS+TSan installed to /opt/php-tsan"

          # TSan runtime may segfault during PHP startup in CI's constrained
          # environment (known issue with post-configure TSan injection).
          # The binary is still valid for phpize/php-config and extension builds.
          /opt/php-tsan/bin/php -v || echo "⚠️ php -v crashed (known TSan+PHP issue) - continuing"
          /opt/php-tsan/bin/php -i | grep -i "thread safety" || echo "⚠️ php -i unavailable - will verify at extension build"

      - name: Build firebird extension with ThreadSanitizer
        uses: ./.github/actions/build-extension
        with:
          build-pdo-fbird: 'false'
          cc: clang
          cxx: clang++
          cflags-extra: -I/opt/firebird-client/include -g -O1 -fno-omit-frame-pointer
          cxxflags-extra: -I/opt/firebird-client/include -g -O1 -fno-omit-frame-pointer
          ldflags-extra: -L/opt/firebird-client/lib
          ld-library-path-extra: /opt/firebird-client/lib
          php-bin-dir: /opt/php-tsan/bin
          configure-args: --disable-fbird-lto
          pre-build-script: |
            sed -i 's/^CFLAGS_CLEAN = /CFLAGS_CLEAN = -fsanitize=thread /' Makefile
            sed -i '/^LDFLAGS = / s/$/ -fsanitize=thread/' Makefile
            sed -i '/^EXTRA_LDFLAGS = / s/$/ -fsanitize=thread/' Makefile

      - name: Verify PHP ZTS build
        shell: bash
        run: |
          export PATH="/opt/php-tsan/bin:$PATH"
          php -i 2>&1 | grep -i "thread safety" || echo "Warning: php -i crashed - TSan runtime init issue (known)"

      - name: Verify extension and ZTS mode
        uses: ./.github/actions/verify-extension
        with:
          mode: best-effort
          extension-path: ${{ env.BUILD_DIR }}/modules/firebird.so
          ld-library-path-extra: /opt/firebird-client/lib
          php-bin: /opt/php-tsan/bin/php
          sanitizer-type: tsan

      - name: Create TSan suppressions file
        run: |
          cat > tsan.supp << 'EOF'
          # PHP internal thread management (expected races in ZTS internals)
          race:zend_
          race:php_
          race:_emalloc
          race:_erealloc
          race:_efree

          # Firebird client library (internal threading)
          race:libfbclient
          race:fb_client
          race:isc_
          race:ib_util

          # ICU library
          race:libicuuc
          race:libicui18n

          # GCC/system runtime
          race:__cxa_
          EOF

      - name: Run tests with ThreadSanitizer
        env:
          NO_INTERACTION: 1
          REPORT_EXIT_STATUS: 1
          FBIRD_SO: ${{ env.BUILD_DIR }}/modules/firebird.so
        run: |
          set -eu

          export PATH="/opt/php-tsan/bin:$PATH"
          export LD_LIBRARY_PATH="/opt/firebird-client/lib:/usr/lib:${LD_LIBRARY_PATH:-}"

          # jane: run-tests.php is generated by phpize in BUILD_DIR (out-of-tree
          # build). Copy it to GITHUB_WORKSPACE so tests run from the source tree.
          cp "${BUILD_DIR}/run-tests.php" .

          echo "=== Running tests with ThreadSanitizer (ZTS) ==="

          EXTENSION_PATH="${BUILD_DIR}/modules/firebird.so"
          PDO_FBIRD_PATH="${BUILD_DIR}/pdo_fbird/modules/pdo_fbird.so"

          # Per AGENTS.md: `make test` only loads firebird.so and ignores
          # PHP_TEST_SHARED_EXTENSIONS, causing ALL pdo_fbird tests to SKIP.
          # Fix: use run-tests.php directly with -d extension= flags.
          EXT_FLAGS="-d extension=${EXTENSION_PATH}"
          if [ -f "$PDO_FBIRD_PATH" ]; then
            EXT_FLAGS="${EXT_FLAGS} -d extension=${PDO_FBIRD_PATH}"
          fi

          # Check for pcntl extension (built as shared with our custom PHP)
          PCNTL_SO=$(find /opt/php-tsan -name "pcntl.so" 2>/dev/null | head -1 || true)
          if [ -n "$PCNTL_SO" ]; then
            EXT_FLAGS="${EXT_FLAGS} -d extension=${PCNTL_SO}"
          fi

          php run-tests.php ${EXT_FLAGS} \
            -p "$(which php)" \
            --set-timeout 15 \
            tests/ 2>&1 | tee tsan_output.txt || true

          # Report TSan-detected races as warnings
          if grep -q "WARNING: ThreadSanitizer:" tsan_output.txt; then
            echo "::warning::ThreadSanitizer detected potential data races"
            echo "::group::TSan Race Details"
            grep -A 20 "WARNING: ThreadSanitizer:" tsan_output.txt | head -100
            echo "::endgroup::"
          fi

          if grep -q "SUMMARY: ThreadSanitizer: data race" tsan_output.txt; then
            RACE_COUNT=$(grep -c "SUMMARY: ThreadSanitizer: data race" tsan_output.txt || true)
            echo "::warning::Found ${RACE_COUNT} data race(s) - review required"
          fi

          echo "✅ ThreadSanitizer check complete"

  # ==========================================================================
  # Summary Job
  # ==========================================================================
  sanitizer-summary:
    name: Sanitizer Summary
    runs-on: ubuntu-24.04
    needs: [asan-ubsan, lsan, tsan-zts]
    if: always()
    timeout-minutes: 5

    steps:
      - name: Check sanitizer results
        run: |
          echo "ASan + UBSan: ${{ needs.asan-ubsan.result }}"
          echo "LSan: ${{ needs.lsan.result }}"
          echo "TSan + ZTS: ${{ needs.tsan-zts.result }}"

          if [ "${{ needs.asan-ubsan.result }}" = "failure" ]; then
            echo "❌ AddressSanitizer/UBSan detected critical issues"
            exit 1
          fi

          if [ "${{ needs.lsan.result }}" = "failure" ]; then
            echo "⚠️ LeakSanitizer detected issues (review required)"
          fi

          if [ "${{ needs.tsan-zts.result }}" = "failure" ]; then
            echo "⚠️ ThreadSanitizer detected issues (review required)"
          fi

          echo "✅ Sanitizer checks complete"
