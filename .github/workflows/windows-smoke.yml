# =============================================================================
# Windows Smoke (NTS zips) - #585 regression lane
# =============================================================================
#
# Reproduces and guards against the #585 crash class: 0xC0000005 at PHP
# shutdown after Firebird connections, on Windows NTS builds.
#
# Replaces the physical probe host (pf-pc-dev, retired 2026-10-22): the
# consumer's own CI (satwareAG/doctrine-firebird-driver .github/workflows/
# windows.yml) proved the environment reproduces deterministically on
# windows-latest runners - no physical Windows host is needed.
#
# Trigger:
#   - workflow_dispatch (input `tag`: release tag to test; empty = latest)
#   - pull_request touching this file or the smoke script
#
# Success criteria: `php scripts/windows/shutdown_smoke.php` exits 0 on every
# PHP leg. The script's EXIT CODE IS THE TEST (the crash happens after normal
# output completes). On a crash exit (-1073741819) the step dumps the Windows
# Application Error event (faulting module + offset) before failing.
#
# jane: NTS only - the crash class was never observed on TS or on Linux/macOS
#       builds of the same tags (#585). Add a ts axis here only if evidence
#       demands it.
# =============================================================================

name: Windows Smoke

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to test (e.g. v13.2.8); empty = latest release'
        required: false
        default: ''
  pull_request:
    paths:
      - '.github/workflows/windows-smoke.yml'
      - 'scripts/windows/**'

permissions:
  contents: read

concurrency:
  # jane: include the dispatch tag - two dispatches of DIFFERENT tags on the
  #       same ref must coexist (a tag-less group let the v13.2.8 dispatch
  #       cancel the v13.2.7 control run on 2026-10-22). Same-tag re-dispatch
  #       still cancels in-progress, which is the desired behavior.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.inputs.tag || 'default' }}
  cancel-in-progress: true

jobs:
  nts-smoke:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']

    env:
      ISC_USER: SYSDBA
      ISC_PASSWORD: masterkey
      SMOKE_DB: 'localhost:C:\firebird_tests\smoke.fdb'
      # jane: PR-event fallback tag - PINNED, never 'latest' (anti-float rule,
      #       driver #167 lesson). Bump when a release should become the PR-lane
      #       default; dispatch runs take the explicit input tag instead.
      DEFAULT_TAG: v13.2.9
      # jane: consumer control oracle pinned to the commit whose suite produced
      #       the 2026-10-22 #585 evidence. Bump deliberately; a floating branch
      #       redefines the crash oracle without a trace in this repo.
      DRIVER_SHA: 1f944b0a2ade3645532dbeca5c8901248d8d1432

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup PHP ${{ matrix.php }} (NTS)
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl
          coverage: none
          tools: composer:v2

      - name: Install Firebird 3.0.13
        shell: pwsh
        run: |
          # jane: NO actions/cache on the choco lib dir - a restored lib makes
          #       choco report "already installed" WITHOUT running the actual
          #       Firebird installer (Program Files stays empty -> isql health
          #       check fails). Determinism over speed; install is ~3 min.
          choco install firebird --version=3.0.13 --yes --no-progress --timeout 600

          if (-not (Test-Path "C:\firebird_tests")) { New-Item -Path "C:\firebird_tests" -ItemType Directory }
          icacls "C:\firebird_tests" /grant "Everyone:(OI)(CI)F" /T /C

          $fbDir = (Get-ChildItem "C:\Program Files\Firebird\Firebird_*" | Select-Object -First 1).FullName
          echo "$fbDir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

          # Allow creating databases by absolute path from PHP
          Add-Content -Path "$fbDir\firebird.conf" -Value "DatabaseAccess = Full"
          $service = Get-Service | Where-Object { $_.Name -like "*Firebird*" } | Select-Object -First 1
          if ($service) {
            Restart-Service -Name $service.name
            Start-Sleep -Seconds 5
          }

          # Health check: server answers a query
          "select 1 from rdb`$database;" | & "$fbDir\isql.exe" -q -user SYSDBA -password masterkey "localhost:employee" 2>&1
          if ($LASTEXITCODE -ne 0) { throw "Firebird health check failed (isql exit $LASTEXITCODE)" }
          Write-Host "Firebird ready: $fbDir"

      - name: Create smoke database
        shell: pwsh
        run: |
          $fbDir = (Get-ChildItem "C:\Program Files\Firebird\Firebird_*" | Select-Object -First 1).FullName
          $sql = "CREATE DATABASE 'C:\\firebird_tests\\smoke.fdb' user 'SYSDBA' password 'masterkey' DEFAULT CHARACTER SET UTF8;"
          $sql | & "$fbDir\isql.exe" -q 2>&1
          if (-not (Test-Path "C:\firebird_tests\smoke.fdb")) { throw "smoke.fdb not created" }
          Write-Host "smoke.fdb created"

      - name: Resolve release and download NTS zips
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          $headers = @{}
          if ($env:GITHUB_TOKEN) { $headers["Authorization"] = "token $env:GITHUB_TOKEN" }

          # jane: dispatch input is validated before it reaches an API URL path
          #       (read-only endpoint + own repo, but cheap to gate).
          if (-not [string]::IsNullOrWhiteSpace($env:INPUT_TAG) -and
              $env:INPUT_TAG -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Invalid tag format: '$env:INPUT_TAG' (expected vX.Y.Z)"
          }

          # jane: empty input (PR events) falls back to the PINNED DEFAULT_TAG,
          #       never 'latest' - floating resolution is the driver #167 bug
          #       class this lane exists to prevent.
          $tag = if ([string]::IsNullOrWhiteSpace($env:INPUT_TAG)) { $env:DEFAULT_TAG } else { $env:INPUT_TAG }
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/${{ github.repository }}/releases/tags/$tag" -Headers $headers
          $version = $release.tag_name -replace '^v', ''
          Write-Host "Testing release $($release.tag_name) (assets: $($release.assets.Count))"

          $phpVer = "${{ matrix.php }}"
          $vs = if ([version]$phpVer -ge [version]'8.4') { 'vs17' } else { 'vs16' }

          # Exact-name resolution; NO floating fallback patterns (driver #167
          # lesson: floating resolution silently switched DLL builds mid-queue).
          $names = @(
            "php_firebird-v$version-$phpVer-nts-$vs-x86_64.zip",
            "php_pdo_fbird-v$version-$phpVer-nts-$vs-x86_64.zip"
          )
          foreach ($name in $names) {
            $asset = $release.assets | Where-Object { $_.name -eq $name } | Select-Object -First 1
            if (-not $asset) { throw "Asset not found in $($release.tag_name): $name" }
            Write-Host "Downloading $($asset.name)"
            Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $asset.name -Headers $headers
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VS=$vs" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install extension DLLs
        shell: pwsh
        run: |
          $phpDir = Split-Path -Parent (Get-Command php).Source
          # `version` and `VS` were exported by the resolve step (GITHUB_ENV)
          $version = $env:version
          $vs = $env:VS

          Expand-Archive -Path "php_firebird-v$version-${{ matrix.php }}-nts-$vs-x86_64.zip" -DestinationPath "ext_firebird" -Force
          Expand-Archive -Path "php_pdo_fbird-v$version-${{ matrix.php }}-nts-$vs-x86_64.zip" -DestinationPath "ext_pdo" -Force

          # jane: list extracted contents BEFORE detection - the 2026-10-22 runs
          #       reported 'pdo DLL absent' on v13.2.7 although the zip contains
          #       it (unexplained; local replication of the exact chain finds it).
          #       These lines make the next occurrence self-diagnosing.
          Get-ChildItem -Path "ext_firebird" -Recurse -File | ForEach-Object { Write-Host "ext_firebird: $($_.Name)" }
          Get-ChildItem -Path "ext_pdo" -Recurse -File | ForEach-Object { Write-Host "ext_pdo: $($_.Name)" }

          $mainDll = Get-ChildItem -Path "ext_firebird" -Filter "php_firebird*.dll" -Recurse | Select-Object -First 1
          $pdoDll  = Get-ChildItem -Path "ext_pdo" -Filter "php_pdo_fbird*.dll" -Recurse | Select-Object -First 1
          if (-not $mainDll) { throw "php_firebird dll not found in zip" }

          Copy-Item $mainDll.FullName -Destination "$phpDir\ext\php_firebird.dll" -Force

          # jane: pdo_fbird Windows zip is OPTIONAL - v13.2.8 pdo zips are
          #       broken in two ways (#636): 8.2/8.3/8.4 log-only, 8.5 ships an
          #       unloadable dll. The #585 crash reproduces on the main
          #       extension alone.
          #       $pdoInstalled stays a LOCAL variable: GITHUB_ENV writes do not
          #       propagate within the same step (review finding 1 - reading it
          #       back via $env: here always missed).
          $pdoInstalled = "false"
          if ($pdoDll) {
            Copy-Item $pdoDll.FullName -Destination "$phpDir\ext\php_pdo_fbird.dll" -Force
            $pdoInstalled = "true"
          } else {
            Write-Host "::warning::pdo_fbird DLL absent from zip - PDO section will be skipped"
          }

          $phpIni = php -r "echo php_ini_loaded_file();"
          if (-not $phpIni) { $phpIni = "$phpDir\php.ini" }
          if (-not (Test-Path $phpIni)) { Copy-Item "$phpDir\php.ini-development" $phpIni }
          Add-Content -Path $phpIni -Value "`nextension=firebird"

          # Firebird client from the server install (choco) + legacy alias
          $fbDir = (Get-ChildItem "C:\Program Files\Firebird\Firebird_*" | Select-Object -First 1).FullName
          Copy-Item "$fbDir\fbclient.dll" -Destination $phpDir -Force
          Copy-Item "$fbDir\fbclient.dll" -Destination "$phpDir\gds32.dll" -Force

          # Main extension load: FATAL - it is the lane's subject (#585).
          php -r "if (!extension_loaded('firebird')) { exit(1); }"
          if ($LASTEXITCODE -ne 0) { throw "php_firebird failed to load (see PHP startup warning above)" }

          # jane: pdo_fbird is OPTIONAL coverage and must never mask the primary
          #       oracle (consumer suite below). Probe-load it BEFORE committing
          #       it to php.ini: #636 evidence shows zips can ship an unloadable
          #       pdo dll (v13.2.8 8.5: 'Invalid library') - that costs the PDO
          #       section + a loud annotation, not the whole leg.
          $pdoLoaded = "false"
          if ($pdoInstalled -eq "true") {
            php -d extension=pdo_fbird -r "exit(extension_loaded('pdo_fbird') ? 0 : 1);"
            if ($LASTEXITCODE -eq 0) {
              Add-Content -Path $phpIni -Value "extension=pdo_fbird"
              $pdoLoaded = "true"
              Write-Host "extensions loaded: firebird, pdo_fbird"
            } else {
              Write-Host "::error::pdo_fbird DLL present in zip but UNLOADABLE - broken release artifact (#636); PDO section skipped, lane continues"
            }
          } else {
            Write-Host "::warning::pdo_fbird DLL absent from zip - PDO section skipped (#636)"
          }

          # jane: explicit exit - pwsh steps otherwise end with the LAST NATIVE
          #       command's exit code, so a failed pdo probe above would fail
          #       this step despite 'lane continues'. Fatal paths are the throws.
          exit 0

      - name: Run shutdown smoke (exit code IS the test)
        shell: pwsh
        run: |
          Write-Host "=== smoke run: PHP $((php -r 'echo PHP_VERSION;')) ==="
          php scripts/windows/shutdown_smoke.php
          $code = $LASTEXITCODE
          Write-Host "smoke-exit=$code"

          if ($code -ne 0) {
            Write-Host "=== CRASH/FAIL DIAGNOSTICS (Windows Application Error) ==="
            try {
              Get-WinEvent -FilterHashtable @{LogName='Application'; ProviderName='Application Error'} -MaxEvents 10 -ErrorAction Stop |
                Where-Object { $_.message -match 'php' } |
                Select-Object -First 3 |
                ForEach-Object { Write-Host $_.message }
            } catch {
              Write-Host "no Application Error events captured: $_"
            }
            if ($code -eq -1073741819) {
              Write-Host "::error::#585 crash class reproduced: 0xC0000005 at shutdown (PHP ${{ matrix.php }} NTS)"
            }
            exit 1
          }
          Write-Host "SMOKE PASS: clean shutdown on PHP ${{ matrix.php }} NTS"

      # ---------------------------------------------------------------------------
      # Consumer-suite control: the MINIMAL smoke (above) passed green on
      # v13.2.7 - the tag the consumer crashed on - so it does NOT walk the
      # crashing path (#585 lesson 2026-10-22: green-never-seen-red). The
      # doctrine-firebird-driver Integration-ReadOnly suite IS the
      # deterministic historical repro (driver#167): run it against the DLL
      # under test. Dispatch-only; PR runs keep the fast lane.
      # ---------------------------------------------------------------------------
      - name: Consumer suite control (driver Integration-ReadOnly)
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          DB_DBNAME: test.fdb
        run: |
          $fbDir = (Get-ChildItem "C:\Program Files\Firebird\Firebird_*" | Select-Object -First 1).FullName

          # Test DB for the consumer TestUtil (simple name -> C:\firebird_tests)
          if (-not (Test-Path "C:\firebird_tests\test.fdb")) {
            "CREATE DATABASE 'C:\\firebird_tests\\test.fdb' user 'SYSDBA' password 'masterkey' DEFAULT CHARACTER SET UTF8;" |
              & "$fbDir\isql.exe" -q 2>&1
          }

          git clone https://github.com/satwareAG/doctrine-firebird-driver.git driver
          git -C driver checkout $env:DRIVER_SHA
          $drvSha = git -C driver rev-parse HEAD
          if ($drvSha -ne $env:DRIVER_SHA) { throw "driver checkout mismatch: $drvSha" }
          Write-Host "driver checkout: pinned $drvSha (DLL under test: v$env:version)"

          Set-Location driver
          composer install --prefer-dist --no-interaction --no-progress --ignore-platform-req=ext-firebird
          if ($LASTEXITCODE -ne 0) { throw "composer install failed" }

          vendor/bin/phpunit --configuration phpunit.xml --testsuite Integration-ReadOnly --no-progress --no-coverage
          $code = $LASTEXITCODE
          Write-Host "consumer-exit=$code"

          if ($code -ne 0) {
            Write-Host "=== CONSUMER CRASH/FAIL DIAGNOSTICS ==="
            try {
              Get-WinEvent -FilterHashtable @{LogName='Application'; ProviderName='Application Error'} -MaxEvents 10 -ErrorAction Stop |
                Where-Object { $_.message -match 'php' } |
                Select-Object -First 3 |
                ForEach-Object { Write-Host $_.message }
            } catch { Write-Host "no Application Error events: $_" }
            if ($code -eq -1073741819) {
              Write-Host "::error::#585 crash class reproduced by consumer suite (0xC0000005, PHP ${{ matrix.php }} NTS, v$env:version)"
            }
            exit 1
          }
          Write-Host "CONSUMER PASS: driver Integration-ReadOnly green, clean shutdown (PHP ${{ matrix.php }} NTS, v$env:version)"
