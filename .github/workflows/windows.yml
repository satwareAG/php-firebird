name: Windows DLL Build

on:
  push:
    branches: [master, main, satware-main]
    paths:
      - '*.c'
      - '*.h'
      - 'config.w32'
      - '.github/workflows/windows.yml'
  pull_request:
  release:
    types: [created, published]
  workflow_dispatch:
    inputs:
      php-versions:
        description: 'PHP versions (comma-separated)'
        default: '8.4'
      firebird-versions:
        description: 'Firebird versions (comma-separated)'
        default: '5.0'
      tag:
        description: 'Release tag to build for (optional)'
        required: false

permissions:
  contents: write

env:
  FIREBIRD_SDK_CACHE_KEY: firebird-sdk-v1

jobs:
  # Use php-windows-builder/extension-matrix for automatic PHP version detection
  # This reads PHP constraints from composer.json and generates the build matrix
  # See: https://github.com/php/php-windows-builder#get-the-job-matrix-to-build-a-php-extension
  get-extension-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.extension-matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get the extension matrix
        id: extension-matrix
        uses: php/php-windows-builder/extension-matrix@v1
        with:
          # Explicitly list PHP versions (alternatively, rely on composer.json "php": ">=8.1")
          php-version-list: '8.1, 8.2, 8.3, 8.4'
          # x64 only - x86 would require separate Firebird SDK builds
          arch-list: 'x64'
          # Both thread-safe and non-thread-safe builds
          ts-list: 'nts, ts'

  build:
    needs: get-extension-matrix
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.get-extension-matrix.outputs.matrix) }}
    env:
      # Firebird SDK version - compiled DLL is compatible with all FB client versions
      FIREBIRD_VERSION: '5.0'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Firebird SDK
        uses: actions/cache@v4
        id: cache-fb-sdk
        with:
          path: C:\firebird-sdk
          key: ${{ env.FIREBIRD_SDK_CACHE_KEY }}-${{ env.FIREBIRD_VERSION }}-${{ matrix.arch }}

      - name: Download Firebird SDK
        if: steps.cache-fb-sdk.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          .\.github\scripts\download-firebird-sdk.ps1 `
            -Version "${{ env.FIREBIRD_VERSION }}" `
            -Architecture "${{ matrix.arch }}" `
            -DestinationPath "C:\firebird-sdk"

      - name: Set Firebird Environment
        shell: pwsh
        run: |
          $sdkPath = "C:\firebird-sdk"
          echo "FIREBIRD_HOME=$sdkPath" >> $env:GITHUB_ENV
          echo "$sdkPath\bin" >> $env:GITHUB_PATH
          echo "CFLAGS=-I$sdkPath\include" >> $env:GITHUB_ENV
          echo "LDFLAGS=-L$sdkPath\lib" >> $env:GITHUB_ENV

      - name: Build Extension
        uses: php/php-windows-builder/extension@v1
        with:
          php-version: ${{ matrix.php-version }}
          arch: ${{ matrix.arch }}
          ts: ${{ matrix.ts }}
          args: --with-firebird=${{ env.FIREBIRD_HOME }}
          run-tests: false

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd release-artifacts
          if ls *.dll 1> /dev/null 2>&1; then
            sha256sum *.dll > SHA256SUMS-windows.txt
            echo "Generated checksums for DLL files:"
            cat SHA256SUMS-windows.txt
          else
            echo "Warning: No .dll files found"
            ls -la
          fi

      - name: Upload to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          echo "Uploading Windows DLLs to release: $TAG"
          cd release-artifacts
          # Upload all DLLs
          for dll in *.dll; do
            if [ -f "$dll" ]; then
              echo "Uploading: $dll"
              gh release upload "$TAG" "$dll" --clobber --repo "${{ github.repository }}"
            fi
          done
          # Upload checksum file
          if [ -f "SHA256SUMS-windows.txt" ]; then
            gh release upload "$TAG" "SHA256SUMS-windows.txt" --clobber --repo "${{ github.repository }}"
          fi
