name: Windows DLL Build

on:
  push:
    branches: [master, main, satware-main]
    paths:
      - '*.c'
      - '*.h'
      - 'config.w32'
      - '.github/workflows/windows.yml'
  pull_request:
  release:
    types: [created, published]
  workflow_dispatch:
    inputs:
      php-versions:
        description: 'PHP versions (comma-separated)'
        default: '8.4'
      firebird-versions:
        description: 'Firebird versions (comma-separated)'
        default: '5.0'
      tag:
        description: 'Release tag to build for (optional)'
        required: false

permissions:
  contents: write

env:
  FIREBIRD_SDK_CACHE_KEY: firebird-sdk-v1

jobs:
  get-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: set-matrix
        run: |
          # Generate matrix JSON
          # PHP: 8.1, 8.2, 8.3, 8.4
          # Arch: x64 (x86 optional - FB SDK availability)
          # TS: nts, ts
          # FB: 3.0, 4.0, 5.0
          matrix='{"include":['
          for php in "8.1" "8.2" "8.3" "8.4"; do
            for ts in "nts" "ts"; do
              for fb in "3.0" "4.0" "5.0"; do
                matrix+='{"php-version":"'$php'","arch":"x64","ts":"'$ts'","firebird-version":"'$fb'","os":"windows-2022"},'
              done
            done
          done
          matrix="${matrix%,}]}"
          echo "matrix=$matrix" >> $GITHUB_OUTPUT

  build:
    needs: get-matrix
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.get-matrix.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - name: Cache Firebird SDK
        uses: actions/cache@v4
        id: cache-fb-sdk
        with:
          path: C:\firebird-sdk
          key: ${{ env.FIREBIRD_SDK_CACHE_KEY }}-${{ matrix.firebird-version }}-${{ matrix.arch }}

      - name: Download Firebird SDK
        if: steps.cache-fb-sdk.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          .\.github\scripts\download-firebird-sdk.ps1 `
            -Version "${{ matrix.firebird-version }}" `
            -Architecture "${{ matrix.arch }}" `
            -DestinationPath "C:\firebird-sdk"

      - name: Set Firebird Environment
        shell: pwsh
        run: |
          $sdkPath = "C:\firebird-sdk"
          echo "FIREBIRD_HOME=$sdkPath" >> $env:GITHUB_ENV
          echo "$sdkPath\bin" >> $env:GITHUB_PATH
          echo "CFLAGS=-I$sdkPath\include" >> $env:GITHUB_ENV
          echo "LDFLAGS=-L$sdkPath\lib" >> $env:GITHUB_ENV

      - name: Build Extension
        uses: php/php-windows-builder/extension@v1
        with:
          php-version: ${{ matrix.php-version }}
          arch: ${{ matrix.arch }}
          ts: ${{ matrix.ts }}
          args: --with-firebird=${{ env.FIREBIRD_HOME }}

      - name: Rename DLL with metadata
        shell: pwsh
        run: |
          $dllName = "php_firebird-${{ github.ref_name }}-${{ matrix.php-version }}-${{ matrix.ts }}-${{ matrix.arch }}-fb${{ matrix.firebird-version }}.dll"
          # Find and rename the built DLL
          Get-ChildItem -Path artifacts -Filter "*.dll" |
            Rename-Item -NewName $dllName

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: php-firebird-${{ matrix.php-version }}-${{ matrix.ts }}-${{ matrix.arch }}-fb${{ matrix.firebird-version }}
          path: artifacts/*.dll

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd release-artifacts
          if ls *.dll 1> /dev/null 2>&1; then
            sha256sum *.dll > SHA256SUMS-windows.txt
            echo "Generated checksums for DLL files:"
            cat SHA256SUMS-windows.txt
          else
            echo "Warning: No .dll files found"
            ls -la
          fi

      - name: Upload to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          echo "Uploading Windows DLLs to release: $TAG"
          cd release-artifacts
          # Upload all DLLs
          for dll in *.dll; do
            if [ -f "$dll" ]; then
              echo "Uploading: $dll"
              gh release upload "$TAG" "$dll" --clobber --repo "${{ github.repository }}"
            fi
          done
          # Upload checksum file
          if [ -f "SHA256SUMS-windows.txt" ]; then
            gh release upload "$TAG" "SHA256SUMS-windows.txt" --clobber --repo "${{ github.repository }}"
          fi
