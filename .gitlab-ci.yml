# GitLab CI/CD Pipeline for PHP Firebird Extension with C++17 Modernization
# Phase 4: Automated Quality Gates and Cross-Platform Validation

variables:
  CPPCHECK_VERSION: "2.12"
  CLANG_TIDY_VERSION: "17"

stages:
  - validate
  - build
  - test
  - static-analysis
  - memory-safety
  - performance
  - cross-platform

# Stage 1: Code validation and linting
validate:php-syntax:
  stage: validate
  image: php:8.1-cli
  script:
    - find . -name "*.php" -exec php -l {} \;
  allow_failure: false

validate:c++-syntax:
  stage: validate
  image: ubuntu:22.04
  before_script:
    - apt-get update -qq
    - apt-get install -y g++ clang-tools-17
  script:
    - g++ -std=c++17 -fsyntax-only firebird_utils.cpp
    - echo "✅ C++17 syntax validation passed"
  allow_failure: false

# Stage 2: Multi-version build matrix
build:php-matrix:
  stage: build
  parallel:
    matrix:
      - PHP_VERSION: ["8.1", "8.2", "8.3", "8.4", "8.5"]
  image: ubuntu:22.04
  before_script:
    - apt-get update -qq
    - apt-get install -y software-properties-common
    - add-apt-repository ppa:ondrej/php -y
    - apt-get update
    - apt-get install -y php${PHP_VERSION}-dev php${PHP_VERSION}-cli build-essential libfirebird-dev autoconf
  script:
    - phpize${PHP_VERSION}
    - ./configure --with-php-config=/usr/bin/php-config${PHP_VERSION}
    - make clean
    - make
    - php${PHP_VERSION} -d extension=modules/interbase.so -m | grep interbase
    - echo "✅ PHP ${PHP_VERSION} build successful"
  artifacts:
    paths:
      - modules/interbase.so
    expire_in: 1 hour
  allow_failure: false

# Stage 3: Unit and integration testing
test:cpp17-unit-tests:
  stage: test
  image: ubuntu:22.04
  before_script:
    - apt-get update -qq
    - apt-get install -y g++ libgtest-dev cmake build-essential
    - cd /usr/src/gtest && cmake . && make && cp lib/*.a /usr/lib/
  script:
    - g++ -std=c++17 -lgtest -lgtest_main -pthread tests/cpp17_wrapper_test.cpp -o test_runner
    - ./test_runner
    - echo "✅ C++17 unit tests passed"
  allow_failure: false

test:performance-benchmarks:
  stage: test
  image: ubuntu:22.04
  before_script:
    - apt-get update -qq
    - apt-get install -y g++
  script:
    - g++ -std=c++17 tests/performance_benchmark.cpp -o benchmark_runner
    - ./benchmark_runner > performance_baseline.txt
    - echo "✅ Performance benchmarks established"
  artifacts:
    paths:
      - performance_baseline.txt
    expire_in: 1 week

# Stage 4: Static analysis integration
static-analysis:clang-tidy:
  stage: static-analysis
  image: ubuntu:22.04
  before_script:
    - apt-get update -qq
    - apt-get install -y clang-tools-17 bear make gcc php8.1-dev libfirebird-dev
    - ln -sf /usr/bin/clang-tidy-17 /usr/bin/clang-tidy
  script:
    - bear -- make clean && bear -- make
    - clang-tidy firebird_utils.cpp --config-file=.clang-tidy --warnings-as-errors='modernize-use-nullptr,performance-*'
    - echo "✅ clang-tidy analysis passed"
  artifacts:
    reports:
      codequality: clang-tidy-report.json
  allow_failure: false

static-analysis:cppcheck:
  stage: static-analysis
  image: ubuntu:22.04
  before_script:
    - apt-get update -qq
    - apt-get install -y cppcheck xmllint
  script:
    - cppcheck firebird_utils.cpp --config-file=.cppcheck --xml --xml-version=2 --output-file=cppcheck-report.xml
    - ERRORS=$(xmllint --xpath 'count(//error[@severity="error"])' cppcheck-report.xml 2>/dev/null || echo 0)
    - if [ "$ERRORS" -gt 0 ]; then echo "❌ Cppcheck found $ERRORS errors" && exit 1; fi
    - echo "✅ Cppcheck analysis passed"
  artifacts:
    reports:
      codequality: cppcheck-report.xml
  allow_failure: false

# Stage 5: Memory safety validation
memory-safety:address-sanitizer:
  stage: memory-safety
  image: ubuntu:22.04
  before_script:
    - apt-get update -qq
    - apt-get install -y gcc clang php8.1-dev libfirebird-dev
  script:
    - make clean
    - CXXFLAGS="-fsanitize=address -fno-omit-frame-pointer -g -O1" make firebird_utils.lo
    - export ASAN_OPTIONS="abort_on_error=1:check_initialization_order=1"
    - php -d extension=modules/interbase.so -m | grep interbase
    - echo "✅ AddressSanitizer validation passed"
  artifacts:
    paths:
      - asan-report.log
  allow_failure: false

memory-safety:valgrind:
  stage: memory-safety
  image: ubuntu:22.04
  before_script:
    - apt-get update -qq
    - apt-get install -y valgrind php8.1-dev libfirebird-dev
  script:
    - valgrind --tool=memcheck --leak-check=full php -d extension=modules/interbase.so -r "echo 'Memory safety test';"
    - echo "✅ Valgrind validation passed"
  artifacts:
    paths:
      - valgrind-report.log
  allow_failure: true  # Advisory only

# Stage 6: Performance regression detection
performance:regression-check:
  stage: performance
  image: ubuntu:22.04
  dependencies:
    - test:performance-benchmarks
  script:
    - g++ -std=c++17 tests/performance_benchmark.cpp -o benchmark_runner
    - ./benchmark_runner > current_performance.txt
    - echo "Performance regression analysis - comparing with baseline..."
    - diff performance_baseline.txt current_performance.txt || echo "Performance differences detected (review recommended)"
    - echo "✅ Performance regression check completed"
  artifacts:
    paths:
      - current_performance.txt
  allow_failure: true

# Stage 7: Cross-platform compilation validation
cross-platform:linux-distributions:
  stage: cross-platform
  parallel:
    matrix:
      - OS_IMAGE: ["ubuntu:20.04", "ubuntu:22.04", "debian:11", "debian:12"]
  image: ${OS_IMAGE}
  before_script:
    - apt-get update -qq
    - apt-get install -y software-properties-common
    - if [ "${OS_IMAGE}" = "ubuntu:20.04" ] || [ "${OS_IMAGE}" = "ubuntu:22.04" ]; then add-apt-repository ppa:ondrej/php -y && apt-get update; fi
    - apt-get install -y php8.1-dev build-essential libfirebird-dev autoconf
  script:
    - phpize8.1
    - ./configure --with-php-config=/usr/bin/php-config8.1
    - make clean && make
    - php8.1 -d extension=modules/interbase.so -m | grep interbase
    - echo "✅ ${OS_IMAGE} compilation successful"
  allow_failure: false

# Quality gate summary
quality-gate:final-validation:
  stage: cross-platform
  image: ubuntu:22.04
  dependencies:
    - validate:c++-syntax
    - build:php-matrix
    - test:cpp17-unit-tests
    - static-analysis:clang-tidy
    - static-analysis:cppcheck
    - memory-safety:address-sanitizer
  script:
    - echo "=== Quality Gate Summary ==="
    - echo "✅ C++17 syntax validation passed"
    - echo "✅ Multi-version PHP builds successful"
    - echo "✅ Unit tests passed"
    - echo "✅ Static analysis clean"
    - echo "✅ Memory safety validated"
    - echo "✅ All quality gates PASSED"
  allow_failure: false

# Artifact collection for releases
collect:release-artifacts:
  stage: cross-platform
  image: ubuntu:22.04
  dependencies:
    - build:php-matrix
  script:
    - mkdir -p artifacts/
    - cp modules/interbase.so artifacts/
    - cp docs/development/PHASE3_COMPLETE_FINAL_REPORT.md artifacts/
    - tar -czf php-firebird-cpp17-modernized.tar.gz artifacts/
    - echo "✅ Release artifacts created"
  artifacts:
    paths:
      - php-firebird-cpp17-modernized.tar.gz
    expire_in: 1 month
  rules:
    - if: $CI_COMMIT_TAG
