# Gitleaks configuration for php-firebird
# Excludes false positives from third-party code and test fixtures

[extend]
# Use default rules as base
useDefault = true

# =============================================================================
# IPADP L2 Privacy Validation — custom rules for satware internal patterns
# This repo is PUBLIC. Internal infrastructure URLs must never leak.
# Replaces the deleted scripts/check-privacy-leaks.sh with CI-native rules.
# =============================================================================

[[rules]]
id = "satware-internal-urls"
description = "satware internal infrastructure URL in public repo"
regex = '''gitlab\.satware\.com|git\.satware\.ai|mattermost\.satware\.com|wiki\.satware\.com'''
tags = ["ipadp", "privacy", "L2"]

[[rules]]
id = "satware-private-ips"
description = "private IP address in public repo"
regex = '''\b(?:10\.\d{1,3}\.\d{1,3}\.\d{1,3}|172\.(?:1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3})\b'''
tags = ["ipadp", "privacy", "L2"]

[allowlist]
description = "php-firebird repository allowlist"

# Exclude vendor directory, IDE files, and test fixtures (known credentials)
paths = [
    '''vendor/.*''',
    '''node_modules/.*''',
    '''\.idea/.*''',
    # Historical files that contained internal URLs/IPs as tooling/documentation
    # (now deleted from working tree, but present in git history)
    '''scripts/check-privacy-leaks\.sh''',
    '''scripts/daily-routine\.sh''',
    '''scripts/morning-health-check\.sh''',
    '''NEXT_STEPS\.md''',
    '''docs/UPSTREAM_ISSUE_ANALYSIS\.md''',
    # CHANGELOG.md v13.2.1 entry (commit 81b3cb1) described the privacy check
    # using literal hostnames. Fixed in v13.2.2 but the commit is in history.
    '''CHANGELOG\.md''',
    # Accidental docs/sql-reference/ dir contained SQL examples that triggered
    # false private-key PEM regex match (deleted in commit 313321c, still in history)
    '''docs/sql-reference/.*''',
    # Test files use known Firebird credentials (masterkey/klopf) against local Docker
    '''tests/.*\.phpt$''',
    '''tests/.*\.inc$''',
    '''tests/.*\.php$''',
    '''specs/.*.md$''',
]

# Exclude test debug scripts (contain Docker base image GPG keys, not secrets)
files = [
    '''tests/.*_debug.*\.sh$''',
    '''tests/.*_simple_.*\.sh$''',
    '''.*_test_results.*\.txt$''',
]

# GPG key fingerprints from Docker PHP base images are not secrets
regexes = [
    '''1198C0117593497A5EC5C199286AF1F9897469DC''',
    '''AFD8691FDAEDF03BDF6E460563F15A9B715376CA''',
    '''C28D937575603EB4ABB''',
]

# Sodium cryptographic function names and Firebird test credentials are not secrets
# - masterkey: well-known SYSDBA default password (used in all Firebird test files)
# - klopf: Amicron demo DB public credential (from amicron-software.de demo download)
stopwords = [
    "sodium_crypto_aead",
    "CURLOPT_TLS13_CIPHERS",
    "chacha20poly1305",
    "xchacha20poly1305",
    "aegis256",
    "masterkey",
    "klopf",
]
