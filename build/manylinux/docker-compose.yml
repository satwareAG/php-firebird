# =============================================================================
# PHP Firebird Extension - Manylinux Builder Compose
# =============================================================================
#
# Local development compose file for building precompiled extensions.
#
# Usage:
#   # Build the builder image
#   docker compose -f build/manylinux/docker-compose.yml build
#
#   # Build extension for PHP 8.4 NTS
#   docker compose -f build/manylinux/docker-compose.yml run builder 8.4 nts x86_64
#
#   # Build all variants
#   docker compose -f build/manylinux/docker-compose.yml run builder-all
#
# =============================================================================

services:
  builder:
    build:
      context: .
      dockerfile: Dockerfile
    image: php-firebird-builder:latest
    volumes:
      - ../../:/src:rw
    working_dir: /src
    environment:
      - FB_ROOT=/opt/firebird
    # Default: PHP 8.4 NTS x86_64
    # Override via: docker compose run builder 8.3 zts x86_64

  # Build all PHP versions and variants
  builder-all:
    build:
      context: .
      dockerfile: Dockerfile
    image: php-firebird-builder:latest
    volumes:
      - ../../:/src:rw
    working_dir: /src
    environment:
      - FB_ROOT=/opt/firebird
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e
        for ver in 8.2 8.3 8.4; do
          for variant in nts zts; do
            echo ""
            echo "========================================"
            echo "Building PHP $${ver} ($${variant})"
            echo "========================================"
            /usr/local/bin/entrypoint.sh $${ver} $${variant} x86_64 || {
              echo "WARNING: Build failed for PHP $${ver} $${variant}"
            }
          done
        done
        echo ""
        echo "=== All builds completed ==="
        ls -la /src/dist/*.tar.gz 2>/dev/null || echo "No packages built"

  # Verification service - test bundles on target distros
  verify-ubuntu:
    image: ubuntu:20.04
    volumes:
      - ../../:/src:ro
    working_dir: /src
    entrypoint: /bin/bash
    command:
      - -c
      - |
        apt-get update -qq && apt-get install -y -qq php-cli ldd patchelf > /dev/null 2>&1 || true
        echo "=== Verifying on Ubuntu 20.04 ==="
        for bundle in /src/dist/*.tar.gz; do
          if [ -f "$$bundle" ]; then
            echo "Testing: $$bundle"
            ./scripts/verify-bundle.sh "$$bundle" --verbose || true
          fi
        done

  verify-debian:
    image: debian:buster
    volumes:
      - ../../:/src:ro
    working_dir: /src
    entrypoint: /bin/bash
    command:
      - -c
      - |
        apt-get update -qq && apt-get install -y -qq php-cli ldd patchelf > /dev/null 2>&1 || true
        echo "=== Verifying on Debian Buster ==="
        for bundle in /src/dist/*.tar.gz; do
          if [ -f "$$bundle" ]; then
            echo "Testing: $$bundle"
            ./scripts/verify-bundle.sh "$$bundle" --verbose || true
          fi
        done

  verify-rocky:
    image: rockylinux:8
    volumes:
      - ../../:/src:ro
    working_dir: /src
    entrypoint: /bin/bash
    command:
      - -c
      - |
        dnf install -y -q php-cli patchelf > /dev/null 2>&1 || true
        echo "=== Verifying on Rocky Linux 8 ==="
        for bundle in /src/dist/*.tar.gz; do
          if [ -f "$$bundle" ]; then
            echo "Testing: $$bundle"
            ./scripts/verify-bundle.sh "$$bundle" --verbose || true
          fi
        done
