# Modern Docker Compose format (V2+)
name: php-firebird-dev

services:
  # PHP Development Containers
  php81-dev:
    build:
      context: php
      dockerfile: Dockerfile-8.1
    volumes:
      - ..:/ext
    user: "${CURRENT_UID:-1000}:${CURRENT_GID:-1000}"
    working_dir: /ext
    command: tail -f /dev/null
    environment:
      - PHP_IDE_CONFIG=serverName=php-firebird-dev
      - XDEBUG_CONFIG=client_host=host.docker.internal
      - FIREBIRD_HOST=firebird40
      - FIREBIRD_DB_DIR=/firebird
      - PHP_DISMOD=ioncube
      - TZ=Europe/Berlin
      # Full connect string for tests that want to talk directly to the
      # Firebird 4 engine without going through interbase.inc's $test_base.
      # This matches the "localhost/3052:/firebird/data/test.fdb" pattern
      # suggested in ibase_connect_dpb_001.phpt, but targets the firebird40
      # service and its shared data volume.
      - FB_HOST=firebird30:/firebird/data/test.fdb
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - firebird25
      - firebird30
      - firebird40
      - firebird50

  php82-dev:
    build:
      context: php
      dockerfile: Dockerfile-8.2
    volumes:
      - ..:/ext
    user: "${CURRENT_UID:-1000}:${CURRENT_GID:-1000}"
    working_dir: /ext
    command: tail -f /dev/null
    environment:
      - PHP_IDE_CONFIG=serverName=php-firebird-dev
      - XDEBUG_CONFIG=client_host=host.docker.internal
      - FIREBIRD_HOST=firebird40
      - FIREBIRD_DB_DIR=/firebird
      - TZ=Europe/Berlin
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - firebird25
      - firebird30
      - firebird40
      - firebird50

  php83-dev:
    build:
      context: php
      dockerfile: Dockerfile-8.3
    volumes:
      - ..:/ext
    user: "${CURRENT_UID:-1000}:${CURRENT_GID:-1000}"
    working_dir: /ext
    command: tail -f /dev/null
    environment:
      - PHP_IDE_CONFIG=serverName=php-firebird-dev
      - XDEBUG_CONFIG=client_host=host.docker.internal
      - FIREBIRD_HOST=firebird40
      - FIREBIRD_DB_DIR=/firebird
      - TZ=Europe/Berlin
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - firebird25
      - firebird30
      - firebird40
      - firebird50

  php84-dev:
    build:
      context: php
      dockerfile: Dockerfile-8.4
    volumes:
      - ..:/ext
      - fb40-data:/firebird
    user: "${CURRENT_UID:-1000}:${CURRENT_GID:-1000}"
    working_dir: /ext
    command: tail -f /dev/null
    environment:
      - PHP_IDE_CONFIG=serverName=php-firebird-dev
      - XDEBUG_CONFIG=client_host=host.docker.internal
      - FIREBIRD_HOST=firebird40
      - FIREBIRD_DB_DIR=/firebird
      - TZ=Europe/Berlin
      # Full connect string for tests that want to talk directly to the
      # Firebird 4 engine without going through interbase.inc's $test_base.
      # This matches the "localhost/3052:/firebird/data/test.fdb" pattern
      # suggested in ibase_connect_dpb_001.phpt, but targets the firebird40
      # service and its shared data volume.
      - FB_HOST=firebird40:/firebird/data/test.fdb
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - firebird25
      - firebird30
      - firebird40
      - firebird50

  php85-dev:
    build:
      context: php
      dockerfile: Dockerfile-8.5
    volumes:
      - ..:/ext
      - fb40-data:/firebird
    user: "${CURRENT_UID:-1000}:${CURRENT_GID:-1000}"
    working_dir: /ext
    command: tail -f /dev/null
    environment:
      - PHP_IDE_CONFIG=serverName=php-firebird-dev
      - XDEBUG_CONFIG=client_host=host.docker.internal
      - FIREBIRD_HOST=firebird40
      - FIREBIRD_DB_DIR=/firebird
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - firebird25
      - firebird30
      - firebird40
      - firebird50

  # Firebird Database Containers
  firebird25:
    image: "jacobalberty/firebird:2.5-ss"
    environment:
      ISC_PASSWORD: masterkey
      FIREBIRD_DATABASE: test.fdb
      FIREBIRD_USER: SYSDBA
      FIREBIRD_PASSWORD: masterkey
      TZ: Europe/Berlin
    volumes:
      - fb25-data:/firebird/data

  firebird30:
    image: firebirdsql/firebird:3
    environment:
      ISC_PASSWORD: masterkey
      FIREBIRD_DATABASE: test.fdb
      FIREBIRD_USER: SYSDBA
      FIREBIRD_PASSWORD: masterkey
      TZ: Europe/Berlin
    volumes:
      - fb30-data:/firebird/data

  firebird40:
    image: firebirdsql/firebird:4
    environment:
      ISC_PASSWORD: masterkey
      FIREBIRD_DATABASE: test.fdb
      FIREBIRD_USER: SYSDBA
      FIREBIRD_PASSWORD: masterkey
      TZ: Europe/Berlin
    volumes:
      - fb40-data:/firebird/data

  firebird50:
    image: firebirdsql/firebird:5
    environment:
      ISC_PASSWORD: masterkey
      FIREBIRD_DATABASE: test.fdb
      FIREBIRD_USER: SYSDBA
      FIREBIRD_PASSWORD: masterkey
      TZ: Europe/Berlin
    volumes:
      - fb50-data:/firebird/data

volumes:
  fb25-data:
  fb30-data:
  fb40-data:
  fb50-data:
