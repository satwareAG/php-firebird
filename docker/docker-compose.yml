# Modern Docker Compose format (V2+)
name: php-firebird-dev

services:
  # PHP Development Containers
  php82-dev:
    build:
      context: php
      dockerfile: Dockerfile-8.2
    volumes:
      - ..:/ext
    user: "${CURRENT_UID:-1000}:${CURRENT_GID:-1000}"
    working_dir: /ext
    command: tail -f /dev/null
    environment:
      - PHP_IDE_CONFIG=serverName=php-firebird-dev
      - XDEBUG_CONFIG=client_host=host.docker.internal
      - FIREBIRD_HOST=firebird40
      - FIREBIRD_DB_DIR=/firebird
      - TZ=Europe/Berlin
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - firebird30
      - firebird40
      - firebird50

  php83-dev:
    build:
      context: php
      dockerfile: Dockerfile-8.3
    volumes:
      - ..:/ext
    user: "${CURRENT_UID:-1000}:${CURRENT_GID:-1000}"
    working_dir: /ext
    command: tail -f /dev/null
    environment:
      - PHP_IDE_CONFIG=serverName=php-firebird-dev
      - XDEBUG_CONFIG=client_host=host.docker.internal
      - FIREBIRD_HOST=firebird40
      - FIREBIRD_DB_DIR=/firebird
      - TZ=Europe/Berlin
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - firebird30
      - firebird40
      - firebird50

  php84-dev:
    build:
      context: php
      dockerfile: Dockerfile-8.4
    volumes:
      - ..:/ext
      - fb40-data:/firebird
    user: "${CURRENT_UID:-1000}:${CURRENT_GID:-1000}"
    working_dir: /ext
    command: tail -f /dev/null
    environment:
      - PHP_IDE_CONFIG=serverName=php-firebird-dev
      - XDEBUG_CONFIG=client_host=host.docker.internal
      - FIREBIRD_HOST=firebird40
      - FIREBIRD_DB_DIR=/firebird
      - TZ=Europe/Berlin
      # Full connect string for tests that want to talk directly to the
      # Firebird 4 engine without going through common.inc's $test_base.
      # This matches the "localhost/3052:/firebird/data/test.fdb" pattern
      # suggested in fbird_connect_dpb_001.phpt, but targets the firebird40
      # service and its shared data volume.
      - FB_HOST=firebird40:/firebird/data/test.fdb
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - firebird30
      - firebird40
      - firebird50

  php85-dev:
    build:
      context: php
      dockerfile: Dockerfile-8.5
    volumes:
      - ..:/ext
      - fb40-data:/firebird
    user: "${CURRENT_UID:-1000}:${CURRENT_GID:-1000}"
    working_dir: /ext
    command: tail -f /dev/null
    environment:
      - PHP_IDE_CONFIG=serverName=php-firebird-dev
      - XDEBUG_CONFIG=client_host=host.docker.internal
      - FIREBIRD_HOST=firebird40
      - FIREBIRD_DB_DIR=/firebird
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - firebird30
      - firebird40
      - firebird50

  # PHP 8.4 with Firebird 3.0 Client Library
  # For testing extension compilation against Firebird 3.0 client
  php84-fb3-dev:
    build:
      context: php
      dockerfile: Dockerfile-8.4-fb3
    volumes:
      - ..:/ext
      - fb30-data:/firebird
    user: "${CURRENT_UID:-1000}:${CURRENT_GID:-1000}"
    working_dir: /ext
    command: tail -f /dev/null
    environment:
      - PHP_IDE_CONFIG=serverName=php-firebird-dev
      - XDEBUG_CONFIG=client_host=host.docker.internal
      - FIREBIRD_HOST=firebird30
      - FIREBIRD_DB_DIR=/firebird
      - FIREBIRD_HOME=/opt/firebird
      - LD_LIBRARY_PATH=/opt/firebird/lib
      - TZ=Europe/Berlin
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - firebird30

  # PHP 8.5 with Firebird 5.x Client Library
  # For testing extension against the latest Firebird client
  php85-fb5-dev:
    build:
      context: php
      dockerfile: Dockerfile-8.5-fb5
    volumes:
      - ..:/ext
      - fb50-data:/firebird
    user: "${CURRENT_UID:-1000}:${CURRENT_GID:-1000}"
    working_dir: /ext
    command: tail -f /dev/null
    environment:
      - PHP_IDE_CONFIG=serverName=php-firebird-dev
      - XDEBUG_CONFIG=client_host=host.docker.internal
      - FIREBIRD_HOST=firebird50
      - FIREBIRD_DB_DIR=/firebird
      - FIREBIRD_HOME=/opt/firebird
      - LD_LIBRARY_PATH=/opt/firebird/lib
      - TZ=Europe/Berlin
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - firebird50

  # PHP 8.3 with AddressSanitizer
  # ASAN_OPTIONS, USE_ZEND_ALLOC, ZEND_DONT_UNLOAD_MODULES are set in Dockerfile-asan
  # with PHP-src compatible values (exitcode=139, abort_on_error=0)
  php83-asan:
    build:
      context: php
      dockerfile: Dockerfile-asan
    volumes:
      - ..:/ext
    # Note: ASan often requires root or specific ptrace capabilities,
    # but we'll try with the current user first. If it fails, we might need root.
    # user: "${CURRENT_UID:-1000}:${CURRENT_GID:-1000}"
    working_dir: /ext
    command: tail -f /dev/null
    environment:
      - PHP_IDE_CONFIG=serverName=php-firebird-dev
      - FIREBIRD_HOST=firebird40
      - FIREBIRD_DB_DIR=/firebird
      - TZ=Europe/Berlin
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - firebird40

  # Firebird Database Containers
  firebird30:
    image: firebirdsql/firebird:3
    environment:
      ISC_PASSWORD: masterkey
      FIREBIRD_DATABASE: test.fdb
      FIREBIRD_USER: SYSDBA
      FIREBIRD_PASSWORD: masterkey
      TZ: Europe/Berlin
    volumes:
      - fb30-data:/firebird/data

  firebird40:
    image: firebirdsql/firebird:4
    environment:
      ISC_PASSWORD: masterkey
      FIREBIRD_DATABASE: test.fdb
      FIREBIRD_USER: SYSDBA
      FIREBIRD_PASSWORD: masterkey
      TZ: Europe/Berlin
    volumes:
      - fb40-data:/firebird/data

  firebird50:
    image: firebirdsql/firebird:5
    environment:
      ISC_PASSWORD: masterkey
      FIREBIRD_DATABASE: test.fdb
      FIREBIRD_USER: SYSDBA
      FIREBIRD_PASSWORD: masterkey
      TZ: Europe/Berlin
    volumes:
      - fb50-data:/firebird/data
      # Init script to create test.fdb on container first start
      # Fixes: https://github.com/satwareAG/php-firebird/issues/44
      - ./firebird/init-test-db.sh:/docker-entrypoint-initdb.d/init-test-db.sh:ro

volumes:
  fb30-data:
  fb40-data:
  fb50-data: