# Modern Docker Compose format (V2+)
name: php-firebird-dev

services:
  # PHP Development Containers
  php81-dev:
    build:
      context: environments/docker/php
      dockerfile: Dockerfile-8.1
      target: dev
    volumes:
      - ..:/ext
    working_dir: /ext
    environment:
      - PHP_IDE_CONFIG=serverName=php-firebird-dev
      - XDEBUG_CONFIG=client_host=host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - firebird25
      - firebird30
      - firebird40
      - firebird50

  php82-dev:
    build:
      context: environments/docker/php
      dockerfile: Dockerfile-8.2
    volumes:
      - ..:/ext
    working_dir: /ext
    environment:
      - PHP_IDE_CONFIG=serverName=php-firebird-dev
      - XDEBUG_CONFIG=client_host=host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - firebird25
      - firebird30
      - firebird40
      - firebird50

  php83-dev:
    build:
      context: environments/docker/php
      dockerfile: Dockerfile-8.3
    volumes:
      - ..:/ext
    working_dir: /ext
    environment:
      - PHP_IDE_CONFIG=serverName=php-firebird-dev
      - XDEBUG_CONFIG=client_host=host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - firebird25
      - firebird30
      - firebird40
      - firebird50

  php84-dev:
    build:
      context: environments/docker/php
      dockerfile: Dockerfile-8.4
    volumes:
      - ..:/ext
    working_dir: /ext
    environment:
      - PHP_IDE_CONFIG=serverName=php-firebird-dev
      - XDEBUG_CONFIG=client_host=host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - firebird25
      - firebird30
      - firebird40
      - firebird50

  # Firebird Database Containers
  firebird25:
    image: "jacobalberty/firebird:2.5-ss"
    environment:
      ISC_PASSWORD: masterkey
      FIREBIRD_DATABASE: test.fdb
      FIREBIRD_USER: SYSDBA
      FIREBIRD_PASSWORD: masterkey
    volumes:
      - fb25-data:/firebird
    ports:
      - "3050:3050"

  firebird30:
    image: firebirdsql/firebird:3
    environment:
      ISC_PASSWORD: masterkey
      FIREBIRD_DATABASE: test.fdb
      FIREBIRD_USER: SYSDBA
      FIREBIRD_PASSWORD: masterkey
    volumes:
      - fb30-data:/firebird
    ports:
      - "3051:3050"

  firebird40:
    image: firebirdsql/firebird:4
    environment:
      ISC_PASSWORD: masterkey
      FIREBIRD_DATABASE: test.fdb
      FIREBIRD_USER: SYSDBA
      FIREBIRD_PASSWORD: masterkey
    volumes:
      - fb40-data:/firebird
    ports:
      - "3052:3050"

  firebird50:
    image: firebirdsql/firebird:5
    environment:
      ISC_PASSWORD: masterkey
      FIREBIRD_DATABASE: test.fdb
      FIREBIRD_USER: SYSDBA
      FIREBIRD_PASSWORD: masterkey
    volumes:
      - fb50-data:/firebird
    ports:
      - "3053:3050"

volumes:
  fb25-data:
  fb30-data:
  fb40-data:
  fb50-data:
